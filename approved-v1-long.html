view", "plate": "image-8", "foreground": "image-9", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 48.2, "anchorY": 86.1}, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 19.44, "spokenEnd": 29.96, "cues": [{"start": 19.44, "end": 23.450386740331492, "text": "To understand how a stolen masterpiece\nended up back in public, start"}, {"start": 23.450386740331492, "end": 27.51889502762431, "text": "with what the museum had lost: one\nsmall wooden panel, and a face that"}, {"start": 27.51889502762431, "end": 30.08, "text": "was about to become\neven harder to forget."}]}, {"id": "scene-8", "sentence": "The date was August twenty-first, nineteen eleven.", "start": 30.08, "end": 33.4, "route": "B", "plate": "image-10", "foreground": "image-11", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 50, "anchorY": 70}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "annotation": {"text": "21 AUGUST\n1911", "left": 34, "top": 40, "width": 32, "fontScene": 0.032}, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 30.08, "spokenEnd": 33.28, "cues": [{"start": 30.08, "end": 33.4, "text": "The date was August\ntwenty-first, nineteen eleven."}]}, {"id": "scene-9", "sentence": "The thief was Vincenzo Peruggia, a glazier who had worked at the Louvre.", "start": 33.4, "end": 38.16, "route": "B", "plate": "image-12", "foreground": "image-13", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 48.5, "anchorY": 90.5}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 33.4, "spokenEnd": 38.04, "cues": [{"start": 33.4, "end": 38.16, "text": "The thief was Vincenzo Peruggia, a\nglazier who had worked at the Louvre."}]}, {"id": "scene-10", "sentence": "He had a connection to the building, and he took an object that was much less flexible than a movie-style rolled canvas.", "start": 38.16, "end": 44.4, "route": "B", "plate": "image-14", "foreground": "image-15", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 47.9, "anchorY": 87.3}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 38.16, "spokenEnd": 44.28, "cues": [{"start": 38.16, "end": 41.862857142857145, "text": "He had a connection to the building,\nand he took an object that was much"}, {"start": 41.862857142857145, "end": 44.4, "text": "less flexible than a\nmovie-style rolled canvas."}]}, {"id": "scene-11", "sentence": "The Mona Lisa was painted on a wooden panel.", "start": 44.4, "end": 47.04, "route": "B", "plate": "image-8", "foreground": "image-9", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 48.2, "anchorY": 86.1}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 44.4, "spokenEnd": 46.92, "cues": [{"start": 44.4, "end": 47.04, "text": "The Mona Lisa was painted\non a wooden panel."}]}, {"id": "scene-12", "sentence": "The museum was now missing a Leonardo, and offers of rewards did not solve the case.", "start": 47.04, "end": 51.92, "route": "B", "plate": "image-16", "foreground": "image-17", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 50, "anchorY": 73}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "annotation": {"text": "REWARD\nOFFERED", "left": 38, "top": 35, "width": 24, "fontScene": 0.029}, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 47.04, "spokenEnd": 51.8, "cues": [{"start": 47.04, "end": 50.596923076923076, "text": "The museum was now missing a Leonardo,\nand offers of rewards did not"}, {"start": 50.596923076923076, "end": 51.92, "text": "solve the case."}]}, {"id": "scene-13", "sentence": "The painting remained out of public view while news of its disappearance traveled far beyond Paris.", "start": 51.92, "end": 57.36, "route": "B", "plate": "image-0", "foreground": "image-6", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6, "cameraStart": 1, "cameraEnd": 1}, "label": "Illustrated reconstruction · Narrated preview", "spokenStart": 51.92, "spokenEnd": 57.24, "cues": [{"start": 51.92, "end": 55.82857142857143, "text": "The painting remained out of public\nview while news of its disappearance"}, {"start": 55.82857142857143, "end": 57.36, "text": "traveled far beyond Paris."}]}, {"id": "scene-14", "sentence": "Rewards were offered.", "start": 57.36, "end": 58.92, "route": "B", "plate": "image-18", "foreground": "image-19", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.4, "anchorY": 78}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 57.36, "spokenEnd": 58.8, "cues": [{"start": 57.36, "end": 58.92, "text": "Rewards were offered."}]}, {"id": "scene-15", "sentence": "News of the disappearance spread.", "start": 58.92, "end": 60.92, "route": "B", "plate": "image-20", "foreground": "image-21", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.5, "anchorY": 83.6}, "moti e": "B", "plate": "image-30", "foreground": "image-31", "placement": {"left": 0, "top": -2, "width": 100, "anchorX": 50, "anchorY": 68.8}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "annotation": {"text": "1913", "left": 35, "top": 42, "width": 30, "fontScene": 0.055}, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 93.0, "spokenEnd": 94.64, "cues": [{"start": 93.0, "end": 94.76, "text": "Then nineteen thirteen."}]}, {"id": "scene-25", "sentence": "The painting had not gone back to the Louvre.", "start": 94.76, "end": 97.32, "route": "B", "plate": "image-32", "foreground": "image-33", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 19.7, "anchorY": 100}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 94.76, "spokenEnd": 97.2, "cues": [{"start": 94.76, "end": 97.32, "text": "The painting had not\ngone back to the Louvre."}]}, {"id": "scene-26", "sentence": "Peruggia had kept it in Paris, before taking it to Italy.", "start": 97.32, "end": 100.84, "route": "B", "plate": "image-34", "foreground": "image-35", "placement": {"left": -6, "top": 0, "width": 100, "anchorX": 38, "anchorY": 100}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 97.32, "spokenEnd": 100.72, "cues": [{"start": 97.32, "end": 100.84, "text": "Peruggia had kept it in Paris,\nbefore taking it to Italy."}]}, {"id": "scene-27", "sentence": "The breakthrough began not with a dramatic chase, but with correspondence.", "start": 100.84, "end": 104.8, "route": "B", "plate": "image-36", "foreground": "image-37", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 38.2, "anchorY": 73.4}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 100.84, "spokenEnd": 104.68, "cues": [{"start": 100.84, "end": 103.58962962962964, "text": "The breakthrough began not\nwith a dramatic chase, but with"}, {"start": 103.58962962962964, "end": 104.8, "text": "correspondence."}]}, {"id": "scene-28", "sentence": "In November nineteen thirteen, a Florence art dealer named Alfredo Geri received a letter signed Leonard V.", "start": 104.8, "end": 111.8, "route": "B", "plate": "image-38", "foreground": "image-39", "placement": {"left": -6, "top": 0, "width": 100, "anchorX": 49.6, "anchorY": 80.7}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 104.8, "spokenEnd": 111.68, "cues": [{"start": 104.8, "end": 109.40830188679246, "text": "In November nineteen thirteen, a\nFlorence art dealer named Alfredo Geri"}, {"start": 109.40830188679246, "end": 111.8, "text": "received a letter signed Leonard V."}]}, {"id": "scene-29", "sentence": "The writer offered the missing masterpiece.", "start": 111.8, "end": 114.4, "route": "B", "plate": "image-0", "foreground": "image-6", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6, "cameraStart": 1, "cameraEnd": 1}, "label": "Illustrated reconstruction · Narrated preview", "spokenStart": 111.8, "spokenEnd": 114.28, "cues": [{"start": 111.8, "end": 114.4, "text": "The writer offered the\nmissing masterpiece."}]}, {"id": "scene-30", "sentence": "Suddenly this was no longer only a story about an absence on a museum wall.", "start": 114.4, "end": 118.72, "route": "B", "plate": "image-38", "foreground": "image-39", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.6, "anchorY": 80.7}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 114.4, "spokenEnd": 118.6, "cues": [{"start": 114.4, "end": 117.55, "text": "Suddenly this was no longer only a\nstory about an absence on a museum"}, {"start": 117.55, "end": 118.72, "text": "wall."}]}, {"id": "scene-31", "sentence": "There was someone claiming to have the object, and a possible way to see it.", "start": 118.72, "end": 122.68, "route": "B", "plate": "image-0", "foreground": "image-1", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6, "cameraStart": 1, "cameraEnd": 1}, "label": "Illustrated reconstruction · Narrated preview", "captionGroups": ["There was someone claiming to have the object, and", "a possible way to see it."], "spokenStart": 118.72, "spokenEnd": 122.56, "cues": [{"start": 118.72, "end": 121.28, "text": "There was someone claiming\nto have the object, and"}, {"start": 121.28, "end": 122.68, "text": "a possible way to see it."}]}, {"id": "scene-32", "sentence": "The letter was dated November twenty-fourth.", "start": 122.68, "end": 125.2, "route": "B", "plate": "image-40", "foreground": "image-41", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.5, "anchorY": 68.4}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "annotation": {"text": "24 NOV\n1913", "left": 33.5, "top": 41, "width": 32, "fontScene": 0.03}, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 122.68, "spokenEnd": 125.08, "cues": [{"start": 122.68, "end": 125.2, "text": "The letter was dated\nNovember twenty-fourth."}]}, {"id": "scene-33", "sentence": "Peruggia had found Geri through a newspaper advertisement.", "start": 125.2, "end": 128.44, "route": "B", "plate": "image-42", "foreground": "image-43", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 50, "anchorY": 83.7}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "annotation": {"text": "DEALER\nADVERTISEMENT", "left": 51.5, "top": 28.5, "width": 14, "fontScene": 0.014}, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 125.2, "spokenEnd": 128.32, "cues": [{"start": 125.2, "end": 128.44, "text": "Peruggia had found Geri through\na newspaper advertisement."}]}, {"id": "scene-34", "sentence": "Their correspondence continued, and on December tenth he arrived in Florence.", "start": 128.44, "end": 132.76, "route": "B", "plate": "image-44", "foreground": "image-45", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 40, "anchorY": 100}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 128.44, "spokenEnd": 132.64, "cues": [{"start": 128.44, "end": 131.56666666666666, "text": "Their correspondence continued,\nand on December tenth he arrived in"}, {"start": 131.56666666666666, "end": 132.76, "text": "Florence."}]}, {"id": "scene-35", "sentence": "He stayed at the Hotel Tripoli and visited Geri’s shop that afternoon.", "start": 132.76, "end": 136.56, "route": "B", "plate": "image-46", "foreground": "image-47", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 33, "anchorY": 100}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 132.76, "spokenEnd": 136.44, "cues": [{"start": 132.76, "end": 136.56, "text": "He stayed at the Hotel Tripoli and\nvisited Geri’s shop that afternoon."}]}, {"id": "scene-36", "sentence": "They arranged to meet again the next day.", "start": 136.56, "end": 138.88, "route": "B", "plate": "image-48", "foreground": "image-49", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.5, "anchorY": 75}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "annotation": {"text": "11 DEC\n1913", "left": 35, "top": 42, "width": 30, "fontScene": 0.033}, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 136.56, "spokenEnd": 138.76, "cues": [{"start": 136.56, "end": 138.88, "text": "They arranged to meet\nagain the next day."}]}, {"id": "scene-37", "sentence": "Geri would bring another man: Giovanni Poggi, director of the Uffizi.", "start": 138.88, "end": 143.2, "route": "B", "plate": "image-50", "foreground": "image-51", "placement": {"left": 0, "top": 0.7, "width": 100, "anchorX": 49.4, "anchorY": 100}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 138.88, "spokenEnd": 143.08, "cues": [{"start": 138.88, "end": 143.2, "text": "Geri would bring another man: Giovanni\nPoggi, director of the Uffizi."}]}, {"id": "scene-38", "sentence": "Peruggia did not know his role.", "start": 143.2, "end": 145.48, "route": "B", "plate": "image-0", "foreground": "image-6", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6, "cameraStart": 1, "cameraEnd": 1}, "label": "Illustrated reconstruction · Narrated preview", "spokenStart": 143.2, "spokenEnd": 145.36, "cues": [{"start": 143.2, "end": 145.48, "text": "Peruggia did not know his role."}]}, {"id": "scene-39", "sentence": "He was about to show a stolen Leonardo to a museum director.", "start": 145.48, "end": 149.24, "route": "B", "plate": "image-52", "foreground": "image-53", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 44.2, "anchorY": 100}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 145.48, "spokenEnd": 149.12, "cues": [{"start": 145.48, "end": 149.24, "text": "He was about to show a stolen\nLeonardo to a museum director."}]}, {"id": "scene-40", "sentence": "After more than two years, the next step was no longer another headline.", "start": 149.24, "end": 152.96, "route": "B", "plate": "image-54", "foreground": "image-55", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 36, "anchorY": 78.6}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 149.24, "spokenEnd": 152.84, "cues": [{"start": 149.24, "end": 152.96, "text": "After more than two years, the next\nstep was no longer another headline."}]}, {"id": "scene-41", "sentence": "It was an inspection.", "start": 152.96, "end": 154.56, "route": "B", "plate": "image-8", "foreground": "image-9", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 48, "anchorY": 86}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 152.96, "spokenEnd": 154.44, "cues": [{"start": 152.96, "end": 154.56, "text": "It was an inspection."}]}, {"id": "scene-42", "sentence": "On December eleventh, Geri and Giovanni Poggi, the director of the Uffizi, examined the work at Peruggia’s hotel.", "start": 154.56, "end": 162.0, "route": "B", "plate": "image-56", "foreground": "image-57", "placement": {"left": 0, "top": 0.7, "width": 100, "anchorX": 83.73, "anchorY": 100}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 154.56, "spokenEnd": 161.88, "cues": [{"start": 154.56, "end": 158.87357142857144, "text": "On December eleventh, Geri and\nGiovanni Poggi, the director of the"}, {"start": 158.87357142857144, "end": 162.0, "text": "Uffizi, examined the\nwork at Peruggia’s hotel."}]}, {"id": "scene-43", "sentence": "Poggi arranged for it to be taken to the Uffizi for a closer inspection.", "start": 162.0, "end": 166.24, "route": "B", "plate": "image-58", "foreground": "image-59", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 36.3, "anchorY": 100}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 162.0, "spokenEnd": 166.12, "cues": [{"start": 162.0, "end": 166.24, "text": "Poggi arranged for it to be taken to\nthe Uffizi for a closer inspection."}]}, {"id": "scene-44", "sentence": "That was the turning point.", "start": 166.24, "end": 168.04, "route": "B", "plate": "image-0", "foreground": "image-1", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6, "cameraStart": 1, "cameraEnd": 1}, "label": "Illustrated reconstruction · Narrated preview", "spokenStart": 166.24, "spokenEnd": 167.92, "cues": [{"start": 166.24, "end": 168.04, "text": "That was the turning point."}]}, {"id": "scene-45", "sentence": "The painting was no longer simply in the thief’s possession.", "start": 168.04, "end": 171.0, "route": "B", "plate": "image-60", "foreground": "image-61", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 44.7, "anchorY": 83.8}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 168.04, "spokenEnd": 170.88, "cues": [{"start": 168.04, "end": 171.0, "text": "The painting was no longer\nsimply in the thief’s possession."}]}, {"id": "scene-46", "sentence": "The next day, December twelfth, police arrested Peruggia.", "start": 171.0, "end": 174.6, "route": "B", "plate": "image-62", "foreground": "image-63", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 50, "anchorY": 100}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 171.0, "spokenEnd": 174.48, "cues": [{"start": 171.0, "end": 174.6, "text": "The next day, December twelfth,\npolice arrested Peruggia."}]}, {"id": "scene-47", "sentence": "More than two years after the theft, the missing work had been recovered in Florence.", "start": 174.6, "end": 179.48, "route": "B", "plate": "image-64", "foreground": "image-65", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 50, "anchorY": 77.9}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 174.6, "spokenEnd": 179.36, "cues": [{"start": 174.6, "end": 178.20757894736843, "text": "More than two years after the theft,\nthe missing work had been recovered"}, {"start": 178.20757894736843, "end": 179.48, "text": "in Florence."}]}, {"id": "scene-48", "sentence": "The contact he had initiated had led directly to its examination, and then to his arrest.", "start": 179.48, "end": 184.88, "route": "B", "plate": "image-36", "foreground": "image-37", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 38.2, "anchorY": 73.4}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "captionGroups": ["The contact he had initiated had led directly to its examination,", "and then to his arrest."], "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 179.48, "spokenEnd": 184.76, "cues": [{"start": 179.48, "end": 183.38, "text": "The contact he had initiated had\nled directly to its examination,"}, {"start": 183.38, "end": 184.88, "text": "and then to his arrest."}]}, {"id": "scene-49", "sentence": "Peruggia said he wanted to bring the painting back to Italy.", "start": 184.88, "end": 187.72, "route": "B", "plate": "image-66", "foreground": "image-67", "placement": {"left": 0, "top": 0.7, "width": 100, "anchorX": 36, "anchorY": 100}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 184.88, "spokenEnd": 187.6, "cues": [{"start": 184.88, "end": 187.72, "text": "Peruggia said he wanted to bring\nthe painting back to Italy."}]}, {"id": "scene-50", "sentence": "But Leonardo’s nationality was not the painting’s ownership history.", "start": 187.72, "end": 191.52, "route": "B", "plate": "image-0", "foreground": "image-6", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6, "cameraStart": 1, "cameraEnd": 1}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "spokenStart": 187.72, "spokenEnd": 191.4, "cues": [{"start": 187.72, "end": 191.52, "text": "But Leonardo’s nationality was not\nthe painting’s ownership history."}]}, {"id": "scene-51", "sentence": "The work had entered the French royal collection centuries before the theft.", "start": 191.52, "end": 195.48, "route": "B", "plate": "image-68", "foreground": "image-69", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 37, "anchorY": 84.6}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "captionGroups": ["The work had entered the French royal collection", "centuries before the theft."], "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 191.52, "spokenEnd": 195.36, "cues": [{"start": 191.52, "end": 193.97760000000002, "text": "The work had entered the\nFrench royal collection"}, {"start": 193.97760000000002, "end": 195.48, "text": "centuries before the theft."}]}, {"id": "scene-52", "sentence": "It had not been carried off from Italy by Napoleon, as a convenient version of the story might suggest.", "start": 195.48, "end": 201.2, "route": "B", "plate": "image-70", "foreground": "image-71", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 38.6, "anchorY": 78.2}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "annotation": {"text": "FALSE CLAIM\n“Taken by Napoleon”", "left": 17, "top": 43, "width": 43, "fontScene": 0.026}, "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 195.48, "spokenEnd": 201.08, "cues": [{"start": 195.48, "end": 199.15843137254902, "text": "It had not been carried off from\nItaly by Napoleon, as a convenient"}, {"start": 199.15843137254902, "end": 201.2, "text": "version of the story might suggest."}]}, {"id": "scene-53", "sentence": "Peruggia’s patriotic explanation was a claim, not proof that he had a right to take it.", "start": 201.2, "end": 206.36, "route": "B", "plate": "image-0", "foreground": "image-1", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6, "cameraStart": 1, "cameraEnd": 1}, "label": "Illustrated reconstruction · Narrated preview", "captionGroups": ["Peruggia’s patriotic explanation was a claim,", "not proof that he had a right to take it."], "labelBacking": true, "spokenStart": 201.2, "spokenEnd": 206.24, "cues": [{"start": 201.2, "end": 203.8372093023256, "text": "Peruggia’s patriotic\nexplanation was a claim,"}, {"start": 203.8372093023256, "end": 206.36, "text": "not proof that he had\na right to take it."}]}, {"id": "scene-54", "sentence": "The painting was now in official hands.", "start": 206.36, "end": 208.64, "route": "B", "plate": "image-60", "foreground": "image-61", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 44.7, "anchorY": 83.8}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 206.36, "spokenEnd": 208.52, "cues": [{"start": 206.36, "end": 208.64, "text": "The painting was now\nin official hands."}]}, {"id": "scene-55", "sentence": "The next question was not who would buy it, but how it would return to France.", "start": 208.64, "end": 212.6, "route": "B", "plate": "image-72", "foreground": "image-73", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 34, "anchorY": 68}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "captionGroups": ["The next question was not who would buy it,", "but how it would return to France."], "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 208.64, "spokenEnd": 212.48, "cues": [{"start": 208.64, "end": 210.78441558441557, "text": "The next question was\nnot who would buy it,"}, {"start": 210.78441558441557, "end": 212.6, "text": "but how it would return to France."}]}, {"id": "scene-56", "sentence": "Before the public display, the recovered painting was shown to a small group of art specialists in Poggi’s office.", "route": "A", "master": "image-74", "motion": {}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "start": 212.6, "end": 219.28, "spokenStart": 212.6, "spokenEnd": 219.16, "cues": [{"start": 212.6, "end": 216.6637168141593, "text": "Before the public display, the\nrecovered painting was shown to a small"}, {"start": 216.6637168141593, "end": 219.28, "text": "group of art specialists\nin Poggi’s office."}]}, {"id": "scene-57", "sentence": "First came a public appearance in Florence.", "start": 219.28, "end": 221.8, "route": "B", "plate": "image-75", "foreground": "image-76", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 25, "anchorY": 100}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 219.28, "spokenEnd": 221.68, "cues": [{"start": 219.28, "end": 221.8, "text": "First came a public\nappearance in Florence."}]}, {"id": "scene-58", "sentence": "From December fourteenth to eighteenth, the recovered painting was displayed at the Uffizi.", "start": 221.8, "end": 226.84, "route": "B", "plate": "image-77", "foreground": "image-78", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 34, "anchorY": 80}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 221.8, "spokenEnd": 226.72, "cues": [{"start": 221.8, "end": 225.40800000000002, "text": "From December fourteenth to\neighteenth, the recovered painting was"}, {"start": 225.40800000000002, "end": 226.84, "text": "displayed at the Uffizi."}]}, {"id": "scene-59", "sentence": "On December twentieth, for the journey to Rome, it was packed inside a specially made walnut crate and taken to Florence’s railway station.", "route": "A", "master": "image-79", "motion": {}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "start": 226.84, "end": 235.12, "spokenStart": 226.84, "spokenEnd": 235.0, "cues": [{"start": 226.84, "end": 230.9791304347826, "text": "On December twentieth, for the journey\nto Rome, it was packed inside a"}, {"start": 230.9791304347826, "end": 235.12, "text": "specially made walnut crate and\ntaken to Florence’s railway station."}]}, {"id": "scene-60", "sentence": "Then it traveled to Rome.", "start": 235.12, "end": 236.76, "route": "B", "plate": "image-80", "foreground": "image-81", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 34, "anchorY": 90}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 235.12, "spokenEnd": 236.64, "cues": [{"start": 235.12, "end": 236.76, "text": "Then it traveled to Rome."}]}, {"id": "scene-61", "sentence": "On December twenty-first, it was formally handed over to the French ambassador.", "start": 236.76, "end": 240.96, "route": "B", "plate": "image-82", "foreground": "image-83", "placement": {"left": 0, "top": 0.7, "width": 100, "anchorX": 85, "anchorY": 100}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "captionGroups": ["On December twenty-first,", "it was formally handed over to the French ambassador."], "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 236.76, "spokenEnd": 240.84, "cues": [{"start": 236.76, "end": 238.0676923076923, "text": "On December twenty-first,"}, {"start": 238.0676923076923, "end": 240.96, "text": "it was formally handed over\nto the French ambassador."}]}, {"id": "scene-62", "sentence": "A later exhibition in Milan drew enormous crowds.", "start": 240.96, "end": 244.28, "route": "B", "plate": "image-84", "foreground": "image-85", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 25, "anchorY": 100}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 240.96, "spokenEnd": 244.16, "cues": [{"start": 240.96, "end": 244.28, "text": "A later exhibition in\nMilan drew enormous crowds."}]}, {"id": "scene-63", "sentence": "In Milan, officials moved it downstairs for a free evening viewing, allowing more people to enter.", "route": "A", "master": "image-86", "motion": {}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "start": 244.28, "end": 250.8, "spokenStart": 244.28, "spokenEnd": 250.68, "cues": [{"start": 244.28, "end": 248.70061855670104, "text": "In Milan, officials moved it\ndownstairs for a free evening viewing,"}, {"start": 248.70061855670104, "end": 250.8, "text": "allowing more people to enter."}]}, {"id": "scene-64", "sentence": "That free evening viewing in Milan ran until midnight.", "route": "A", "master": "image-87", "motion": {}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "stageAnnotation": {"items": [{"text": "MIDNIGHT", "left": 15.2, "top": 45.1, "width": 13.8, "fontScene": 0.0167, "color": "#262118", "backing": false}]}, "start": 250.8, "end": 254.16, "spokenStart": 250.8, "spokenEnd": 254.04, "cues": [{"start": 250.8, "end": 254.16, "text": "That free evening viewing\nin Milan ran until midnight."}]}, {"id": "scene-65", "sentence": "The archive records separate entrances and exits to manage the flow of visitors.", "start": 254.16, "end": 258.44, "route": "B", "plate": "image-0", "foreground": "image-6", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6, "cameraStart": 1, "cameraEnd": 1}, "label": "Illustrated reconstruction · Narrated preview", "captionGroups": ["The archive records separate entrances and exits", "to manage the flow of visitors."], "labelBacking": true, "spokenStart": 254.16, "spokenEnd": 258.32, "cues": [{"start": 254.16, "end": 256.6875949367089, "text": "The archive records\nseparate entrances and exits"}, {"start": 256.6875949367089, "end": 258.44, "text": "to manage the flow of visitors."}]}, {"id": "scene-66", "sentence": "On December thirtieth, the painting left Milan for France.", "start": 258.44, "end": 262.04, "route": "B", "plate": "image-88", "foreground": "image-89", "placement": {"left": 0, "top": 3, "width": 100, "anchorX": 50, "anchorY": 100}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 258.44, "spokenEnd": 261.92, "cues": [{"start": 258.44, "end": 262.04, "text": "On December thirtieth, the\npainting left Milan for France."}]}, {"id": "scene-67", "sentence": "The following day, it reached the border station at Modane for another handover ceremony.", "start": 262.04, "end": 266.84, "route": "B", "plate": "image-90", "foreground": "image-91", "placement": {"left": 13.098086124401915, "top": 14.027630180658873, "width": 56.1, "anchorX": 37, "anchorY": 92}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 262.04, "spokenEnd": 266.72, "cues": [{"start": 262.04, "end": 265.5625806451613, "text": "The following day, it reached the\nborder station at Modane for another"}, {"start": 265.5625806451613, "end": 266.84, "text": "handover ceremony."}]}, {"id": "scene-68", "sentence": "After years in hiding, it was traveling under official escort.", "start": 266.84, "end": 270.64, "route": "B", "plate": "image-92", "foreground": "image-93", "placement": {"left": 0, "top": 5.738575982996812, "width": 100, "anchorX": 50, "anchorY": 100}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 266.84, "spokenEnd": 270.52, "cues": [{"start": 266.84, "end": 270.64, "text": "After years in hiding, it was\ntraveling under official escort."}]}, {"id": "scene-69", "sentence": "In June nineteen fourteen, a Florence court sentenced Peruggia to a year and fifteen days.", "start": 270.64, "end": 276.24, "route": "B", "plate": "image-94", "foreground": "image-95", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 35, "anchorY": 65}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "annotation": {"text": "JUNE 1914\nINITIAL SENTENCE\n1 YEAR + 15 DAYS", "left": 19, "top": 30, "width": 31, "fontScene": 0.02}, "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 270.64, "spokenEnd": 276.12, "cues": [{"start": 270.64, "end": 274.7932631578947, "text": "In June nineteen fourteen, a Florence\ncourt sentenced Peruggia to a year"}, {"start": 274.7932631578947, "end": 276.24, "text": "and fifteen days."}]}, {"id": "scene-70", "sentence": "That was the initial sentence, not a claim about the exact time he ultimately spent in custody.", "start": 276.24, "end": 281.76, "route": "B", "plate": "image-0", "foreground": "image-1", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6, "cameraStart": 1, "cameraEnd": 1}, "label": "Illustrated reconstruction · Narrated preview", "captionGroups": ["That was the initial sentence,", "not a claim about the exact time he ultimately spent in custody."], "labelBacking": true, "spokenStart": 276.24, "spokenEnd": 281.64, "cues": [{"start": 276.24, "end": 277.9634042553192, "text": "That was the initial sentence,"}, {"start": 277.9634042553192, "end": 281.76, "text": "not a claim about the exact time\nhe ultimately spent in custody."}]}, {"id": "scene-71", "sentence": "The painting survived.", "start": 281.76, "end": 283.36, "route": "B", "plate": "image-8", "foreground": "image-9", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 48, "anchorY": 86}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 281.76, "spokenEnd": 283.24, "cues": [{"start": 281.76, "end": 283.36, "text": "The painting survived."}]}, {"id": "scene-72", "sentence": "Its fame grew.", "start": 283.36, "end": 284.8, "route": "B", "plate": "image-96", "foreground": "image-97", "placement": {"left": -4, "top": 0, "width": 100, "anchorX": 65, "anchorY": 80}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 283.36, "spokenEnd": 284.68, "cues": [{"start": 283.36, "end": 284.8, "text": "Its fame grew."}]}, {"id": "scene-73", "sentence": "The thief did not get to decide its future simply because he had managed to take it.", "start": 284.8, "end": 289.4, "route": "B", "plate": "image-0", "foreground": "image-6", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6, "cameraStart": 1, "cameraEnd": 1}, "label": "Illustrated reconstruction · Narrated preview", "captionGroups": ["The thief did not get to decide its future", "simply because he had managed to take it."], "labelBacking": true, "spokenStart": 284.8, "spokenEnd": 289.28, "cues": [{"start": 284.8, "end": 287.0669879518072, "text": "The thief did not get\nto decide its future"}, {"start": 287.0669879518072, "end": 289.4, "text": "simply because he had\nmanaged to take it."}]}, {"id": "scene-74", "sentence": "And the lasting irony is this: stealing the Mona Lisa removed it from public view, but made far more people pay attention to it.", "start": 289.4, "end": 297.24, "route": "B", "plate": "image-96", "foreground": "image-97", "placement": {"left": 2, "top": 0, "width": 100, "anchorX": 65, "anchorY": 80}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "captionGroups": ["And the lasting irony is this:", "stealing the Mona Lisa removed it from public view,", "but made far more people pay attention to it."], "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 289.4, "spokenEnd": 297.12, "cues": [{"start": 289.4, "end": 291.23809523809524, "text": "And the lasting irony is this:"}, {"start": 291.23809523809524, "end": 294.36285714285714, "text": "stealing the Mona Lisa\nremoved it from public view,"}, {"start": 294.36285714285714, "end": 297.24, "text": "but made far more people\npay attention to it."}]}, {"id": "scene-75", "sentence": "The mystery lasted more than two years.", "start": 297.24, "end": 299.8, "route": "B", "plate": "image-98", "foreground": "image-99", "placement": {"left": -0.4880382775119618, "top": 2.2316684378320937, "width": 95, "anchorX": 50, "anchorY": 63}, "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrated reconstruction · Narrated preview", "annotation": {"text": "1911 → 1913\nMORE THAN TWO YEARS", "left": 23, "top": 43, "width": 50, "fontScene": 0.021}, "labelBacking": true, "motionReview": "Static registered subject; gentle whole-composition camera only pending independent review of each scene.", "spokenStart": 297.24, "spokenEnd": 299.68, "cues": [{"start": 297.24, "end": 299.8, "text": "The mystery lasted\nmore than two years."}]}, {"id": "scene-76", "sentence": "Its turning poi
