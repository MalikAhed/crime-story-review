 "end": 102.5476923076923, "text": "The FBI's later account\nrecords fifteen releases"}, {"start": 102.5476923076923, "end": 104.36, "text": "during that phase of the case."}], "id": "scene-20"}, {"sentence": "During the eleven-month investigation, BTK sent eleven communications to police and the media.", "start": 104.36, "end": 110.0, "route": "A", "captionGroups": ["During the eleven-month investigation,", "BTK sent eleven communications to police and the media."], "labelBacking": true, "master": "assets/btk-021-eleven-communications-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "label": "FBI retrospective · illustrative count, not original messages", "stageAnnotation": {"items": [{"text": "11 COMMUNICATIONS · ELEVEN-MONTH INVESTIGATION", "left": 8, "top": 15, "width": 84, "fontScene": 0.02, "color": "#fff", "backing": "#08121ddd"}]}, "spokenStart": 104.36, "spokenEnd": 109.88, "cues": [{"start": 104.36, "end": 106.61548387096774, "text": "During the eleven-month investigation,"}, {"start": 106.61548387096774, "end": 110.0, "text": "BTK sent eleven communications\nto police and the media."}], "id": "scene-21"}, {"sentence": "In other words, renewed contact was giving investigators new material to examine.", "start": 110.0, "end": 115.0, "route": "B", "captionGroups": ["In other words, renewed contact was giving investigators", "new material to examine."], "labelBacking": true, "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "label": "Modern narrator · not offender or victim", "spokenStart": 110.0, "spokenEnd": 114.88, "cues": [{"start": 110.0, "end": 113.416, "text": "In other words, renewed contact\nwas giving investigators"}, {"start": 113.416, "end": 115.0, "text": "new material to examine."}], "id": "scene-22"}, {"sentence": "One of those communications included the computer disk that became the famous break in the case.", "start": 115.0, "end": 120.08, "route": "A", "captionGroups": ["One of those communications included the computer disk", "that became the famous break in the case."], "labelBacking": true, "master": "assets/btk-023-disk-break-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Illustrative disk · not authentic evidence", "stageAnnotation": {"items": [{"text": "ONE COMMUNICATION INCLUDED A DISK", "left": 8, "top": 15, "width": 84, "fontScene": 0.02, "color": "#fff", "backing": "#08121ddd"}]}, "spokenStart": 115.0, "spokenEnd": 119.96, "cues": [{"start": 115.0, "end": 117.81936842105263, "text": "One of those communications\nincluded the computer disk"}, {"start": 117.81936842105263, "end": 120.08, "text": "that became the famous\nbreak in the case."}], "id": "scene-23"}, {"sentence": "A floppy disk is small enough to fit in a pocket, but its files can carry more than their visible text.", "start": 120.08, "end": 126.0, "route": "A", "captionGroups": ["A floppy disk is small enough to fit in a pocket,", "but its files can carry more than their visible text."], "labelBacking": true, "master": "assets/btk-024-disk-scale-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "label": "Conceptual illustration · not an actual case exhibit", "stageAnnotation": {"items": [{"text": "A SMALL DISK · MORE THAN VISIBLE TEXT", "left": 8, "top": 15, "width": 84, "fontScene": 0.02, "color": "#fff", "backing": "#08121ddd"}]}, "spokenStart": 120.08, "spokenEnd": 125.88, "cues": [{"start": 120.08, "end": 122.86627450980392, "text": "A floppy disk is small\nenough to fit in a pocket,"}, {"start": 122.86627450980392, "end": 126.0, "text": "but its files can carry more\nthan their visible text."}], "id": "scene-24"}, {"sentence": "Documents can contain metadata: information about the file rather than the message a reader sees.", "start": 126.0, "end": 131.44, "route": "A" pokenEnd": 148.44, "cues": [{"start": 144.6, "end": 147.10434782608695, "text": "The document was also\nmarked as last modified"}, {"start": 147.10434782608695, "end": 148.56, "text": "by someone named Dennis."}], "id": "scene-29"}, {"sentence": "Neither a church name nor a first name alone is a conviction.", "start": 148.56, "end": 152.0, "route": "B", "captionGroups": ["Neither a church name nor a first name alone is a conviction."], "labelBacking": true, "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "label": "Modern narrator · not offender or victim", "spokenStart": 148.56, "spokenEnd": 151.88, "cues": [{"start": 148.56, "end": 152.0, "text": "Neither a church name nor a\nfirst name alone is a conviction."}], "id": "scene-30"}, {"sentence": "But together they gave investigators something specific to check outside the disk itself.", "start": 152.0, "end": 156.88, "route": "A", "captionGroups": ["But together they gave investigators", "something specific to check outside the disk itself."], "labelBacking": true, "master": "assets/btk-031-beyond-disk-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "label": "Conceptual identification links · not original records", "stageAnnotation": {"items": [{"text": "SPECIFIC INFORMATION TO CHECK", "left": 8, "top": 15, "width": 84, "fontScene": 0.02, "color": "#fff", "backing": "#08121ddd"}]}, "spokenStart": 152.0, "spokenEnd": 156.76, "cues": [{"start": 152.0, "end": 153.94727272727272, "text": "But together they gave investigators"}, {"start": 153.94727272727272, "end": 156.88, "text": "something specific to check\noutside the disk itself."}], "id": "scene-31"}, {"sentence": "The same NIST account says a search of the church website identified Dennis Rader as president of its congregation council.", "st function ensureScene(){const i=sceneIndex(),keys=sceneKeys(i);if(keys.every(k=>decodedAssets[k])){waitingIndex=-1;failedIndex=-1;loadUI.style.display='none';camera.style.visibility='visible';return true}if(waitingIndex===i||failedIndex===i)return false;const epoch=++loadEpoch;waitingIndex=i;++playEpoch;if(playing)wantPlay=true;playing=false;narration.pause();t=Math.min(P.duration,pendingSeek!==null?pendingSeek:(narration.currentTime||t));setAudioTime(t);cancelPending();loadingMessage('Loading this scene…');const keep=new Set(keys);Promise.all(keys.map(k=>loadImage(k,keep))).then(()=>{if(epoch!==loadEpoch)return;waitingIndex=-1;failedIndex=-1;loadUI.style.display='none';camera.style.visibility='visible';draw();prefetch(i);if(wantPlay)startAudio()}).catch(error=>{if(epoch!==loadEpoch)return;waitingIndex=-1;failedIndex=i;playing=false;loadingMessage(error.message,true);show()});return false}

function swapImage(old,name,id){const next=decodedAssets[name];if(!next)throw new Error('Asset not decoded: '+name);if(old!==next){next.id=id;old.removeAttribute('id');old.replaceWith(next)}return next}
let captionFitKey='';function fitCaption(){if(P.aspect!=='9:16')return;const c=el('caption'),key=c.textContent+'|'+stage.clientWidth;if(key===captionFitKey)return;captionFitKey=key;c.style.whiteSpace='pre';let size=Math.max(13,Math.min(29,stage.clientWidth*.052));c.style.fontSize=size+'px';while(c.scrollWidth>c.clientWidth+1&&size>8){size-=.5;c.style.fontSize=size+'px'}}
const narration=new Audio(P.audioData);narration.id='narration';narration.hidden=true;document.body.appendChild(narration);narration.preload='metadata';narration.addEventListener('loadedmetadata',applyPendingSeek);narration.onended=()=>{playing=false;wantPlay=false;t=P.duration;draw()};seek.max=P.duration;function show(){el('bar').classList.remove('hide');clearTimeout(hide);hide=setTimeout(()=>{if(playing&&document.activeElement!==seek)el('bar').classList.add('hide')},2000)}
function lastItem(items){return items&&items[items.length-1]}function lerp(a,b,p){return a+(b-a)*p}function draw(){if(!ready||!ensureScene())return;const s=P.shots.find(x=>t>=x.start&&t<x.end)||P.shots[P.shots.length-1],p=Math.max(0,Math.min(1,(t-s.start)/(s.end-s.start))),q=.8*p+.2*p*p*(3-2*p),m=s.motion||{},reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,r=reduced?0:q;
plate=swapImage(plate,s.route==='B'?s.plate:s.master,'plate');plate.style.objectFit=s.plateFit==='contain'?'contain':'cover';plate.style.objectPosition=s.platePosition||'50% 50%';plate.style.transform=s.plateScale?'scale('+s.plateScale+')':'none';plate.style.transformOrigin='50% 100%';camera.style.transformOrigin=s.focus||'50% 50%';camera.style.transform=`scale(${lerp(m.cameraStart||1,m.cameraEnd||1,r)})`;
if(s.route==='B'){actor.style.display='block';subject=swapImage(subject,s.foreground,'subject');const v=s.placement;actor.style.left=v.left+'%';actor.style.top=v.top+'%';actor.style.width=v.width+'%';actor.style.transformOrigin=v.anchorX+'% '+v.anchorY+'%';actor.style.transform=`translate(${(m.dxScene||0)*stage.clientWidth*r}px,${(m.dyScene||0)*stage.clientHeight*r}px) rotate(${m.oscillateDegrees?(reduced?0:m.oscillateDegrees*Math.sin(2*Math.PI*(t-s.start)/(m.oscillatePeriodSeconds||5))):lerp(m.rotateStart||0,m.rotateEnd||0,r)}deg) scale(${lerp(m.scaleStart||1,m.scaleEnd||1,r)})`;const z=s.annotation;annotation.textContent=lastItem(z?.frames?.filter(f=>p>=f.atProgress))?.text||z?.text||'';if(z){annotation.style.left=z.left+'%';annotation.style.top=z.top+'%';annotation.style.width=z.width+'%';annotation.style.fontSize=(z.fontScene*stage.clientWidth)+'px';annotation.style.color=z.color||'#402e1c';annotation.style.textShadow=z.shadow||'none';annotation.style.background=z.backing||'';annotation.style.padding=z.backing?'.3em .4em':''}
if(z?.items){annotation.replaceChildren();annotation.style.left='0';annotation.style.top='0';annotation.style.width='100%';for(const item of z.items){const span=document.createElement('span');span.textContent=item.text;Object.assign(span.style,{position:'absolute',left:item.left+'%',top:item.top+'%',width:item.width+'%',fontSize:(item.fontScene*stage.clientWidth)+'px'});annotation.appendChild(span)}annotation.style.height='100%'}else{annotation.style.height='auto'}
}else{actor.style.display='none';actor.style.transform='none';annotation.textContent=''}
const sa=el('stageAnnotation');sa.replaceChildren();for(const item of (s.stageAnnotation?.items||[])){const node=document.createElement('span');node.textContent=item.text;Object.assign(node.style,{position:'absolute',left:item.left+'%',top:item.top+'%',width:item.width+'%',fontSize:(item.fontScene*stage.clientWidth)+'px',color:item.color||'#172c3b',background:item.backing||'',padding:'.2em'});sa.appendChild(node)}el('gradient').style.background=s.lowerGradient?'linear-gradient(transparent 48%,#080b11e8 61%,#080b11 100%)':'';const cp=s.captionPosition;el('caption').style.left=cp?cp.left+'%':'';el('caption').style.bottom=cp?cp.bottom+'%':'';el('caption').style.width=cp?cp.width+'%':'';const cues=s.cues||[{start:s.start,end:s.end,text:s.sentence}];el('caption').textContent=(cues.find(c=>t>=c.start&&t<c.end)||((P.holdFinalFrame??P.completeLongForm)&&t>=P.duration?cues[cues.length-1]:{})).text||'';fitCaption();el('label').textContent=s.label||'Illustrated reconstruction · preparing narration';el('label').style.background=s.labelBacking?'#080b11cc':'';el('label').style.padding=s.labelBacking?'.35em .5em':'';el('audioHint').textContent=t>=P.duration?'Ended · Click to replay':playing?'Playing narration · Click to pause':'Paused · Click or Space to play narration';prefetch(sceneIndex());seek.value=t;el('end').style.display=t>=P.duration&&!(P.holdFinalFrame??P.completeLongForm)?'grid':'none'}
function jump(v){++loadEpoch;++playEpoch;waitingIndex=-1;failedIndex=-1;prefetchedIndex=-1;cancelPending();t=Math.max(0,Math.min(P.duration,v));setAudioTime(t);if(t>=P.duration){playing=false;wantPlay=false;narration.pause()}draw();if(wantPlay&&!playing&&waitingIndex===-1&&failedIndex===-1)startAudio();show()}function toggle(){if(t>=P.duration){jump(0)}wantPlay=!wantPlay;if(!wantPlay){++playEpoch;narration.pause();playing=false}else if(ensureScene())startAudio();show();draw()}

stage.onclick=e=>{if(!e.target.closest('#bar,#loading'))toggle()};seek.oninput=()=>jump(+seek.value);stage.onpointermove=show;window.onresize=draw;document.onkeydown=e=>{if(['Space','ArrowLeft','ArrowRight','Home','End'].includes(e.code))e.preventDefault();if(e.code==='Space')toggle();if(e.code==='ArrowLeft')jump(t-5);if(e.code==='ArrowRight')jump(t+5);if(e.code==='Home')jump(0);if(e.code==='End')jump(P.duration);if(e.code==='KeyF'){if(!document.fullscreenElement)stage.requestFullscreen?.();else document.exitFullscreen?.()}};
function frame(now){if(playing){t=Math.min(P.duration,narration.currentTime);if(t>=P.duration)playing=false;draw()}last=now;requestAnimationFrame(frame)}window.motionQA={seek:jump,state:()=>({time:t,playing,duration:P.duration,shot:P.shots.find(s=>t>=s.start&&t<s.end)?.id,subjectTransform:actor.style.transform,cameraTransform:camera.style.transform})};ready=true;playing=false;wantPlay=false;ensureScene();show();requestAnimationFrame(frame);
</script></html>
