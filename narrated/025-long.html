if(s.route==='B'){actor.style.display='block';subject=swapImage(subject,reduced&&s.reducedForeground?s.reducedForeground:s.foreground,'subject');const v=sourceCropGeometry(s,r).foreground||s.placement;actor.style.left=v.left+'%';actor.style.top=v.top+'%';actor.style.width=v.width+'%';actor.style.transformOrigin=v.anchorX+'% '+v.anchorY+'%';actor.style.transform=`translate(${(m.dxScene||0)*stage.clientWidth*r}px,${(m.dyScene||0)*stage.clientHeight*r}px) rotate(${m.oscillateDegrees?(reduced?0:m.oscillateDegrees*Math.sin(2*Math.PI*(t-s.start)/(m.oscillatePeriodSeconds||5))):lerp(m.rotateStart||0,m.rotateEnd||0,r)}deg) scale(${lerp(m.scaleStart||1,m.scaleEnd||1,r)})`;const z=s.annotation;annotation.textContent=z?.frames?.filter(f=>p>=f.atProgress).at(-1)?.text||z?.text||'';if(z){annotation.style.left=z.left+'%';annotation.style.top=z.top+'%';annotation.style.width=z.width+'%';annotation.style.fontSize=(z.fontScene*stage.clientWidth)+'px';annotation.style.color=z.color||'#402e1c';annotation.style.textShadow=z.shadow||'none';annotation.style.background=z.backing||'';annotation.style.padding=z.backing?'.3em .4em':''}

const narration = new Audio(P.audioSrc);
narration.preload = 'metadata';
const playPrompt = el('play-prompt');
let wantPlay = false;
let playEpoch = 0;
let pendingSeek = null;
let mediaError = false;

function updatePrompt() {
    playPrompt.hidden = !mediaError && (playing || (wantPlay && t < P.duration));
    playPrompt.textContent = mediaError ? 'Retry narration' : t >= P.duration ? 'Replay narration' : 'Play narration';
    playPrompt.setAttribute('aria-label', playPrompt.textContent);
}

function syncClock() {
    if (pendingSeek === null && narration.readyState >= 1) {
        t = narration.ended ? P.duration : Math.min(P.duration, narration.currentTime);
    }
    draw();
}

function applyPendingSeek() {
    if (pendingSeek !== null && narration.readyState >= 1) {
        narration.currentTime = Math.min(narration.duration || P.duration, pendingSeek);
        pendingSeek = null;
    }
}

function stopPlayback() {
    playEpoch += 1;
    wantPlay = false;
    playing = false;
    narration.pause();
    syncClock();
    updatePrompt();
    show();
}

function jump(value) {
    const clamped = Math.max(0, Math.min(P.duration, value));
    t = clamped;
    pendingSeek = clamped;
    applyPendingSeek();
    if (clamped >= P.duration) {
        playEpoch += 1;
        wantPlay = false;
        playing = false;
        narration.pause();
    }
    draw();
    updatePrompt();
    show();
}

async function startPlayback() {
    if (!ready || wantPlay) return;
    if (t >= P.duration) jump(0);
    if (mediaError) {
        mediaError = false;
        pendingSeek = t;
        narration.load();
    }
    wantPlay = true;
    const epoch = ++playEpoch;
    updatePrompt();
    try {
        await narration.play();
        if (epoch !== playEpoch) {
            if (!wantPlay) narration.pause();
            return;
        }
        applyPendingSeek();
        playing = true;
        syncClock();
    } catch {
        if (epoch !== playEpoch) return;
        wantPlay = false;
        playing = false;
        mediaError = Boolean(narration.error);
    }
    updatePrompt();
    show();
}

function toggle() {
    if (wantPlay) stopPlayback();
    else startPlayback();
}

narration.addEventListener('loadedmetadata', () => {
    applyPendingSeek();
    syncClock();
});
narration.addEventListener('seeked', syncClock);
narration.addEventListener('ended', () => {
    playing = false;
    wantPlay = false;
    t = P.duration;
    draw();
    updatePrompt();
    show();
});
narration.addEventListener('error', () => {
    mediaError = true;
    stopPlayback();
});

playPrompt.onclick = startPlayback;
stage.onclick = event => {
    if (!event.target.closest('#bar,#play-prompt,#loading')) toggle();
};
seek.oninput = () => jump(Number(seek.value));
let dragging = false;
seek.addEventListener('pointerdown', () => { dragging = true; show(); });
window.addEventListener('pointerup', () => { dragging = false; show(); });
window.addEventListener('pointercancel', () => { dragging = false; show(); });
seek.addEventListener('focus', show);
stage.onpointermove = show;
window.onresize = draw;
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', draw);
document.onkeydown = event => {
    if (event.target === seek || event.target === playPrompt) return;
    if (['Space', 'ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.code)) event.preventDefault();
    if (event.code === 'Space') toggle();
    if (event.code === 'ArrowLeft') jump(t - 5);
    if (event.code === 'ArrowRight') jump(t + 5);
    if (event.code === 'Home') jump(0);
    if (event.code === 'End') jump(P.duration);
    if (event.code === 'KeyF') {
        if (document.fullscreenElement) document.exitFullscreen?.();
        else stage.requestFullscreen?.();
    }
};

function frame() {
    if (playing && !dragging) {
        if (narration.currentTime >= P.duration) narration.pause();
        syncClock();
        if (t >= P.duration) {
            playing = false;
            wantPlay = false;
            updatePrompt();
            show();
        }
    }
    requestAnimationFrame(frame);
}

window.motionQA = {
    pause: stopPlayback,
    play: startPlayback,
    ready: () => ready,
    plan: () => P,
    geometry: sourceCropGeometry,
    seek: jump,
    state: () => ({
        time: t,
        playing,
        duration: P.duration,
        shot: P.shots.find(shot => t >= shot.start && t < shot.end)?.id,
        caption: el('caption').textContent,
        mediaTime: narration.currentTime,
        mediaDuration: narration.duration,
        subjectTransform: actor.style.transform,
        cameraTransform: camera.style.transform,
    }),
};

Promise.all(Object.entries(P.assets).map(async ([name, src]) => {
    const image = new Image();
    image.alt = 'Generated illustrative scene';
    image.src = src;
    await image.decode();
    decodedAssets[name] = image;
})).then(() => {
    ready = true;
    draw();
    camera.style.visibility = 'visible';
    el('loading').remove();
    updatePrompt();
    show();
    requestAnimationFrame(frame);
}).catch(() => {
    el('loading').textContent = 'A scene could not load. Reload to try again.';
});
