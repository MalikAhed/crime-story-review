":1,"scaleEnd":1,"dxScene":0,"dyScene":0},"captionPosition":{"left":9,"width":82,"bottom":9},"master":"assets/interview-landscape.webp","sourceImageDimensions":[1280,720],"sourceAspectRatio":1.7777777777777777,"sourceCrop":{"x":0,"y":0.0,"width":1280,"height":720.0},"sourceCropEnd":{"x":0,"y":0.0,"width":1280,"height":720.0},"start":169.0,"end":176.64,"cues":[{"start":169.0,"end":173.255503875969,"text":"Four days later, Stewart met with\ninvestigators and said she did not know"},{"start":173.255503875969,"end":176.52,"text":"whether a written record of Bacanovic’s\nmessage existed."}]},{"id":"long-020","sceneId":"024-interview","sentence":"She also said she had spoken with Bacanovic on the day of the sale and denied speaking with his assistant, contradicting Faneuil’s account of their call.","route":"A","motion":{"cameraStart":1,"cameraEnd":1,"rotateStart":0,"rotateEnd":0,"scaleStart":1,"scaleEnd":1,"dxScene":0,"dyScene":0},"captionPosition":{"left":9,"width":82,"bottom":9},"master":"assets/interview-landscape.webp","sourceImageDimensions":[1280,720],"sourceAspectRatio":1.7777777777777777,"sourceCrop":{"x":0,"y":0.0,"width":1280,"height":720.0},"sourceCropEnd":{"x":0,"y":0.0,"width":1280,"height":720.0},"start":176.64,"end":185.68,"cues":[{"start":176.64,"end":180.77509933774832,"text":"She also said she had spoken with\nBacanovic on the day of the sale and"},{"start":180.77509933774832,"end":185.2646357615894,"text":"denied speaking with his assistant,\ncontradicting Faneuil’s account of their"},{"start":185.2646357615894,"end":185.56,"text":"call."}]},{"id":"long-021","sceneId":"024-interview","sentence":"At a second interview in April, she said she did not recall being told that members of the Waksal family were selling their ImClone stock.","route":"A","motion":{"cameraStart":1,"cameraEnd":1,"rotateStart":0,"rotateEnd":0,"scaleStart":1,"scaleEnd":1,"dxScene":0,"dyScene":0},"captionPosition":{"left":9,"width":82,"bottom":9},"master":"assets/interview-landscape.webp","sourceImageDimensions":[1280,720],"sourceAspectRatio":1.7777777777777777,"sourceCrop":{"x":0,"y":0.0,"width":1280,"height":720.0},"sourceCropEnd":{"x":0,"y":0.0,"width":1280,"height":720.0},"start":185.68,"end":193.48,"cues":[{"start":185.68,"end":190.3328467153285,"text":"At a second interview in April, she said\nshe did not recall being told that members"},{"start":190.3328467153285,"end":193.36,"text":"of the Waksal family were selling their\nImClone stock."}]},{"id":"long-022","sceneId":"024-interview","sentence":"Faneuil was not a witness with an unblemished account of his own: he admitted that he had twice lied to the Securities and Exchange Commission.","route":"A","motion":{"cameraStart":1,"cameraEnd":1,"rotateStart":0,"rotateEnd":0,"scaleStart":1,"scaleEnd":1,"dxScene":0,"dyScene":0},"captionPosition":{"left":9,"width":82,"bottom":9},"master":"assets/interview-landscape.webp","sourceImageDimensions":[1280,720],"sourceAspectRatio":1.7777777777777777,"sourceCrop":{"x":0,"y":0.0,"width":1280,"height":720.0},"sourceCropEnd":{"x":0,"y":0.0,"width":1280,"height":720.0},"start":193.48,"end":202.12,"cues":[{"start":193.48,"end":197.56,"text":"Faneuil was not a witness with an\nunblemished account of his own: he"},{"start":197.56,"end":202.0,"text":"admitted that he had twice lied to the\nSecurities and Exchange Commission."}]},{"id":"long-023","sceneId":"024-interview","sentence":"He pleaded guilty to a misdemeanor and testified under a cooperation agreement, while the defense challenged his credibility and offered evidence disputing parts of his testimony.","route":"A","motion":{"cameraStart":1,"cameraEnd":1,"rotateStart":0,"rotateEnd":0,"scaleStart":1,"scaleEnd":1,"dxScene":0,"dyScene":0},"captionPosition":{"left":9,"width":82,"bottom":9},"master":"assets/interview-landscape.webp","sourceImageDimensions":[1280,720],"sourceAspectRatio":1.7777777777777777,"sourceCrop":{"x":0,"y":0.0,"width":1280,"height":720.0},"sourceCropEnd":{"x":0,"y":0.0,"width":1280,"height":720.0},"start":202.12,"end":213.08,"cues":[{"start":202.12,"end":206.9581920903955,"text":"He pleaded guilty to a misdemeanor and\ntestified under a cooperation agreement,"},{"start":206.9581920903955,"end":211.55141242937853,"text":"while the defense challenged his\ncredibility and offered evidence disputing"},{"start":211.55141242937853,"end":212.96,"text":"parts of his testimony."}]},{"id":"long-024","sceneId":"024-investigator","sentence":"Jurors also heard from investigators and other witnesses, with portions of the testimony supported by telephone records, emails, and message logs.","route":"A","motion":{"cameraStart":1,"cameraEnd":1,"rotateStart":0,"rotateEnd":0,"scaleStart":1,"scaleEnd":1,"dxScene":0,"dyScene":0},"captionPosition":{"left":9,"width":82,"bottom":9},"master":"assets/investigator-landscape.webp","sourceImageDimensions":[1280,720],"sourceAspectRatio":1.7777777777777777,"sourceCrop":{"x":0,"y":0.0,"width":1280,"height":720.0},"sourceCropEnd":{"x":0,"y":0.0,"width":1280,"height":720.0},"start":213.08,"end":221.8,"cues":[{"start":213.08,"end":217.70620689655172,"text":"Jurors also heard from investigators and\nother witnesses, with portions of the"},{"start":217.70620689655172,"end":221.68,"text":"testimony supported by telephone records,\nemails, and message logs."}]},{"id":"long-025","sceneId":"024-investigator","sentence":"The prosecution therefore asked the jury to compare several accounts and records, including explanations offered by the two defendants themselves.","route":"A","motion":{"cameraStart":1,"cameraEnd":1,"rotateStart":0,"rotateEnd":0,"scaleStart":1,"scaleEnd":1,"dxScene":0,"dyScene":0},"captionPosition":{"left":9,"width":82,"bottom":9},"master":"assets/investigator-landscape.webp","sourceImageDimensions":[1280,720],"sourceAspectRatio":1.7777777777777777,"sourceCrop":{"x":0,"y":0.0,"width":1280,"height":720.0},"sourceCropEnd":{"x":0,"y":0.0,"width":1280,"height":720.0},"start":221.8,"end":230.08,"cues":[{"start":221.8,"end":226.3583448275862,"text":"The prosecution therefore asked the jury\nto compare several accounts and records,"},{"start":226.3583448275862,"end":229.96,"text":"including explanations offered by the two\ndefendants themselves."}]},{"id":"long-026","sceneId":"024-investigator","sentence":"The verdict form listed individual statements within the false-statement and perjury counts, allowing jurors to identify exactly which accusations they found proved.","route":"A","motion":{"cameraStart":1,"cameraEnd":1,"rotateStart":0,"rotateEnd":0,"scaleStart":1,"scaleEnd":1,"dxScene":0,"dyScene":0},"captionPosition":{"left":9,"width":82,"bottom":9},"master":"assets/investigator-landscape.webp","sourceImageDimensions":[1280,720],"sourceAspectRatio":1.7777777777777777,"sourceCrop":{"x":0,"y":0.0,"width":1280,"height":720.0},"sourceCropEnd":{"x":0,"y":0.0,"width":1280,"height":720.0},"start":230.08,"end":240.16,"cues":[{"start":230.08,"end":234.7239263803681,"text":"The verdict form listed individual\nstatements within the false-statement and"},{"start":234.7239263803681,"end":239.24564417177913,"text":"perjury counts, allowing jurors to\nidentify exactly which accusations they"},{"start":239.24564417177913,"end":240.04,"text":"found proved."}]},{"id":"long-027","sceneId":"024-narrator","sentence":"That detail would become essential to reading the outcome accurately, because a guilty verdict on a count did not mean every statement listed under it was false.","route":"B","motion":{"cameraStart":1,"cameraEnd":1,"rotateStart":0,"rotateEnd":0,"scaleStart":1,"scaleEnd":1,"dxScene":0,"dyScene":0},"captionPosition":{"left":9,"width":82,"bottom":18},"plate":"assets/narrator-bg.webp","foreground":"assets/narrator-explanatory.webp","reducedForeground":"assets/narrator-neutral.webp","sourceImageDimensions":[1672,941],"sourceAspectRatio":1.7777777777777777,"sourceCrop":{"x":0,"y":0,"width":1672,"height":940.5},"sourceCropEnd":{"x":0,"y":0,"width":1672,"height":940.5},"backgroundStagePlacement":{"left":0,"top":0,"scale":1},"placement":{"left":0,"top":0,"width":100,"anchorX":50.0,"anchorY":92.98618490967057},"captionFontRatio":0.021,"stageRegistration":{"background":{"dimensions":[1672,941]},"placement":{"left_percent":0.0,"top_percent":0.0,"width_percent":100},"anchor_percent_of_sprite":[50.0,92.98618490967057]},"start":240.16,"end":249.96,"cues":[{"start":240.16,"end":244.9395,"text":"That detail would become essential to\nreading the outcome accurately, because a"},{"start":244.9395,"end":249.84,"text":"guilty verdict on a count did not mean\nevery statement listed under it was false."}]},{"id":"long-028","sceneId":"024-court","sentence":"Before the jury decided the remaining charges, Judge Miriam Goldman Cedarbaum acquitted Stewart on the separate securities fraud count.","route":"A","motion":{"cameraStart":1,"cameraEnd":1,"rotateStart":0,"rotateEnd":0,"scaleStart":1,"scaleEnd":1,"dxScene":0,"dyScene":0},"captionPosition":{"left":9,"width":82,"bottom":9},"master":"assets/court.webp","sourceImageDimensions":[1672,941],"sourceAspectRatio":1.7777777777777777,"sourceCrop":{"x":0,"y":0.25,"width":1672,"height":940.5},"sourceCropEnd":{"x":0,"y":0.25,"width":1672,"height":940.5},"start":249.96,"end":258.32,"cues":[{"start":249.96,"end":254.6949253731343,"text":"Before the jury decided the remaining\ncharges, Judge Miriam Goldman Cedarbaum"},{"start":254.6949253731343,"end":258.2,"text":"acquitted Stewart on the separate\nsecurities fraud count."}]},{"id":"long-029","sceneId":"024-court","sentence":"That count concerned public statements about her ImClone sale and an alleged purpose of protecting the share price of her own company, Martha Stewart Living Omnimedia.","route":"A","motion":{"cameraStart":1,"cameraEnd":1,"rotateStart":0,"rotateEnd":0,"scaleStart":1,"scaleEnd":1,"dxScene":0,"dyScene":0},"captionPosition":{"left":9,"width":82,"bottom":9},"master":"assets/court.webp","sourceImageDimensions":[1672,941],"sourceAspectRatio":1.7777777777777777,"sourceCrop":{"x": .52,"end":281.37053892215573,"text":"On March fifth, two thousand four, the\njury convicted Stewart on four counts:"},{"start":281.37053892215573,"end":286.3470658682635,"text":"conspiracy, two counts of making false\nstatements, and obstruction of an agency"},{"start":286.3470658682635,"end":287.04,"text":"proceeding."}]},{"id":"long-032","sceneId":"024-court","sentence":"The false-statement verdict included her account of speaking to Bacanovic on the sale date and her claimed lack of recollection about information concerning the Waksal sales.","route":"A","motion":{"cameraStart":1,"cameraEnd":1,"rotateStart":0,"rotateEnd":0,"scaleStart":1,"scaleEnd":1,"dxScene":0,"dyScene":0},"captionPosition":{"left":9,"width":82,"bottom":9},"master":"assets/court.webp","sourceImageDimensions":[1672,941],"sourceAspectRatio":1.7777777777777777,"sourceCrop":{"x":0,"y":0.25,"width":1672,"height":940.5},"sourceCropEnd":{"x":0,"y":0.25,"width":1672,"height":940.5},"start":287.16,"end":296.92,"cues":[{"start":287.16,"end":291.6437209302326,"text":"The false-statement verdict included her\naccount of speaking to Bacanovic on the"},{"start":291.6437209302326,"end":295.84720930232555,"text":"sale date and her claimed lack of\nrecollection about information concerning"},{"start":295.84720930232555,"end":296.8,"text":"the Waksal sales."}]},{"id":"long-033","sceneId":"024-narrator","sentence":"But jurors did not find her guilty on the particular statements describing a prior agreement to sell at sixty dollars.","route":"B","motion":{"cameraStart":1,"cameraEnd":1,"rotateStart":0,"rotateEnd":0,"scaleStart":1,"scaleEnd":1,"dxScene":0,"dyScene":0},"captionPosition":{"left":9,"width":82,"bottom":18},"plate":"assets/narrator-bg.webp","foreground":"assets/narrator-explanatory.webp","reducedForeground":"assets/narrator-neutral.webp","sourceImageDimensions":[1672,941],"sourceAspectRatio":1.7777777777777777,"sourceCrop":{"x":0,"y":0,"width":1672,"height":940.5},"sourceCropEnd":{"x":0,"y":0,"width":167
