": "Those changes addressed the future\nof the promotions, while the"}, {"start": 171.87565217391304, "end": 175.42037267080744, "text": "customers' lost opportunity to\ncompete for stolen prizes raised a"}, {"start": 175.42037267080744, "end": 177.22, "text": "separate question about the past."}]}, {"id": "long-022", "sentence": "A consumer settlement offered an opportunity to win fifteen prizes of one million dollars each, according to the later federal appellate account.", "route": "B", "start": 177.22, "end": 185.46, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0.0, "top": -0.026581605528973953, "width": 100.0, "anchorX": 46.65071770334928, "anchorY": 93.30499468650372}, "captionGroups": ["A consumer settlement offered an opportunity to win fifteen prizes of one", "million dollars each, according to the later federal appellate account."], "spokenStart": 177.22, "spokenEnd": 184.9, "cues": [{"start": 177.22, "end": 181.19594405594407, "text": "A consumer settlement offered an\nopportunity to win fifteen prizes of"}, {"start": 181.19594405594407, "end": 184.999020979021, "text": "one million dollars each, according\nto the later federal appellate"}, {"start": 184.999020979021, "end": 185.46, "text": "account."}]}, {"id": "long-023", "sentence": "The form of that remedy mattered: another opportunity to win a prize was different from a guaranteed cash refund for every person who had bought a meal.", "route": "A", "start": 185.46, "end": 193.74, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "23.0% 66.0%", "motion": {"cameraStart": 1.04, "cameraEnd": 1.12}, "master": "assets/413aff92eca5afc42814.png", "captionGroups": ["The form of that remedy mattered: another opportunity to win a prize was different", "from a guaranteed cash refund for every person who had bought a meal."], "spokenStart": 185.46, "spokenEnd": 193.34, "cues": [{"start": 185.46, "end": 189.4344, "text": "The form of that remedy mattered:\nanother opportunity to win a prize was"}, {"start": 189.4344, "end": 193.3536, "text": "different from a guaranteed cash\nrefund for every person who had bought"}, {"start": 193.3536, "end": 193.74, "text": "a meal."}]}, {"id": "long-024", "sentence": "Describing it simply as millions repaid to customers would erase that difference and suggest an outcome the settlement account does not establish.", "route": "A", "start": 193.74, "end": 201.48, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "47.0% 57.99999999999999%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "master": "assets/2756909859b447fba938.png", "captionGroups": ["Describing it simply as millions repaid to customers would erase that difference and", "suggest an outcome the settlement account does not establish."], "spokenStart": 193.74, "spokenEnd": 200.84, "cues": [{"start": 193.74, "end": 197.44875, "text": "Describing it simply as millions\nrepaid to customers would erase that"}, {"start": 197.44875, "end": 200.9425, "text": "difference and suggest an outcome\nthe settlement account does not"}, {"start": 200.9425, "end": 201.48, "text": "establish."}]}, {"id": "long-025", "sentence": "The civil opinion discussing those events concerned allegations made by a competitor and reviewed whether its lawsuit should survive dismissal.", "route": "A", "start": 201.48, "end": 209.42, "sourceCrop": {"x": 0.0, "y": 0.25, "width":  restaurant company"}, {"start": 215.8189349112426, "end": 217.2, "text": "committed the insider's crime."}]}, {"id": "long-027", "sentence": "Meanwhile, four other defendants challenged their criminal convictions, bringing the case back to a narrower question: what had prosecutors proved those particular people knew?", "route": "A", "start": 217.2, "end": 227.12, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "85.0% 68.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/ca306b9c49e0041ac9a7.png", "captionGroups": ["Meanwhile, four other defendants challenged their criminal convictions,", "bringing the case back to a narrower question: what had prosecutors proved", "those particular people knew?"], "spokenStart": 217.2, "spokenEnd": 226.5, "cues": [{"start": 217.2, "end": 221.247816091954, "text": "Meanwhile, four other defendants\nchallenged their criminal convictions,"}, {"start": 221.247816091954, "end": 225.06758620689655, "text": "bringing the case back to a narrower\nquestion: what had prosecutors"}, {"start": 225.06758620689655, "end": 227.12, "text": "proved those particular people knew?"}]}, {"id": "long-028", "sentence": "They were George Chandler, Jerome Pearl, Kevin Whitfield and John Henderson, a group distinct from Jacobson, the security director who had pleaded guilty.", "route": "B", "start": 227.12, "end": 236.02, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0.0, "top": -0.026581605528973953, "width": 100.0, "anchorX": 46.65071770334928, "anchorY": 93.30499468650372}, "captionGroups": ["They were George Chandler, Jerome Pearl, Kevin Whitfield and John Henderson, a", "group distinct from Jacobson, the security director who had pleaded guilty."], "spokenStart": 227.12, "spokenEnd": 235.36, "cues": [{"start": 227.12, "end": 230.9259210526316, "text": "They were George Chandler, Jerome\nPearl, Kevin Whitfield and John"}, {"start": 230.9259210526316, "end": 235.14171052631582, "text": "Henderson, a group distinct from\nJacobson, the security director who had"}, {"start": 235.14171052631582, "end": 236.02, "text": "pleaded guilty."}]}, {"id": "long-029", "sentence": "The fact that a prize originated in a theft did not, by itself, establish that every later person connected to it understood that origin.", "route": "A", "start": 236.02, "end": 244.88, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "16.0% 60.0%", "motion": {"cameraStart": 1.06, "cameraEnd": 1.13}, "master": "assets/6879b5c9fffd88e41102.png", "captionGroups": ["The fact that a prize originated in a theft did not, by itself, establish that", "every later person connected to it understood that origin."], "spokenStart": 236.02, "spokenEnd": 244.22, "cues": [{"start": 236.02, "end": 240.15466666666666, "text": "The fact that a prize originated\nin a theft did not, by itself,"}, {"start": 240.15466666666666, "end": 244.42059259259258, "text": "establish that every later person\nconnected to it understood that"}, {"start": 244.42059259259258, "end": 244.88, "text": "origin."}]}, {"id": "long-030", "sentence": "The appeals court examined whether the government had established the defendants' knowing participation in the conspiracy charged, including their knowledge of Jacobson's theft.", "route": "A", "start": 244.88, "end": 254.52, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5 rt's"}, {"start": 261.24545454545455, "end": 264.3381818181818, "text": "analysis required those different\nkinds of knowledge to be kept"}, {"start": 264.3381818181818, "end": 264.78, "text": "separate."}]}, {"id": "long-032", "sentence": "Suspicion about how a prize changed hands could not simply replace the missing evidence connecting an appellant to the theft-based agreement prosecutors had charged.", "route": "B", "start": 264.78, "end": 273.26, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0.0, "top": -0.026581605528973953, "width": 100.0, "anchorX": 46.65071770334928, "anchorY": 93.30499468650372}, "captionGroups": ["Suspicion about how a prize changed hands could not simply replace the missing", "evidence connecting an appellant to the theft-based agreement prosecutors had", "charged."], "spokenStart": 264.78, "spokenEnd": 272.66, "cues": [{"start": 264.78, "end": 268.421717791411, "text": "Suspicion about how a prize changed\nhands could not simply replace the"}, {"start": 268.421717791411, "end": 272.01141104294476, "text": "missing evidence connecting an\nappellant to the theft-based agreement"}, {"start": 272.01141104294476, "end": 273.26, "text": "prosecutors had charged."}]}, {"id": "long-033", "sentence": "That distinction can seem small beside the scale of the scandal, but it determines whether evidence about one person's crime proves another person's guilt.", "route": "B", "start": 273.26, "end": 281.86, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "foc
