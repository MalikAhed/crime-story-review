: "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "spokenStart": 0.0, "spokenEnd": 6.56, "cues": [{"start": 0.0, "end": 3.7866666666666666, "text": "The software meant to help businesses\nmanage their computers became the"}, {"start": 3.7866666666666666, "end": 6.68, "text": "route through which ransomware\nreached them instead."}], "id": "scene-1"}, {"sentence": "On July second, twenty twenty-one, an attack involving Kaseya software spread into customer networks around the world.", "start": 6.68, "end": 13.32, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-002-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1.04}, "spokenStart": 6.68, "spokenEnd": 13.2, "cues": [{"start": 6.68, "end": 10.580854700854701, "text": "On July second, twenty twenty-one,\nan attack involving Kaseya software"}, {"start": 10.580854700854701, "end": 13.32, "text": "spread into customer\nnetworks around the world."}], "id": "scene-2"}, {"sentence": "But this story does not end with an anonymous threat on a computer screen.", "start": 13.32, "end": 17.68, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-003-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 13.32, "spokenEnd": 17.56, "cues": [{"start": 13.32, "end": 16.464269662921346, "text": "But this story does not end with\nan anonymous threat on a computer"}, {"start": 16.464269662921346, "end": 17.68, "text": "screen."}], "id": "scene-3"}, {"sentence": "It ends with a man brought from Poland to Texas, a guilty plea, and a prison sentence.", "start": 17.68, "end": 23.12, "route": "A", "labelBacking": true, "label": "Illustrative map · markers not exact locations · generated narration", "master": "assets/kaseya-004-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 17.68, "spokenEnd": 23.0, "cues": [{"start": 17.68, "end": 21.67, "text": "It ends with a man brought from\nPoland to Texas, a guilty plea, and a"}, {"start": 21.67, "end": 23.12, "text": "prison sentence."}], "id": "scene-4"}, {"sentence": "The twist is that the biggest number in the case is also the easiest one to misunderstand.", "start": 23.12, "end": 27.76, "route": "B", "labelBacking": true, "label": "Modern narrator · visual WIP · generated narration", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "placement": {"left": -3, "top": -2, "width": 106, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "plateScale": 1.06, "spokenStart": 23.12, "spokenEnd": 27.64, "cues": [{"start": 23.12, "end": 26.545684210526318, "text": "The twist is that the biggest number\nin the case is also the easiest one"}, {"start": 26.545684210526318, "end": 27.76, "text": "to misunderstand."}], "id": "scene-5"}, {"sentence": "First, picture the businesses behind the screens, not a cinematic room full of hackers.", "start": 27.76, "end": 33.12, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-006-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1.04}, "spokenStart": 27.76, "spokenEnd": 33.0, "cues": [{"start": 27.76, "end": 31.704086021505375, "text": "First, picture the businesses behind\nthe screens, not a cinematic room"}, {"start": 31.704086021505375, "end": 33.12, "text": "full of hackers."}], "id": "scene-6"}, {"sentence": "Some companies rely on outside providers to help look after their computer systems.", "start": 33.12, "end": 37.6, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-007-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 33.12, "spokenEnd": 37.48, "cues": [{"start": 33.12, "end": 36.34045454545454, "text": "Some companies rely on outside\nproviders to help look after their"}, {"start": 36.34045454545454, "end": 37.6, "text": "computer systems."}], "id": "scene-7"}, {"sentence": "Those providers can use management software that reaches computers belonging to different customers.", "start": 37.6, "end": 42.96, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-008-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 37.6, "spokenEnd": 42.84, "cues": [{"start": 37.6, "end": 41.093333333333334, "text": "Those providers can use management\nsoftware that reaches computers"}, {"start": 41.093333333333334, "end": 42.96, "text": "belonging to different customers."}], "id": "scene-8"}, {"sentence": "That shared arrangement helps explain why trouble at one point can become trouble somewhere else.", "start": 42.96, "end": 48.2, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-009-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1.04}, "spokenStart": 42.96, "spokenEnd": 48.08, "cues": [{"start": 42.96, "end": 46.48, "text": "That shared arrangement helps\nexplain why trouble at one point can"}, {"start": 46.48, "end": 48.2, "text": "become trouble somewhere else."}], "id": "scene-9"}, {"sentence": "Kaseya made software used in that world, including a product called VSA.", "start": 48.2, "end": 52.88, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-010-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 48.2, "spokenEnd": 52.76, "cues": [{"start": 48.2, "end": 52.88, "text": "Kaseya made software used in that\nworld, including a product called VSA."}], "id": "scene-10"}, {"sentence": "The joint guidance from American cybersecurity authorities described this as a supply-chain ransomware attack affecting providers and their customers.", "start": 52.88, "end": 61.04, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-011-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "stageAnnotation": {"items": [{"text": "SUPPLY-CHAIN ATTACK", "left": 6, "top": 19, "width": 42, "fontScene": 0.021, "color": "#172c3b"}]}, "spokenStart": 52.88, "spokenEnd": 60.92, "cues": [{"start": 52.88, "end": 56.27577639751553, "text": "The joint guidance from American\ncybersecurity authorities described"}, {"start": 56.27577639751553, "end": 59.77142857142857, "text": "this as a supply-chain ransomware\nattack affecting providers and their"}, {"start": 59.77142857142857, "end": 61.04, "text": "customers."}], "id": "scene-11"}, {"sentence": "In plain language, the danger travelled through a software relationship that businesses were already relying on.", "start": 61.04, "end": 67.6, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-012-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1.04}, "spokenStart": 61.04, "spokenEnd": 67.48, "cues": [{"start": 61.04, "end": 65.15927927927927, "text": "In plain language, the danger travelled\nthrough a software relationship"}, {"start": 65.15927927927927, "end": 67.6, "text": "that businesses were\nalready relying on."}], "id": "scene-12"}, {"sentence": "This was not simply one company discovering that one laptop had stopped working.", "start": 67.6, "end": 71.4, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-013-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1.04}, "spokenStart": 67.6, "spokenEnd": 71.28, "cues": [{"start": 67.6, "end": 71.4, "text": "This was not simply one company discovering\nthat one laptop had stopped working."}], "id": "scene-13", "captionPosition": {"left": 5, "width": 90, "bottom": 9}}, {"sentence": "Prosecutors later alleged that Yaroslav Vasinskyi was responsible for the July second attack against Kaseya.", "start": 71.4, "end": 78.08, "route": "B", "labelBacking": true, "label": "Modern narrator · visual WIP · generated narration", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "spokenStart": 71.4, "spokenEnd": 77.96, "cues": [{"start": 71.4, "end": 75.63028037383177, "text": "Prosecutors later alleged that\nYaroslav Vasinskyi was responsible for"}, {"start": 75.63028037383177, "end": 78.08, "text": "the July second attack against Kaseya."}], "id": "scene-14"}, {"sentence": "Their account said ransomware reached computers on customer networks and encrypted data at organizations around the world.", "start": 78.08, "end": 84.52, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-015-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 78.08, "spokenEnd": 84.4, "cues": [{"start": 78.08, "end": 81.8406611570248, "text": "Their account said ransomware reached\ncomputers on customer networks and"}, {"start": 81.8406611570248, "end": 84.52, "text": "encrypted data at\norganizations around the world."}], "id": "scene-15"}, {"sentence": "Encryption was being used as a lock, with criminals demanding payment for the means to unlock it.", "start": 84.52, "end": 90.0, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-016-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 84.52, "spokenEnd": 89.88, "cues": [{"start": 84.52, "end": 88.3725, "text": "Encryption was being used as a lock,\nwith criminals demanding payment"}, {"start": 88.3725, "end": 90.0, "text": "for the means to unlock it."}], "id": "scene-16"}, {"sentence": "There was another pressure point in the broader scheme: the threat of exposing victims' data.", "start": 90.0, "end": 95.08, "route": "A", "labelBacking": true, "label": "Broader scheme · editorial illustration · no victim data", "master": "assets/kaseya-017-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 90.0, "spokenEnd": 94.96, "cues": [{"start": 90.0, "end": 93.72, "text": "There was another pressure point in\nthe broader scheme: the threat of"}, {"start": 93.72, "end": 95.08, "text": "exposing victims' data."}], "id": "scene-17"}, {"sentence": "The Justice Department said conspirators also published victims' data when those victims would not pay.", "start": 95.08, "end": 100.2, "route": "A", "labelBacking": true, "label": "Broader scheme · editorial illustration · no victim data", "master": "assets/kaseya-018-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 95.08, "spokenEnd": 100.08, "cues": [{"start": 95.08, "end": 98.46235294117646, "text": "The Justice Department said conspirators\nalso published victims' data"}, {"start": 98.46235294117646, "end": 100.2, "text": "when those victims would not pay."}], "id": "scene-18"}, {"sentence": "A locked system and a threatened disclosure are different harms, and both put pressure on the people affected.", "start": 100.2, "end": 105.6, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-019-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 100.2, "spokenEnd": 105.48, "cues": [{"start": 100.2, "end": 103.49394495412844, "text": "A locked system and a threatened\ndisclosure are different harms, and"}, {"start": 103.49394495412844, "end": 105.6, "text": "both put pressure on\nthe people affected."}], "id": "scene-19"}, {"sentence": "We will not reproduce stolen files or the instructions that criminals left behind.", "start": 105.6, "end": 110.04, "route": "B", "labelBacking": true, "label": "Modern narrator · visual WIP · generated narration", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "placement": {"left": -3, "top": -2, "width": 106, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "plateScale": 1.06, "spokenStart": 105.6, "spokenEnd": 109.92, "cues": [{"start": 105.6, "end": 108.84, "text": "We will not reproduce stolen files\nor the instructions that criminals"}, {"start": 108.84, "end": 110.04, "text": "left behind."}], "id": "scene-20"}, {"sentence": "The investigation has enough tension without turning the victims' information into another spectacle.", "start": 110.04, "end": 115.4, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-021-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1.04}, "spokenStart": 110.04, "spokenEnd": 115.28, "cues": [{"start": 110.04, "end": 113.446, "text": "The investigation has enough\ntension without turning the victims'"}, {"start": 113.446, "end": 115.4, "text": "information into another spectacle."}], "id": "scene-21"}, {"sentence": "While the criminal investigation continued, affected organizations also needed a way to recover their data.", "start": 115.4, "end": 121.12, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-022-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1.04}, "spokenStart": 115.4, "spokenEnd": 121.0, "cues": [{"start": 115.4, "end": 119.15094339622641, "text": "While the criminal investigation\ncontinued, affected organizations also"}, {"start": 119.15094339622641, "end": 121.12, "text": "needed a way to recover their data."}], "id": "scene-22"}, {"sentence": "On July twenty-first, Kaseya obtained a decryptor for victims of the attack, according to its incident updates.", "start": 121.12, "end": 127.6, "route": "A", "labelBacking": true, "label": "According to Kaseya · editorial illustration · generated narration", "master": "assets/kaseya-023-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "stageAnnotation": {"items": [{"text": "21 JULY 2021", "left": 9, "top": 18, "width": 40, "fontScene": 0.025, "color": "#172c3b"}]}, "spokenStart": 121.12, "spokenEnd": 127.48, "cues": [{"start": 121.12, "end": 125.05163636363636, "text": "On July twenty-first, Kaseya obtained\na decryptor for victims of the"}, {"start": 125.05163636363636, "end": 127.6, "text": "attack, according to\nits incident updates."}], "id": "scene-23"}, {"sentence": "The company said it was working to help restore encrypted data.", "start": 127.6, "end": 131.04, "route": "A", "labelBacking": true, "label": "According to Kaseya · editorial illustration · generated narration", "master": "assets/kaseya-024-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 127.6, "spokenEnd": 130.92, "cues": [{"start": 127.6, "end": 131.04, "text": "The company said it was working\nto help restore encrypted data."}], "id": "scene-24"}, {"sentence": "It later stated that it had not paid a ransom, directly or through a third party, to obtain that tool.", "start": 131.04, "end": 137.12, "route": "B", "labelBacking": true, "label": "Modern narrator · company-attributed account · generated narration", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "spokenStart": 131.04, "spokenEnd": 137.0, "cues": [{"start": 131.04, "end": 135.05267326732672, "text": "It later stated that it had not\npaid a ransom, directly or through a"}, {"start": 135.05267326732672, "end": 137.12, "text": "third party, to obtain that tool."}], "id": "scene-25"}, {"sentence": "That is Kaseya's account of its own decision, not proof that every affected business had the same experience.", "start": 137.12, "end": 143.4, "route": "A", "labelBacking": true, "label": "According to Kaseya · editorial illustration · generated narration", "master": "assets/kaseya-026-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 137.12, "spokenEnd": 143.28, "cues": [{"start": 137.12, "end": 140.88444444444445, "text": "That is Kaseya's account of its\nown decision, not proof that every"}, {"start": 140.88444444444445, "end": 143.4, "text": "affected business had\nthe same experience."}], "id": "scene-26"}, {"sentence": "Recovery and accountability were now two different tracks of the same story.", "start": 143.4, "end": 147.4, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-027-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 143.4, "spokenEnd": 147.28, "cues": [{"start": 143.4, "end": 146.31, "text": "Recovery and accountability were\nnow two different tracks of the same"}, {"start": 146.31, "end": 147.4, "text": "story."}], "id": "scene-27"}, {"sentence": "One dealt with locked data; the other dealt with the person prosecutors said had helped lock it.", "start": 147.4, "end": 153.32, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-028-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 147.4, "spokenEnd": 153.2, "cues": [{"start": 147.4, "end": 151.73473684210526, "text": "One dealt with locked data; the other\ndealt with the person prosecutors"}, {"start": 151.73473684210526, "end": 153.32, "text": "said had helped lock it."}], "id": "scene-28"}, {"sentence": "On October eighth, twenty twenty-one, Vasinskyi was taken into custody in Poland.", "start": 153.32, "end": 158.12, "route": "A", "labelBacking": true, "label": "Poland · 8 October 2021 · illustrative scene", "master": "assets/kaseya-029-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 153.32, "spokenEnd": 158.0, "cues": [{"start": 153.32, "end": 156.8425806451613, "text": "On October eighth, twenty twenty-one,\nVasinskyi was taken into custody"}, {"start": 156.8425806451613, "end": 158.12, "text": "in Poland."}], "id": "scene-29"}, {"sentence": "The following month, American prosecutors publicly announced the indictment linking him to the Kaseya attack.", "start": 158.12, "end": 164.04, "route": "A", "labelBacking": true, "label": "November 2021 · indictment allegations · illustrated scene", "master": "assets/kaseya-030-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1.04}, "spokenStart": 158.12, "spokenEnd": 163.92, "cues": [{"start": 158.12, "end": 161.55703703703702, "text": "The following month, American\nprosecutors publicly announced the"}, {"start": 161.55703703703702, "end": 164.04, "text": "indictment linking him\nto the Kaseya attack."}], "id": "scene-30"}, {"sentence": "At that stage, an indictment was an accusation, not a verdict.", "start": 164.04, "end": 168.0, "route": "B", "labelBacking": true, "label": "Modern narrator · visual WIP · generated narration", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "spokenStart": 164.04, "spokenEnd": 167.88, "cues": [{"start": 164.04, "end": 168.0, "text": "At that stage, an indictment was\nan accusation, not a verdict."}], "id": "scene-31"}, {"sentence": "That distinction matters even when a case has become a worldwide headline.", "start": 168.0, "end": 171.88, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-032-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 168.0, "spokenEnd": 171.76, "cues": [{"start": 168.0, "end": 170.76597701149424, "text": "That distinction matters even\nwhen a case has become a worldwide"}, {"start": 170.76597701149424, "end": 171.88, "text": "headline."}], "id": "scene-32"}, {"sentence": "The international effort extended beyond this one defendant and beyond this one attack.", "start": 171.88, "end": 176.6, "route": "A", "labelBacking": true, "label": "Generated editorial illustration · visual WIP · generated narration", "master": "assets/kaseya-033-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 171.88, "spokenEnd": 176.48, "cues": [{"start": 171.88, "end": 175.34236559139785, "text": "The international effort extended\nbeyond this one defendant and beyond"}, {"start": 175.34236559139785, "end": 176.6, "text": "this one attack."}], "id": "scene-33"}, {"sentence": "INTERPOL described a broader operation involving nineteen law-enforcement agencies in seventeen countries.", "start": 176.6, "end": 183.6, "route": "A", "labelBacking": true, "label": "INTERPOL · broader operation · illustrative scene", "master": "assets/kaseya-034-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "stageAnnotation": {"items": [{"text": "19 AGENCIES", "left": 11, "top": 46, "width": 37, "fontScene": 0.024, "color": "#172c3b"}, {"text": "17 COUNTRIES", "left": 53, "top": 46, "width": 37, "fontScene": 0.024, "color": "#172c3b"}]}, "spokenStart": 176.6, "spokenEnd": 183.48, "cues": pokenStart": 196.84, "spokenEnd": 200.68, "cues": [{"start": 196.84, "end": 200.8, "text": "Vasinskyi was then extradited\nfrom Poland to the United States."}], "id": "scene-37"}, {"sentence": "He arrived in Dallas on March third, twenty twenty-two, according to the Justice Department.", "start": 200.8, "end": 205.44, "route": "A", "labelBacking": true, "label": "According to DOJ · illustrated skyline", "master": "assets/kaseya-038-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1.04}, "stageAnnotation": {"items": [{"text": "DALLAS · 3 MARCH 2022", "left": 17, "top": 70, "width": 66, "fontScene": 0.024, "color": "#172c3b"}]}, "spokenStart": 200.8, "spokenEnd": 205.32, "cues": [{"start": 200.8, "end": 204.2256842105263, "text": "He arrived in Dallas on March third,\ntwenty twenty-two, according to the"}, {"start": 204.2256842105263, "end": 205.44, "text": "Justice Department."}], "id": "scene-38"}, {"sentence": "Six days later, he appeared in federal court in the Northern District of Texas.", "start": 205.44, "end": 209.96, "route": "A", "labelBacking": true, "label": "9 March 2022 · illustrative courtroom, not actual hearing", "master": "assets/kaseya-039-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1.04}, "spokenStart": 205.44, "spokenEnd": 209.84, "cues": [{"start": 205.44, "end": 208.77473684210526, "text": "Six days later, he appeared in federal\ncourt in the Northern District of"}, {"start": 208.77473684210526, "end": 209.96, "text": "Texas."}], "id": "scene-39"}, {"sentence": "The case that had reached across borders was now moving through a courtroom.", "start": 209.96, "end": 214.24, "route": "B", "labelBacking": true, "label": "Modern narrator · visual WIP · generated narration", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "placement": {"left": -3, "top": -2, "width": 106, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "plateScale": 1.06, "spokenStart": 209.96, "spokenEnd": 214.12, "cues": [{"start": 209.96, "end": 213.03272727272727, "text": "The case that had reached across\nborders was now moving through a"}, {"start": 213.03272727272727, "end": 214.24, "text": "courtroom."}], "id": "scene-40"}, {"sentence": "And the next development changed the legal status of the story.", "start": 214.24, "end": 217.92, "route": "A", "labelBacking": true, "label": "Editorial illustration · not authentic court documents · generated narration", "master": "assets/kaseya-041-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "stageAnnotation": {"items": [{"text": "FROM ACCUSATION TO PLEA", "left": 18, "top": 38, "width": 64, "fontScene": 0.022, "color": "#172c3b", "backing": "#fff8e6dd"}]}, "spokenStart": 214.24, "spokenEnd": 217.8, "cues": [{"start": 214.24, "end": 217.92, "text": "And the next development changed\nthe legal status of the story."}], "id": "scene-41"}, {"sentence": "Vasinskyi pleaded guilty to an eleven-count indictment, the Justice Department later reported.", "start": 217.92, "end": 223.28, "route": "A", "labelBacking": true, "label": "Editorial illustration · not authentic court documents · generated narration", "master": "assets/kaseya-042-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "stageAnnotation": {"items": [{"text": "GUILTY PLEA · 11 COUNTS", "left": 19, "top": 36, "width": 65, "fontScene": 0.022, "color": "#172c3b", "backing": "#fff8e6dd"}]}, "spokenStart": 217.92, "spokenEnd": 223.16, "cues": [{"start": 217.92, "end": 221.69505376344085, "text": "Vasinskyi pleaded guilty to an\neleven-count indictment, the Justice"}, {"start": 221.69505376344085, "end": 223.28, "text": "Department later reported."}], "id": "scene-42"}, {"sentence": "The charges included conspiracy to commit fraud and related activity in connection with computers, damage to protected computers, and conspiracy to commit money laundering.", "start": 223.28, "end": 232.92, "route":
