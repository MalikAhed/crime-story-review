 "id": "youtube-sentence-009", "start": 40.88, "end": 46.8, "spokenStart": 40.88, "spokenEnd": 46.68, "cues": [{"start": 40.88, "end": 44.58990990990991, "text": "The indictment describes funds\nbelonging to Bangladesh Bank in accounts"}, {"start": 44.58990990990991, "end": 46.8, "text": "at the Federal Reserve\nBank of New York."}]}, {"sentence": "The dramatic part is not a shattered vault door, but a trusted financial instruction being turned against its owner.", "route": "A", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {}, "master": "assets/bangladesh-010-master.png", "stageAnnotation": {"items": [{"text": "A TRUSTED INSTRUCTION\nNot a physical vault break-in", "left": 15, "top": 13, "width": 70, "fontScene": 0.023, "color": "#fff3df", "backing": "#101e2ee8"}]}, "id": "youtube-sentence-010", "start": 46.8, "end": 53.52, "spokenStart": 46.8, "spokenEnd": 53.4, "cues": [{"start": 46.8, "end": 50.93217391304348, "text": "The dramatic part is not a shattered\nvault door, but a trusted financial"}, {"start": 50.93217391304348, "end": 53.52, "text": "instruction being turned\nagainst its owner."}]}, {"sentence": "According to the FBI complaint, fraudulent messages appeared to come from Bangladesh Bank's own computer system.", "route": "A", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {}, "master": "assets/bangladesh-011-master.png", "stageAnnotation": {"items": [{"text": "APPARENT ORIGIN ≠ AUTHORIZATION\nAs described in the FBI complaint", "left": 15, "top": 13, "width": 70, "fontScene": 0.022, "color": "#fff3df", "backing": "#101e2ee8"}]}, "id": "youtube-sentence-011", "start": 53.52, "end": 60.32, "spokenStart": 53.52, "spokenEnd": 60.2, "cues": [{"start": 53.52, "end": 57.612252252252254, "text": "According to the FBI complaint,\nfraudulent messages appeared to come"}, {"start": 57.612252252252254, "end": 60.32, "text": "from Bangladesh Bank's\nown : 0.022, "color": "#fff3df", "backing": "#101e2ee8"}]}, "id": "youtube-sentence-016", "start": 83.16, "end": 86.4, "spokenStart": 83.16, "spokenEnd": 86.28, "cues": [{"start": 83.16, "end": 86.4, "text": "It also describes casino junkets\nas part of that money trail."}]}, {"sentence": "A transfer on a screen was becoming a much harder recovery problem across borders.", "route": "A", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {}, "master": "assets/bangladesh-017-master.png", "stageAnnotation": {"items": [{"text": "CROSS-BORDER RECOVERY\nAn international problem", "left": 15, "top": 13, "width": 70, "fontScene": 0.022, "color": "#fff3df", "backing": "#101e2ee8"}]}, "id": "youtube-sentence-017", "start": 86.4, "end": 90.96, "spokenStart": 86.4, "spokenEnd": 90.84, "cues": [{"start": 86.4, "end": 90.01777777777778, "text": "A transfer on a screen was becoming\na much harder recovery problem"}, {"start": 90.01777777777778, "end": 90.96, "text": "across borders."}]}, {"sentence": "In Sri Lanka, the recipient bank stopped the twenty-million-dollar transfer before it reached the intended recipient.", "route": "B", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "placement": {"left": -5, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "stageAnnotation": {"items": [{"text": "SRI LANKA: STOPPED\n$20 million did not reach\nthe intended recipient", "left": 3, "top": 18, "width": 25, "fontScene": 0.018, "color": "#fff3df", "backing": "#101e2ee8"}]}, "id": "youtube-sentence-018", "start": 90.96, "end": 96.88, "spokenStart": 90.96, "spokenEnd": 96.76, "cues": [{"start": 90.96, "end": 94.26, "text": "In Sri Lanka, the recipient bank\nstopped the twenty-million-dollar"}, {"start": 94.26, "end": 96.88, "text": "transfer before it reached\nthe intended recipient."}]}, {"sentence": "That money cannot honestly be described as another twenty million successfully pocketed by the perpetrators.", "route": "A", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {}, "master": "assets/bangladesh-019-master.png", "stageAnnotation": {"items": [{"text": "STOPPED ≠ POCKETED\nThe Sri Lanka transfer", "left": 15, "top": 13, "width": 70, "fontScene": 0.022, "color": "#fff3df", "backing": "#101e2ee8"}, {"text": "SRI LANKA", "left": 70.5, "top": 58, "width": 10, "fontScene": 0.012, "color": "#172c3b"}]}, "id": "youtube-sentence-019", "start": 96.88, "end": 102.96, "spokenStart": 96.88, "spokenEnd": 102.84, "cues": [{"start": 96.88, "end": 100.50056074766356, "text": "That money cannot honestly be\ndescribed as another twenty million"}, {"start": 100.50056074766356, "end": 102.96, "text": "successfully pocketed\nby the perpetrators."}]}, {"sentence": "And it should not be confused with money later recovered from the Philippine portion.", "route": "A", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {}, "master": "assets/bangladesh-020-master.png", "stageAnnotation": {"items": [{"text": "TWO DIFFERENT CATEGORIES\nStopped transfer ≠ later recovery", "left": 15, "top": 13, "width": 70, "fontScene": 0.022, "color": "#fff3df", "backing": "#101e2ee8"}, {"text": "LATER RECOVERY\nPhilippine portion", "left": 18, "top": 33, "width": 21, "fontScene": 0.017, "color": "#172c3b"}, {"text": "STOPPED TRANSFER\nSri Lanka", "left": 60, "top": 33, "width": 21, "fontScene": 0.017, "color": "#172c3b"}]}, "id": "youtube-sentence-020", "start": 102.96, "end": 107.32, "spokenStart": 102.96, "spokenEnd": 107.2, "cues": [{"start": 102.96, "end": 106.24095238095238, "text": "And it should not be confused with\nmoney later recovered from the"}, {"start": 106.24095238095238, "end": 107.32, "text": "Philippine portion."}]}, {"sentence": "Those are different events, even when headlines compress them into a single enormous number.", "route": "A", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {}, "master": "assets/bangladesh-021-master.png", "stageAnnotation": {"items": [{"text": "DISTINCT EVENTS • NOT ONE TOTAL", "left": 15, "top": 9, "width": 70, "fontScene": 0.022, "color": "#fff3df", "backing": "#101e2ee8"}, {"text": "$81 MILLION\nReached Philippine\naccounts", "left": 4, "top": 32, "width": 25, "fontScene": 0.022, "color": "#172c3b"}, {"text": "$20 MILLION\nStopped Sri Lanka\ntransfer", "left": 37, "top": 32, "width": 25, "fontScene": 0.022, "color": "#172c3b"}, {"text": "$15 MILLION\nLater returned\nNovember 2016", "left": 70, "top": 32, "width": 25, "fontScene": 0.022, "color": "#172c3b"}]}, "id": "youtube-sentence-021", "start": 107.32, "end": 112.4, "spokenStart": 107.32, "spokenEnd": 112.28, "cues": [{"start": 107.32, "end": 111.02637362637363, "text": "Those are different events, even\nwhen headlines compress them into a"}, {"start": 111.02637362637363, "end": 112.4, "text": "single enormous number."}]}, {"sentence": "The immediate mystery had become two questions: who was behind the intrusion, and how much could be brought back?", "route": "B", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "stageAnnotation": {"items": [{"text": "WHO WAS BEHIND IT?\nHOW MUCH COULD RETURN?", "left": 3, "top": 18, "width": 25, "fontScene": 0.018, "color": "#fff3df", "backing": "#101e2ee8"}]}, "id": "youtube-sentence-022", "start": 112.4, "end": 119.16, "spokenStart": 112.4, "spokenEnd": 119.04, "cues": [{"start": 112.4, "end": 116.31285714285715, "text": "The immediate mystery had become\ntwo questions: who was behind the"}, {"start": 116.31285714285715, "end": 119.16, "text": "intrusion, and how much\ncould be brought back?"}]}, {"sentence": "By September twenty sixteen, the Philippine government was publicly supporting Bangladesh's recovery efforts.", "route": "A", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {}, "master": "assets/bangladesh-023-master.png", "stageAnnotation": {"items": [{"text": "SEPTEMBER 2016\nPhilippine support for recovery", "left": 15, "top": 9, "width": 70, "fontScene": 0.022, "color": "#fff3df", "backing": "#101e2ee8"}]}, "id": "youtube-sentence-023", "start": 119.16, "end": 124.84, "spokenStart": 119.16, "spokenEnd": 124.72, "cues": [{"start": 119.16, "end": 122.60925925925926, "text": "By September twenty sixteen, the\nPhilippine government was publicly"}, {"start": 122.60925925925926, "end": 124.84, "text": "supporting Bangladesh's\nrecovery efforts."}]}, {"sentence": "Its finance department said roughly fifteen million dollars had been forfeited by a Manila court and placed with the Philippine central bank.", "route": "A", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {}, "master": "assets/bangladesh-024-master.png", "stageAnnotation": {"items": [{"text": "ROUGHLY $15 MILLION\nForfeited; held at Philippine central bank", "left": 15, "top": 9, "width": 70, "fontScene": 0.022, "color": "#fff3df", "backing": "#101e2ee8"}]}, "id": "youtube-sentence-024", "start": 124.84, "end": 132.36, "spokenStart": 124.84, "spokenEnd": 132.24, "cues": [{"start": 124.84, "end": 128.43428571428572, "text": "Its finance department said roughly\nfifteen million dollars had been"}, {"start": 128.43428571428572, "end": 132.36, "text": "forfeited by a Manila court and placed\nwith the Philippine central bank."}]}, {"sentence": "But the finance secretary also emphasized that recovery had to follow legal procedures.", "route": "A", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {}, "master": "assets/bangladesh-025-master.png", "stageAnnotation": {"items": [{"text": "RECOVERY REQUIRES\nLegal procedures", "left": 15, "top": 9, "width": 70, "fontScene": 0.022, "color": "#fff3df", "backing": "#101e2ee8"}]}, "id": "youtube-sentence-025", "start": 132.36, "end": 137.48, "spokenStart": 132.36, "spokenEnd": 137.36, "cues": [{"start": 132.36, "end": 136.37162790697676, "text": "But the finance secretary also\nemphasized that recovery had to follow"}, {"start": 136.37162790697676, "end": 137.48, "text": "legal procedures."}]}, {"sentence": "The finance department’s account describes a petition filed on August twenty-sixth, asking that the fifteen million dollars be forfeited in Bangladesh’s favor.", "route": "A", "label": "AI-generated editorial illustration · narrated review draft", "labelBacking": true, "master": "assets/bangladesh-025-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "focus": "50% 45%", "id": "009-ext-A-01", "start": 137.48, "end": 145.96, "spokenStart": 137.48, "spokenEnd": 145.84, "cues": [{"start": 137.48, "end": 141.15414012738853, "text": "The finance department’s account\ndescribes a petition filed on August"}, {"start": 141.15414012738853, "end": 144.82828025477707, "text": "twenty-sixth, asking that the fifteen\nmillion dollars be forfeited in"}, {"start": 144.82828025477707, "end": 145.96, "text": "Bangladesh’s favor."}]}, {"sentence": "Four days later, the court found the petition sufficient in form and substance.", "route": "A", "label": "AI-generated editorial illustration · narrated review draft", "labelBacking": true, "master": "assets/bangladesh-040-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "focus": "50% 45%", "id": "009-ext-A-02", "start": 145.96, "end": 150.64, "spokenStart": 145.96, "spokenEnd": 150.52, "cues": [{"start": 145.96, "end": 149.93538461538463, "text": "Four days later, the court found\nthe petition sufficient in form and"}, {"start": 149.93538461538463, "end": 150.64, "text": "substance."}]}, {"sentence": "That procedural decision was still not a completed transfer: the solicitor general had an opportunity to comment before judgment.", "route": "B", "label": "AI-generated editorial illustration · narrated review draft", "labelBacking": true, "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "id": "009-ext-A-03", "start": 150.64, "end": 158.12, "spokenStart": 150.64, "spokenEnd": 158.0, "cues": [{"start": 150.64, "end": 154.32, "text": "That procedural decision was still\nnot a completed transfer: the"}, {"start": 154.32, "end": 158.12, "text": "solicitor general had an opportunity\nto comment before judgment."}]}, {"sentence": "Finding money and establishing who is entitled to receive it are not the same step.", "route": "A", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {}, "master": "assets/bangladesh-026-master.png", "stageAnnotation": {"items": [{"text": "FINDING MONEY ≠ ENTITLEMENT", "left": 15, "top": 9, "width": 70, "fontScene": 0.022, "color": "#fff3df", "backing": "#101e2ee8"}, {"text": "FINDING\nTHE MONEY", "left": 13, "top": 32, "width": 32, "fontScene": 0.024, "color": "#fff3df"}, {"text": "ESTABLISHING\nENTITLEMENT", "left": 55, "top": 32, "width": 32, "fontScene": 0.024, "color": "#172c3b"}]}, "id": "youtube-sentence-026", "start": 158.12, "end": 162.92, "spokenStart": 158.12, "spokenEnd": 162.8, "cues": [{"start": 158.12, "end": 162.22926829268295, "text": "Finding money and establishing who\nis entitled to receive it are not the"}, {"start": 162.22926829268295, "end": 162.92, "text": "same step."}]}, {"sentence": "In November, Bangladesh Bank's deputy governor told bdnews24 that officials in Manila had handed over fifteen million dollars.", "route": "B", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "placement": {"left": -5, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "stageAnnotation": {"items": [{"text": "NOVEMBER 2016\n$15 million handed over\nReported by bdnews24", "left": 3, "top": 18, "width": 25, "fontScene": 0.018, "color": "#fff3df", "backing": "#101e2ee8"}]}, "id": "youtube-sentence-027", "start": 162.92, "end": 170.4, "spokenStart": 162.92, "spokenEnd": 170.28, "cues": [{"start": 162.92, "end": 166.7472, "text": "In November, Bangladesh Bank's\ndeputy governor told bdnews24 that"}, {"start": 166.7472, "end": 170.4, "text": "officials in Manila had handed\nover fifteen million dollars."}]}, {"sentence": "That was a real recovery milestone, not proof that the entire eighty-one million had come home.", "route": "A", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {}, "master": "assets/bangladesh-028-master.png", "stageAnnotation": {"items": [{"text": "PARTIAL RETURN\nNot full recovery of the $81 million", "left": 15, "top": 9, "width": 70, "fontScene": 0.022, "color": "#fff3df", "backing": "#101e2ee8"}]}, "id": "youtube-sentence-028", "start": 170.4, "end": 175.92, "spokenStart": 170.4, "spokenEnd": 175.8, "cues": [{"start": 170.4, "end": 174.53617021276597, "text": "That was a real recovery milestone,\nnot proof that the entire eighty-one"}, {"start": 174.53617021276597, "end": 175.92, "text": "million had come home."}]}, {"sentence": "A partial return matters precisely because the original loss was so much larger.", "route": "A", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {}, "master": "assets/bangladesh-029-master.png", "stageAnnotation": {"items": [{"text": "A PARTIAL RETURN MATTERS", "left": 15, "top": 9, "width": 70, "fontScene": 0.022, "color": "#fff3df", "backing": "#101e2ee8"}]}, "id": "youtube-sentence-029", "start": 175.92, "end": 180.6, "spokenStart": 175.92, "spokenEnd": 180.48, "cues": [{"start": 175.92, "end": 180.07594936708858, "text": "A partial return matters precisely\nbecause the original loss was so much"}, {"start": 180.07594936708858, "end": 180.6, "text": "larger."}]}, {"sentence": "Meanwhile, the attribution investigation would move far beyond a single bank or a single country.", "route": "A", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {}, "master": "assets/bangladesh-030-master.png", "stageAnnotation": {"items": [{"text": "ATTRIBUTION INVESTIGATION\nBeyond one bank or country", "left": 15, "top": 9, "width": 70, "fontScene": 0.022, "color": "#fff3df", "backing": "#101e2ee8"}]}, "id": "youtube-sentence-030", "start": 180.6, "end": 186.28, "spokenStart": 180.6, "spokenEnd": 186.16, "cues": [{"start": 180.6, "end": 184.71208333333334, "text": "Meanwhile, the attribution investigation\nwould move far beyond a single"}, {"start": 184.71208333333334, "end": 186.28, "text": "bank or a single country."}]}, {"sentence": "In September twenty eighteen, American prosecutors announced charges against North Korean programmer Park Jin Hyok.", "route": "A", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {}, "master": "assets/bangladesh-031-master.png", "stageAnnotation": {"items": [{"text": "SEPTEMBER 2018\nCharges announced against Park Jin Hyok", "left": 15, "top": 13, "width": 70, "fontScene": 0.022, "color": "#fff3df", "backing": "#101e2ee8"}]}, "id": "youtube-sentence-031", "start": 186.28, .24, "end": 201.48435643564358, "text": "The complaint connected the\nBangladesh theft with other attacks,"}, {"start": 201.48435643564358, "end": 203.48, "text": "including Sony Pictures and WannaCry."}]}, {"sentence": "That connection changed the scale of the story from one stolen reserve account to an alleged international campaign.", "route": "A", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {}, "master": "assets/bangladesh-034-master.png", "stageAnnotation": {"items": [{"text": "AN ALLEGED INTERNATIONAL CAMPAIGN", "left": 15, "top": 13, "width": 70, "fontScene": 0.022, "color": "#fff3df", "backing": "#101e2ee8"}]}, "id": "youtube-sentence-034", "start": 203.48, "end": 209.4, "spokenStart": 203.48, "spokenEnd": 209.28, "cues": [{"start": 203.48, "end": 207.01043478260868, "text": "That connection changed the scale\nof the story from one stolen reserve"}, {"start": 207.01043478260868, "end": 209.4, "text": "account to an alleged\ninternational campaign."}]}, {"sentence": "But an allegation is not a conviction, however detailed the charging document may be.", "route": "A", "labelBacking": true, "label": "AI-generated editorial illustration · narrated review draft", "motion": {}, "master": "assets/bangladesh-035-master.png", "stageAnnotation": {"items": [{"text": "ALLEGATION ≠ CONVICTION", "left": 15, "top": 13, "width": 70, "fontScene": 0.022, "color": "#fff3df", "backing": "#101e2ee8"}]}, "id": "youtube-sentence-035", "start": 209.4, "end": 213.76, "spokenStart": 209.4, "spokenEnd": 213.64, "cues": [{"start": 209.4, "end": 212.83238095238093, "text": "But an allegation is not a conviction,\nhowever detailed the charging"}, {"start": 212.83238095238093, "end": 213.76, "text": "document may be."}]}, {"sentence": "In February twenty twenty-one, the Justice Department announced an indictment charging three North Korean programmers.", "route": "B", "labelBacking": true, "label": "AI-generated editorial illustr function ensureScene(){const i=sceneIndex(),keys=sceneKeys(i);if(keys.every(k=>decodedAssets[k])){waitingIndex=-1;failedIndex=-1;loadUI.style.display='none';camera.style.visibility='visible';return true}if(waitingIndex===i||failedIndex===i)return false;const epoch=++loadEpoch;waitingIndex=i;++playEpoch;if(playing)wantPlay=true;playing=false;narration.pause();t=Math.min(P.duration,pendingSeek!==null?pendingSeek:(narration.currentTime||t));setAudioTime(t);cancelPending();loadingMessage('Loading this scene…');const keep=new Set(keys);Promise.all(keys.map(k=>loadImage(k,keep))).then(()=>{if(epoch!==loadEpoch)return;waitingIndex=-1;failedIndex=-1;loadUI.style.display='none';camera.style.visibility='visible';draw();prefetch(i);if(wantPlay)startAudio()}).catch(error=>{if(epoch!==loadEpoch)return;waitingIndex=-1;failedIndex=i;playing=false;loadingMessage(error.message,true);show()});return false}

function swapImage(old,name,id){const next=decodedAssets[name];if(!next)throw new Error('Asset not decoded: '+name);if(old!==next){next.id=id;old.removeAttribute('id');old.replaceWith(next)}return next}
let captionFitKey='';function fitCaption(){if(P.aspect!=='9:16')return;const c=el('caption'),key=c.textContent+'|'+stage.clientWidth;if(key===captionFitKey)return;captionFitKey=key;c.style.whiteSpace='pre';let size=Math.max(13,Math.min(29,stage.clientWidth*.052));c.style.fontSize=size+'px';while(c.scrollWidth>c.clientWidth+1&&size>8){size-=.5;c.style.fontSize=size+'px'}}
const narration=new Audio(P.audioData);narration.id='narration';narration.hidden=true;document.body.appendChild(narration);narration.preload='metadata';narration.addEventListener('loadedmetadata',applyPendingSeek);narration.onended=()=>{playing=false;wantPlay=false;t=P.duration;draw()};seek.max=P.duration;function show(){el('bar').classList.remove('hide');clearTimeout(hide);hide=setTimeout(()=>{if(playing&&document.activeElement!==seek)el('bar').classList.add('hide')},2000)}
function lastItem(items){return items&&items[items.length-1]}function lerp(a,b,p){return a+(b-a)*p}function draw(){if(!ready||!ensureScene())return;const s=P.shots.find(x=>t>=x.start&&t<x.end)||P.shots[P.shots.length-1],p=Math.max(0,Math.min(1,(t-s.start)/(s.end-s.start))),q=.8*p+.2*p*p*(3-2*p),m=s.motion||{},reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,r=reduced?0:q;
plate=swapImage(plate,s.route==='B'?s.plate:s.master,'plate');plate.style.objectFit=s.plateFit==='contain'?'contain':'cover';plate.style.objectPosition=s.platePosition||'50% 50%';plate.style.transform=s.plateScale?'scale('+s.plateScale+')':'none';plate.style.transformOrigin='50% 100%';camera.style.transformOrigin=s.focus||'50% 50%';camera.style.transform=`scale(${lerp(m.cameraStart||1,m.cameraEnd||1,r)})`;
if(s.route==='B'){actor.style.display='block';subject=swapImage(subject,s.foreground,'subject');const v=s.placement;actor.style.left=v.left+'%';actor.style.top=v.top+'%';actor.style.width=v.width+'%';actor.style.transformOrigin=v.anchorX+'% '+v.anchorY+'%';actor.style.transform=`translate(${(m.dxScene||0)*stage.clientWidth*r}px,${(m.dyScene||0)*stage.clientHeight*r}px) rotate(${m.oscillateDegrees?(reduced?0:m.oscillateDegrees*Math.sin(2*Math.PI*(t-s.start)/(m.oscillatePeriodSeconds||5))):lerp(m.rotateStart||0,m.rotateEnd||0,r)}deg) scale(${lerp(m.scaleStart||1,m.scaleEnd||1,r)})`;const z=s.annotation;annotation.textContent=lastItem(z?.frames?.filter(f=>p>=f.atProgress))?.text||z?.text||'';if(z){annotation.style.left=z.left+'%';annotation.style.top=z.top+'%';annotation.style.width=z.width+'%';annotation.style.fontSize=(z.fontScene*stage.clientWidth)+'px';annotation.style.color=z.color||'#402e1c';annotation.style.textShadow=z.shadow||'none';annotation.style.background=z.backing||'';annotation.style.padding=z.backing?'.3em .4em':''}
if(z?.items){annotation.replaceChildren();annotation.style.left='0';annotation.style.top='0';annotation.style.width='100%';for(const item of z.items){const span=document.createElement('span');span.textContent=item.text;Object.assign(span.style,{position:'absolute',left:item.left+'%',top:item.top+'%',width:item.width+'%',fontSize:(item.fontScene*stage.clientWidth)+'px'});annotation.appendChild(span)}annotation.style.height='100%'}else{annotation.style.height='auto'}
}else{actor.style.display='none';actor.style.transform='none';annotation.textContent=''}
const sa=el('stageAnnotation');sa.replaceChildren();for(const item of (s.stageAnnotation?.items||[])){const node=document.createElement('span');node.textContent=item.text;Object.assign(node.style,{position:'absolute',left:item.left+'%',top:item.top+'%',width:item.width+'%',fontSize:(item.fontScene*stage.clientWidth)+'px',color:item.color||'#172c3b',background:item.backing||'',padding:'.2em'});sa.appendChild(node)}el('gradient').style.background=s.lowerGradient?'linear-gradient(transparent 48%,#080b11e8 61%,#080b11 100%)':'';const cp=s.captionPosition;el('caption').style.left=cp?cp.left+'%':'';el('caption').style.bottom=cp?cp.bottom+'%':'';el('caption').style.width=cp?cp.width+'%':'';const cues=s.cues||[{start:s.start,end:s.end,text:s.sentence}];el('caption').textContent=(cues.find(c=>t>=c.start&&t<c.end)||((P.holdFinalFrame??P.completeLongForm)&&t>=P.duration?cues[cues.length-1]:{})).text||'';fitCaption();el('label').textContent=s.label||'Illustrated reconstruction · preparing narration';el('label').style.background=s.labelBacking?'#080b11cc':'';el('label').style.padding=s.labelBacking?'.35em .5em':'';el('audioHint').textContent=t>=P.duration?'Ended · Click to replay':playing?'Playing narration · Click to pause':'Paused · Click or Space to play narration';prefetch(sceneIndex());seek.value=t;el('end').style.display=t>=P.duration&&!(P.holdFinalFrame??P.completeLongForm)?'grid':'none'}
function jump(v){++loadEpoch;++playEpoch;waitingIndex=-1;failedIndex=-1;prefetchedIndex=-1;cancelPending();t=Math.max(0,Math.min(P.duration,v));setAudioTime(t);if(t>=P.duration){playing=false;wantPlay=false;narration.pause()}draw();if(wantPlay&&!playing&&waitingIndex===-1&&failedIndex===-1)startAudio();show()}function toggle(){if(t>=P.duration){jump(0)}wantPlay=!wantPlay;if(!wantPlay){++playEpoch;narration.pause();playing=false}else if(ensureScene())startAudio();show();draw()}

stage.onclick=e=>{if(!e.target.closest('#bar,#loading'))toggle()};seek.oninput=()=>jump(+seek.value);stage.onpointermove=show;window.onresize=draw;document.onkeydown=e=>{if(['Space','ArrowLeft','ArrowRight','Home','End'].includes(e.code))e.preventDefault();if(e.code==='Space')toggle();if(e.code==='ArrowLeft')jump(t-5);if(e.code==='ArrowRight')jump(t+5);if(e.code==='Home')jump(0);if(e.code==='End')jump(P.duration);if(e.code==='KeyF'){if(!document.fullscreenElement)stage.requestFullscreen?.();else document.exitFullscreen?.()}};
function frame(now){if(playing){t=Math.min(P.duration,narration.currentTime);if(t>=P.duration)playing=false;draw()}last=now;requestAnimationFrame(frame)}window.motionQA={seek:jump,state:()=>({time:t,playing,duration:P.duration,shot:P.shots.find(s=>t>=s.start&&t<s.end)?.id,subjectTransform:actor.style.transform,cameraTransform:camera.style.transform})};ready=true;playing=false;wantPlay=false;ensureScene();show();requestAnimationFrame(frame);
</script></html>
