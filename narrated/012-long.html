</script><script>const P={"title": "Four Lives, Unanswered Questions", "aspect": "16:9", "duration": 390.2, "shortsSafeZones": false, "holdFinalFrame": true, "shots": [{"id": "long-001", "sentence": "Four young men were murdered in East London, but police initially failed to recognise that their deaths were connected.", "route": "B", "start": 0, "end": 6.36, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 0.0, "spokenEnd": 5.66, "cues": [{"start": 0, "end": 3.453559322033898, "text": "Four young men were murdered in East\nLondon, but police initially failed"}, {"start": 3.453559322033898, "end": 6.36, "text": "to recognise that their\ndeaths were connected."}]}, {"id": "long-002", "sentence": "Their names were Anthony Walgate, Gabriel Kovari, Daniel Whitworth and Jack Taylor.", "route": "B", "start": 6.36, "end": 11.9, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 6.36, "spokenEnd": 11.2, "cues": [{"start": 6.36, "end": 10.491707317073171, "text": "Their names were Anthony Walgate,\nGabriel Kovari, Daniel Whitworth and"}, {"start": 10.491707317073171, "end": 11.9, "text": "Jack Taylor."}]}, {"id": "long-003", "sentence": "Their families and friends kept challenging the answers they were given, and helped bring the connection to light.", "route": "A", "start": 11.9, "end": 18.26, "focus": "68% 56%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/e9ab76ce601c1b23275b.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 11.9, "spokenEnd": 17.34, "cues": [{"start": 11.9, "end": 15.366194690265488, "text": "Their families and friends kept\nchallenging the answers they were given,"}, {"start": 15.366194690265488, "end": 18.26, "text": "and helped bring the\nconnection to light."}]}, {"id": "long-004", "sentence": "Anthony had moved from Hull to study fashion in London, where he was attending Middlesex University and continuing his education.", "route": "A", "start": 18.26, "end": 24.82, "focus": "38% 54%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/2f0b066d0e61fe0a6213.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 18.26, "spokenEnd": 24.14, "cues": [{"start": 18.26, "end": 21.38375, "text": "Anthony had moved from Hull to study\nfashion in London, where he was"}, {"start": 21.38375, "end": 24.82, "text": "attending Middlesex University\nand continuing his education."}]}, {"id": "long-005", "sentence": "Gabriel had come from Slovakia to begin a new life in London, and was staying in the city that summer.", "route": "A", "start": 24.82, "end": 30.78, "focus": "62% 43%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/34e6f5447f5e60167344.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 24.82, "spokenEnd": 30.36, "cues": [{"start": 24.82, "end": 28.604752475247523, "text": "Gabriel had come from Slovakia to\nbegin a new life in London, and was"}, {"start": 28.604752475247523, "end": 30.78, "text": "staying in the city that summer."}]}, {"id": "long-006", "sentence": "Daniel worked as a chef, and his partner described how much he cared about cooking and the work he did.", "route": "A", "start": 30.78, "end": 36.92, "focus": "72% 47%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/0ad68d600e8eb5b376d5.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 30.78, "spokenEnd": 36.34, "cues": [{"start": 30.78, "end": 34.48666666666667, "text": "Daniel worked as a chef, and his\npartner described how much he cared"}, {"start": 34.48666666666667, "end": 36.92, "text": "about cooking and the work he did."}]}, {"id": "long-007", "sentence": "Jack worked as a forklift truck driver, and his sisters remembered a caring, outgoing young man who loved his job.", "route": "B", "start": 36.92, "end": 43.1, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 36.92, "spokenEnd": 42.56, "cues": [{"start": 36.92, "end": 40.31398230088496, "text": "Jack worked as a forklift truck\ndriver, and his sisters remembered a"}, {"start": 40.31398230088496, "end": 43.1, "text": "caring, outgoing young\nman who loved his job."}]}, {"id": "long-008", "sentence": "After the verdict, Jack's family spoke about him as a son, brother, uncle and grandson whose loss had changed their lives.", "route": "B", "start": 43.1, "end": 50.74, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 43.1, "spokenEnd": 50.16, "cues": [{"start": 43.1, "end": 47.0092561983471, "text": "After the verdict, Jack's family\nspoke about him as a son, brother,"}, {"start": 47.0092561983471, "end": 50.74, "text": "uncle and grandson whose\nloss had changed their lives."}]}, {"id": "long-009", "sentence": "That is the scale of this story: four people, and the many relationships and ordinary futures that a murder takes away.", "route": "A", "start": 50.74, "end": 58.58, "focus": "62% 43%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/34e6f5447f5e60167344.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 50.74, "spokenEnd": 58.04, "cues": [{"start": 50.74, "end": 55.1942372881356, "text": "That is the scale of this story: four\npeople, and the many relationships"}, {"start": 55.1942372881356, "end": 58.58, "text": "and ordinary futures\nthat a murder takes away."}]}, {"id": "long-010", "sentence": "The killings took place between June 2014 and September 2015 in Barking, in East London.", "route": "A", "start": 58.58, "end": 64.54, "focus": "62% 43%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/34e6f5447f5e60167344.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 58.58, "spokenEnd": 64.02, "cues": [{"start": 58.58, "end": 63.08206896551724, "text": "The killings took place between June\n2014 and September 2015 in Barking,"}, {"start": 63.08206896551724, "end": 64.54, "text": "in East London."}]}, {"id": "long-011", "sentence": "After Anthony's death, Stephen Port lied about what had happened, and those lies led to a conviction for perverting the course of justice.", "route": "B", "start": 64.54, "end": 72.18, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 64.54, "spokenEnd": 71.52, "cues": [{"start": 64.54, "end": 68.05547445255475, "text": "After Anthony's death, Stephen Port\nlied about what had happened, and"}, {"start": 68.05547445255475, "end": 72.18, "text": "those lies led to a conviction for\nperverting the course of justice."}]}, {"id": "long-012", "sentence": "But the murder case had not yet been recognised, and Port's revised account was apparently accepted, the sentencing judge later explained.", "route": "A", "start": 72.18, "end": 79.36, "focus": "50% 65%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/9a44320faf39575bd148.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 72.18, "spokenEnd": 78.74, "cues": [{"start": 72.18, "end": 75.38817518248175, "text": "But the murder case had not yet\nbeen recognised, and Port's revised"}, {"start": 75.38817518248175, "end": 79.36, "text": "account was apparently accepted, the\nsentencing judge later explained."}]}, {"id": "long-013", "sentence": "Gabriel died in August 2014, Daniel in September, and Jack a year later.", "route": "B", "start": 79.36, "end": 83.82, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 79.36, "spokenEnd": 83.82, "cues": [{"start": 79.36, "end": 83.82, "text": "Gabriel died in August 2014, Daniel\nin September, and Jack a year later."}]}, {"id": "long-014", "sentence": "The coroner's later account described repeated failures to investigate suspicious circumstances, including information already available to police.", "route": "A", "start": 83.82, "end": 92.94, "focus": "50% 56%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/e9ab76ce601c1b23275b.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 83.82, "spokenEnd": 92.32, "cues": [{"start": 83.82, "end": 87.92344827586206, "text": "The coroner's later account described\nrepeated failures to investigate"}, {"start": 87.92344827586206, "end": 91.90965517241378, "text": "suspicious circumstances, including\ninformation already available to"}, {"start": 91.90965517241378, "end": 92.94, "text": "police."}]}, {"id": "long-015", "sentence": "Information can be present in a system without becoming a question that anyone pursues, and that distinction mattered here.", "route": "A", "start": 92.94, "end": 99.56, "focus": "68% 56%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/e9ab76ce601c1b23275b.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 92.94, "spokenEnd": 99.06, "cues": [{"start": 92.94, "end": 96.5016393442623, "text": "Information can be present in a system\nwithout becoming a question that"}, {"start": 96.5016393442623, "end": 99.56, "text": "anyone pursues, and that\ndistinction mattered here."}]}, {"id": "long-016", "sentence": "The inspectorate's later review said officers treated the deaths separately and failed to pursue links between them.", "route": "A", "start": 99.56, "end": 105.14, "focus": "32% 56%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/e9ab76ce601c1b23275b.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 99.56, "spokenEnd": 104.66, "cues": [{"start": 99.56, "end": 102.39826086956522, "text": "The inspectorate's later review\nsaid officers treated the deaths"}, {"start": 102.39826086956522, "end": 105.14, "text": "separately and failed to\npursue links between them."}]}, {"id": "long-017", "sentence": "It credited persistent challenges from relatives and friends with helping police identify Port in CCTV footage with Jack.", "route": "B", "start": 105.14, "end": 112.16, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 105.14, "spokenEnd": 111.7, "cues": [{"start": 105.14, "end": 108.69333333333333, "text": "It credited persistent challenges\nfrom relatives and friends with"}, {"start": 108.69333333333333, "end": 112.16, "text": "helping police identify Port\nin CCTV footage with Jack."}]}, {"id": "long-018", "sentence": "Port was arrested for murder in October 2015, after the fourth death.", "route": "A", "start": 112.16, "end": 117.14, "focus": "50% 65%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/9a44320faf39575bd148.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 112.16, "spokenEnd": 116.5, "cues": [{"start": 112.16, "end": 117.14, "text": "Port was arrested for murder in\nOctober 2015, after the fourth death."}]}, {"id": "long-019", "sentence": "The new investigation, Operation Lilford, brought murder charges and also identified surviving victims.", "route": "A", "start": 117.14, "end": 123.06, "focus": "32% 56%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/e9ab76ce601c1b23275b.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 117.14, "spokenEnd": 122.42, "cues": [{"start": 117.14, "end": 120.66, "text": "The new investigation, Operation\nLilford, brought murder charges and"}, {"start": 120.66, "end": 123.06, "text": "also identified surviving victims."}]}, {"id": "long-020", "sentence": "On November 25, 2016, Mr Justice Openshaw sentenced Port for all four murders at the Central Criminal Court.", "route": "B", "start": 123.06, "end": 130.14, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 123.06, "spokenEnd": 129.54, "cues": [{"start": 123.06, "end": 127.23869158878504, "text": "On November 25, 2016, Mr Justice\nOpenshaw sentenced Port for all four"}, {"start": 127.23869158878504, "end": 130.14, "text": "murders at the Central Criminal Court."}]}, {"id": "long-021", "sentence": "He imposed life imprisonment with a whole-life order, declining to set a minimum term for the murders.", "route": "A", "start": 130.14, "end": 136.6, "focus": "50% 38%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/9a44320faf39575bd148.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 130.14, "spokenEnd": 135.96, "cues": [{"start": 130.14, "end": 134.2889108910891, "text": "He imposed life imprisonment with a\nwhole-life order, declining to set a"}, {"start": 134.2889108910891, "end": 136.6, "text": "minimum term for the murders."}]}, {"id": "long-022", "sentence": "The judge had explicitly left questions about the adequacy of the police investigation for others to examine in a later inquiry.", "route": "B", "start": 136.6, "end": 143.56, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 136.6, "spokenEnd": 142.76, "cues": [{"start": 136.6, "end": 140.09228346456692, "text": "The judge had explicitly left questions\nabout the adequacy of the police"}, {"start": 140.09228346456692, "end": 143.56, "text": "investigation for others to\nexamine in a later inquiry."}]}, {"id": "long-023", "sentence": "For the families, the conviction therefore sat alongside questions that a murder trial had not answered.", "route": "A", "start": 143.56, "end": 149.4, "focus": "50% 38%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/9a44320faf39575bd148.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 143.56, "spokenEnd": 148.88, "cues": [{"start": 143.56, "end": 147.22718446601942, "text": "For the families, the conviction\ntherefore sat alongside questions that"}, {"start": 147.22718446601942, "end": 149.4, "text": "a murder trial had not answered."}]}, {"id": "long-024", "sentence": "Speaking outside court after the verdict, Daniel's stepmother said the families had supported one another through the proceedings.", "route": "B", "start": 149.4, "end": 156.08, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 149.4, "spokenEnd": 155.24, "cues": [{"start": 149.4, "end": 152.56899224806202, "text": "Speaking outside court after the\nverdict, Daniel's stepmother said the"}, {"start": 152.56899224806202, "end": 156.08, "text": "families had supported one\nanother through the proceedings."}]}, {"id": "long-025", "sentence": "She also described the emotional and physical exhaustion of their search for answers, and said that search would continue.", "route": "B", "start": 156.08, "end": 162.46, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 156.08, "spokenEnd": 161.92, "cues": [{"start": 156.08, "end": 159.55504132231405, "text": "She also described the emotional and\nphysical exhaustion of their search"}, {"start": 159.55504132231405, "end": 162.46, "text": "for answers, and said that\nsearch would continue."}]}, {"id": "long-026", "sentence": "Their persistence was already part of the public record when the criminal case ended, rather than something invented by later retellings.", "route": "A", "start": 162.46, "end": 169.14, "focus": "50% 53%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/abda50830d232c8b6cab.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 162.46, "spokenEnd": 169.14, "cues": [{"start": 162.46, "end": 165.6035294117647, "text": "Their persistence was already\npart of the public record when the"}, {"start": 165.6035294117647, "end": 169.14, "text": "criminal case ended, rather than\nsomething invented by later retellings."}]}, {"id": "long-027", "sentence": "The inquests into all four deaths concluded on December 10, 2021, with findings that each man had been unlawfully killed.", "route": "B", "start": 169.14, "end": 177.54, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 169.14, "spokenEnd": 176.94, "cues": [{"start": 169.14, "end": 173.69, "text": "The inquests into all four deaths\nconcluded on December 10, 2021, with"}, {"start": 173.69, "end": 177.54, "text": "findings that each man had\nbeen unlawfully killed."}]}, {"id": "long-028", "sentence": "The coroner then set out concerns in a report intended to help prevent future deaths by identifying risks requiring action.", "route": "A", "start": 177.54, "end": 184.48, "focus": "32% 56%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/e9ab76ce601c1b23275b.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 177.54, "spokenEnd": 183.94, "cues": [{"start": 177.54, "end": 181.212131147541, "text": "The coroner then set out concerns\nin a report intended to help prevent"}, {"start": 181.212131147541, "end": 184.48, "text": "future deaths by identifying\nrisks requiring action."}]}, {"id": "long-029", "sentence": "That process widened the question beyond who committed the murders to how public institutions could reduce the risk of another failure.", "route": "A", "start": 184.48, "end": 191.86, "focus": "50% 65%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/9a44320faf39575bd148.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 184.48, "spokenEnd": 191.24, "cues": [{"start": 184.48, "end": 187.96089552238806, "text": "That process widened the question\nbeyond who committed the murders to"}, {"start": 187.96089552238806, "end": 191.86, "text": "how public institutions could\nreduce the risk of another failure."}]}, {"id": "long-030", "sentence": "On June 23, 2022, the Independent Office for Police Conduct announced that it would investigate the police handling of the deaths again.", "route": "B", "start": 191.86, "end": 199.96, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 191.86, "spokenEnd": 199.38, "cues": [{"start": 191.86, "end": 195.70355555555557, "text": "On June 23, 2022, the Independent\nOffice for Police Conduct announced"}, {"start": 195.70355555555557, "end": 199.96, "text": "that it would investigate the\npolice handling of the deaths again."}]}, {"id": "long-031", "sentence": "It said the inquests had revealed evidence that had not been available to its earlier investigation, which ended in 2018.", "route": "A", "start": 199.96, "end": 207.04, "focus": "32% 56%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/e9ab76ce601c1b23275b.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 199.96, "spokenEnd": 206.4, "cues": [{"start": 199.96, "end": 203.71666666666667, "text": "It said the inquests had revealed\nevidence that had not been available"}, {"start": 203.71666666666667, "end": 207.04, "text": "to its earlier investigation,\nwhich ended in 2018."}]}, {"id": "long-032", "sentence": "The watchdog explained that it had compared the original material with accounts and documents presented during the inquests.", "route": "A", "start": 207.04, "end": 213.7, "focus": "50% 56%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/e9ab76ce601c1b23275b.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 207.04, "spokenEnd": 213.16, "cues": [{"start": 207.04, "end": 210.5229268292683, "text": "The watchdog explained that it had\ncompared the original material with"}, {"start": 210.5229268292683, "end": 213.7, "text": "accounts and documents\npresented during the inquests."}]}, {"id": "long-033", "sentence": "Its statement described legal conditions for reopening, including significant new information that could have affected the earlier investigation's outcomes.", "route": "A", "start": 213.7, "end": 222.06, "focus": "50% 65%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/9a44320faf39575bd148.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 213.7, "spokenEnd": 221.36, "cues": [{"start": 213.7, "end": 216.9331168831169, "text": "Its statement described legal\nconditions for reopening, including"}, {"start": 216.9331168831169, "end": 220.11649350649353, "text": "significant new information that\ncould have affected the earlier"}, {"start": 220.11649350649353, "end": 222.06, "text": "investigation's outcomes."}]}, {"id": "long-034", "sentence": "An announcement of another investigation was a procedural step; it was not, by itself, a final disciplinary finding against any officer.", "route": "B", "start": 222.06, "end": 229.9, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 222.06, "spokenEnd": 229.34, "cues": [{"start": 222.06, "end": 225.83481481481482, "text": "An announcement of another investigation\nwas a procedural step; it was"}, {"start": 225.83481481481482, "end": 229.9, "text": "not, by itself, a final disciplinary\nfinding against any officer."}]}, {"id": "long-035", "sentence": "In April 2023, a separate inspection report examined the Metropolitan Police's response to the lessons of these deaths.", "route": "B", "start": 229.9, "end": 237.4, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 229.9, "spokenEnd": 236.74, "cues": [{"start": 229.9, "end": 233.89966101694915, "text": "In April 2023, a separate inspection\nreport examined the Metropolitan"}, {"start": 233.89966101694915, "end": 237.4, "text": "Police's response to the\nlessons of these deaths."}]}, {"id": "long-036", "sentence": "Inspectors identified weaknesses in training for officers and supervisors dealing with sudden deaths, as well as training about the Port case.", "route": "A", "start": 237.4, "end": 245.48, "focus": "67% 57%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/c4f1602783bcbd446070.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 237.4, "spokenEnd": 244.92, "cues": [{"start": 237.4, "end": 240.67657142857144, "text": "Inspectors identified weaknesses\nin training for officers and"}, {"start": 240.67657142857144, "end": 244.38285714285715, "text": "supervisors dealing with sudden\ndeaths, as well as training about the"}, {"start": 244.38285714285715, "end": 245.48, "text": "Port case."}]}, {"id": "long-037", "sentence": "They found poor supervision and unreliable records, including reports with missing details and problems with the handling of property and exhibits.", "route": "A", "start": 245.48, "end": 253.36, "focus": "32% 56%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/e9ab76ce601c1b23275b.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 245.48, "spokenEnd": 252.64, "cues": [{"start": 245.48, "end": 248.88717241379308, "text": "They found poor supervision and\nunreliable records, including reports"}, {"start": 248.88717241379308, "end": 252.19558620689654, "text": "with missing details and problems\nwith the handling of property and"}, {"start": 252.19558620689654, "end": 253.36, "text": "exhibits."}]}, {"id": "long-038", "sentence": "An excessive amount of confusing guidance also made it harder for officers to understand what they were supposed to do.", "route": "A", "start": 253.36, "end": 259.9, "focus": "67% 57%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/c4f1602783bcbd446070.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 253.36, "spokenEnd": 259.4, "cues": [{"start": 253.36, "end": 256.68711864406777, "text": "An excessive amount of confusing\nguidance also made it harder for"}, {"start": 256.68711864406777, "end": 259.9, "text": "officers to understand what\nthey were supposed to do."}]}, {"id": "long-039", "sentence": "Inspectors criticised intelligence and crime analysis, and recommended better use of information to identify links and patterns across deaths.", "route": "A", "start": 259.9, "end": 267.82, "focus": "68% 56%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/e9ab76ce601c1b23275b.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 259.9, "spokenEnd": 267.18, "cues": [{"start": 259.9, "end": 263.5141843971631, "text": "Inspectors criticised intelligence\nand crime analysis, and recommended"}, {"start": 263.5141843971631, "end": 267.82, "text": "better use of information to identify\nlinks and patterns across deaths."}]}, {"id": "long-040", "sentence": "Speaking to Sky News in April 2023, inspector Matt Parr described a gap between specialist homicide work and the initial handling of unexplained deaths.", "route": "B", "start": 267.82, "end": 277.66, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 267.82, "spokenEnd": 277.0, "cues": [{"start": 267.82, "end": 272.16519999999997, "text": "Speaking to Sky News in April 2023,\ninspector Matt Parr described a gap"}, {"start": 272.16519999999997, "end": 276.5716, "text": "between specialist homicide work and\nthe initial handling of unexplained"}, {"start": 276.5716, "end": 277.66, "text": "deaths."}]}, {"id": "long-041", "sentence": "The first assessment could shape what happened next, before the strongest investigative resources were ever brought into a case.", "route": "A", "start": 277.66, "end": 284.22, "focus": "50% 56%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/e9ab76ce601c1b23275b.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 277.66, "spokenEnd": 283.7, "cues": [{"start": 277.66, "end": 280.65622047244096, "text": "The first assessment could shape\nwhat happened next, before the"}, {"start": 280.65622047244096, "end": 284.22, "text": "strongest investigative resources\nwere ever brought into a case."}]}, {"id": "long-042", "sentence": "The report made twenty recommendations, including improving family liaison and the quality of training for staff investigating deaths.", "route": "A", "start": 284.22, "end": 291.02, "focus": "67% 57%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/c4f1602783bcbd446070.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 284.22, "spokenEnd": 290.32, "cues": [{"start": 284.22, "end": 287.24706766917296, "text": "The report made twenty recommendations,\nincluding improving family"}, {"start": 287.24706766917296, "end": 291.02, "text": "liaison and the quality of training\nfor staff investigating deaths."}]}, {"id": "long-043", "sentence": "For bereaved relatives, being heard and kept informed belonged alongside the technical work of investigating, rather than being treated as an optional courtesy.", "route": "A", "start": 291.02, "end": 299.8, "focus": "50% 53%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/abda50830d232c8b6cab.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 291.02, "spokenEnd": 298.94, "cues": [{"start": 291.02, "end": 294.6291139240506, "text": "For bereaved relatives, being heard\nand kept informed belonged alongside"}, {"start": 294.6291139240506, "end": 298.0377215189873, "text": "the technical work of investigating,\nrather than being treated as an"}, {"start": 298.0377215189873, "end": 299.8, "text": "optional courtesy."}]}, {"id": "long-044", "sentence": "The inspectorate also considered whether homophobia helped explain the failures, but said it could not reach a definitive conclusion on that question.", "route": "B", "start": 299.8, "end": 307.64, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 299.8, "spokenEnd": 307.12, "cues": [{"start": 299.8, "end": 303.26216216216216, "text": "The inspectorate also considered\nwhether homophobia helped explain the"}, {"start": 303.26216216216216, "end": 306.67486486486484, "text": "failures, but said it could not\nreach a definitive conclusion on that"}, {"start": 306.67486486486484, "end": 307.64, "text": "question."}]}, {"id": "long-045", "sentence": "That uncertainty cannot fairly be turned into proof of individual discriminatory intent, or into a declaration that discrimination played no part.", "route": "B", "start": 307.64, "end": 316.14, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 307.64, "spokenEnd": 315.64, "cues": [{"start": 307.64, "end": 311.2511111111111, "text": "That uncertainty cannot fairly be\nturned into proof of individual"}, {"start": 311.2511111111111, "end": 315.19555555555553, "text": "discriminatory intent, or into a\ndeclaration that discrimination played"}, {"start": 315.19555555555553, "end": 316.14, "text": "no part."}]}, {"id": "long-046", "sentence": "In its response to the coroner, the Metropolitan Police had described changes to how deaths would be classified and investigated.", "route": "A", "start": 316.14, "end": 322.98, "focus": "32% 56%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/e9ab76ce601c1b23275b.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 316.14, "spokenEnd": 322.28, "cues": [{"start": 316.14, "end": 319.44984374999996, "text": "In its response to the coroner, the\nMetropolitan Police had described"}, {"start": 319.44984374999996, "end": 322.98, "text": "changes to how deaths would be\nclassified and investigated."}]}, {"id": "long-047", "sentence": "The categories distinguished an unexpected death still under investigation from one investigated and found not suspicious.", "route": "A", "start": 322.98, "end": 331.08, "focus": "50% 56%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "master": "assets/e9ab76ce601c1b23275b.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 322.98, "spokenEnd": 330.24, "cues": [{"start": 322.98, "end": 326.58000000000004, "text": "The categories distinguished\nan unexpected death still under"}, {"start": 326.58000000000004, "end": 331.08, "text": "investigation from one investigated\nand found not suspicious."}]}, {"id": "long-048", "sentence": "The distinction mattered because uncertainty about a death should remain a reason to investigate, rather than becoming a reason to stop asking questions.", "route": "B", "start": 331.08, "end": 339.06, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 331.08, "spokenEnd": 338.42, "cues": [{"start": 331.08, "end": 334.57986754966885, "text": "The distinction mattered because\nuncertainty about a death should remain"}, {"start": 334.57986754966885, "end": 337.9339072847682, "text": "a reason to investigate, rather than\nbecoming a reason to stop asking"}, {"start": 337.9339072847682, "end": 339.06, "text": "questions."}]}, {"id": "long-049", "sentence": "Responding to the April 2023 inspection, the force apologised to the victims and families and acknowledged that more work was needed.", "route": "B", "start": 339.06, "end": 346.76, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI-generated editorial illustration · narrated review draft", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.35619909722772, "top": 16.94762391121453, "width": 56.829575843227076, "anchorX": 50.0, "anchorY": 94.45933869526364}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 339.06, "spokenEnd": 346.18, "cues": [{"start": 339.06, "end": 342.7278787878788, "text": "Responding to the April 2023\ninspection, the force apologised to the"}, {"start": 342.7278787878788, "end": 346.76, "text": "victims and families and acknowledged\nthat more work was needed."}]}, {"id": "long-050", "sentence": "It said it had updated frontline training and begun enhanced training for supervisors, while promising to consider the recommendations.", "route": "A", "start": 346.76, "end": 353.8, "focus": "67% 57%", "platePosition": "50% 50.0%", "label": "AI-generated editorial ill
