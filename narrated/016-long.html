ed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0.0, "top": -0.026581605528973953, "width": 100.0, "anchorX": 46.65071770334928, "anchorY": 93.30499468650372}, "spokenStart": 140.16, "spokenEnd": 143.04, "cues": [{"start": 140.16, "end": 143.72, "text": "The trafficking charge concerned\nstolen goods, not drugs."}]}, {"id": "long-021", "sentence": "In April 2017, a Quebec Superior Court judge sentenced him to eight years in prison and imposed a multimillion-dollar fine.", "captionGroups": ["In April 2017, a Quebec Superior Court judge sentenced him to eight years in", "prison and imposed a multimillion-dollar fine."], "route": "A", "start": 143.72, "end": 151.12, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "70.0% 26.0%", "motion": {"cameraStart": 1.18, "cameraEnd": 1.26}, "master": "assets/c25f693af47f27b2248a.png", "spokenStart": 143.72, "spokenEnd": 150.48, "cues": [{"start": 143.72, "end": 147.7839344262295, "text": "In April 2017, a Quebec Superior\nCourt judge sentenced him to eight"}, {"start": 147.7839344262295, "end": 151.12, "text": "years in prison and imposed\na multimillion-dollar fine."}]}, {"id": "long-022", "sentence": "The prison term was one part of the sentence, while the financial order would become the focus of a further dispute.", "captionGroups": ["The prison term was one part of the sentence, while the financial order", "would become the focus of a further dispute."], "route": "A", "start": 151.12, "end": 156.92, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 52.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/ddab35b8b58e84ee90f7.png", "spokenStart": 151.12, "spokenEnd": 156.24, "cues": [{"start": 151.12, "end": 154.70086956521737, "text": "The prison term was one part of the\nsentence, while the financial order"}, {"start": 154.70086956521737, "end": 156.92, "text": "would become the focus\nof a further dispute."}]}, {"id": "long-023", "sentence": "The verdict had established criminal responsibility, but it did not end the argument over how much he should be required to pay.", "captionGroups": ["The verdict had established criminal responsibility, but it did not end the", "argument over how much he should be required to pay."], "route": "A", "start": 156.92, "end": 164.06, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "63.0% 46.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "master": "assets/6be00c0ad7f0c33f5676.png", "spokenStart": 156.92, "spokenEnd": 163.54, "cues": [{"start": 156.92, "end": 160.9116535433071, "text": "The verdict had established criminal\nresponsibility, but it did not end"}, {"start": 160.9116535433071, "end": 164.06, "text": "the argument over how much\nhe should be required to pay."}]}, {"id": "long-024", "sentence": "At trial, Vallières said he had sold the syrup for ten million Canadian dollars and personally kept a profit of about one million.", "captionGroups": ["At trial, Vallières said he had sold the syrup for ten million Canadian", "dollars and personally kept a profit of about one million."], "route": "B", "start": 164.06, "end": 171.78, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0.0, "top": -0.026581605528973953, "width": 100.0, "anchorX": 46.65071770334928, "anchorY": 93.30499468650372}, "spokenStart": 164.06, "spokenEnd": 171.16, "cues": [{"start": 164.06, "end": 168.30899224806203, "text": "At trial, Vallières said he had sold\nthe syrup for ten million Canadian"}, {"start": 168.30899224806203, "end": 171.78, "text": "dollars and personally kept a\nprofit of about one million."}]}, {"id": "long-025", "sentence": "Those figures described different things: the money from sales, and the smaller amount he said remained as his own gain.", "captionGroups": ["Those figures described different things: the money from sales, and the", "smaller amount he said remained as his own gain."], "route": "A", "start": 171.78, "end": 178.8, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "47.0% 48.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "master": "assets/7ce894c84014c82d732e.png", "spokenStart": 171.78, "spokenEnd": 178.16, "cues": [{"start": 171.78, "end": 175.96840336134454, "text": "Those figures described different\nthings: the money from sales, and the"}, {"start": 175.96840336134454, "end": 178.8, "text": "smaller amount he said\nremained as his own gain."}]}, {"id": "long-026", "sentence": "A sale price and a profit are not interchangeable, just as the value of stock in a warehouse is different from a seller's earnings.", "captionGroups": ["A sale price and a profit are not interchangeable, just as the value of", "stock in a warehouse is different from a seller's earnings."], "route": "A", "start": 178.8, "end": 186.36, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "20.0% 43.0%", "motion": {"cameraStart": 1.1984, "cameraEnd": 1.12}, "master": "assets/f49aad2c2c55780cfb2e.png", "spokenStart": 178.8, "spokenEnd": 185.6, "cues": [{"start": 178.8, "end": 182.9289230769231, "text": "A sale price and a profit are not\ninterchangeable, just as the value of"}, {"start": 182.9289230769231, "end": 186.36, "text": "stock in a warehouse is different\nfrom a seller's earnings."}]}, {"id": "long-027", "sentence": "The Supreme Court's public summary described the penalty as a fine in lieu, imposed when the stolen property could not be returned to its owner.", "captionGroups": ["The Supreme Court's public summary described the penalty as a fine in", "lieu, imposed when the stolen property could not be returned to its owner."], "route": "B", "start": 186.36, "end": 194.64, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0.0, "top": -0.026581605528973953, "width": 100.0, "anchorX": 46.65071770334928, "anchorY": 93.30499468650372}, "spokenStart": 186.36, "spokenEnd": 194.12, "cues": [{"start": 186.36, "end": 190.38338028169014, "text": "The Supreme Court's public summary\ndescribed the penalty as a fine in"}, {"start": 190.38338028169014, "end": 194.2901408450704, "text": "lieu, imposed when the stolen\nproperty could not be returned to its"}, {"start": 194.2901408450704, "end": 194.64, "text": "owner."}]}, {"id": "long-028", "sentence": "In plain language, the financial order stood in place of forfeiting property that was no longer available for that purpose.", "captionGroups": ["In plain language, the financial order stood in place of forfeiting property", "that was no longer available for that purpose."], "route": "A", "start": 194.64, "end": 201.78, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 51.0%", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "master": "assets/ddab35b8b58e84ee90f7.png", "spokenStart": 194.64, "spokenEnd": 201.1, "cues": [{"start": 194.64, "end": 198.5611475409836, "text": "In plain language, the financial\norder stood in place of forfeiting"}, {"start": 198.5611475409836, "end": 201.78, "text": "property that was no longer\navailable for that purpose."}]}, {"id": "long-029", "sentence": "The Quebec Court of Appeal reduced the penalty, and prosecutors asked the Supreme Court of Canada to reverse that decision.", "captionGroups": ["The Quebec Court of Appeal reduced the penalty, and prosecutors asked the", "Supreme Court of Canada to reverse that decision."], "route": "A", "start": 201.78, "end": 208.86, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "62.0% 42.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "master": "assets/6be00c0ad7f0c33f5676.png", "spokenStart": 201.78, "spokenEnd": 208.32, "cues": [{"start": 201.78, "end": 205.784262295082, "text": "The Quebec Court of Appeal reduced\nthe penalty, and prosecutors asked"}, {"start": 205.784262295082, "end": 208.86, "text": "the Supreme Court of Canada\nto reverse that decision."}]}, {"id": "long-030", "sentence": "The official case record shows the lower appeal court used a one-million-dollar basis, then deducted a separate restitution order.", "captionGroups": ["The official case record shows the lower appeal court used a", "one-million-dollar basis, then deducted a separate restitution order."], "route": "A", "start": 208.86, "end": 215.64, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "79.0% 52.0%", "motion": {"cameraStart": 1.1984, "cameraEnd": 1.12}, "master": "assets/7ce894c84014c82d732e.png", "spokenStart": 208.86, "spokenEnd": 215.18, "cues": [{"start": 208.86, "end": 212.01348837209304, "text": "The official case record shows\nthe lower appeal court used a"}, {"start": 212.01348837209304, "end": 215.64, "text": "one-million-dollar basis, then\ndeducted a separate restitution order."}]}, {"id": "long-031", "sentence": "That left a net fine of approximately one hundred seventy-one thousand Canadian dollars.", "captionGroups": ["That left a net fine of approximately one hundred seventy-one thousand", "Canadian dollars."], "route": "B", "start": 215.64, "end": 220.16, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0.0, "top": -0.026581605528973953, "width": 100.0, "anchorX": 46.65071770334928, "anchorY": 93.30499468650372}, "spokenStart": 215.64, "spokenEnd": 219.14, "cues": [{"start": 215.64, "end": 219.2767816091954, "text": "That left a net fine of approximately\none hundred seventy-one thousand"}, {"start": 219.2767816091954, "end": 220.16, "text": "Canadian dollars."}]}, {"id": "long-032", "sentence": "The appeal had therefore changed the financial consequences substantially, without making the stolen syrup reappear or undoing the conviction.", "captionGroups": ["The appeal had therefore changed the financial consequences substantially,", "without making the stolen syrup reappear or undoing the conviction."], "route": "A", "start": 220.16, "end": 228.86, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "61.0% 45.0%", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "master": "assets/f49aad2c2c55780cfb2e.png", "spokenStart": 220.16, "spokenEnd": 228.0, "cues": [{"start": 220.16, "end": 223.82642857142858, "text": "The appeal had therefore changed\nthe financial consequences"}, {"start": 223.82642857142858, "end": 228.17642857142857, "text": "substantially, without making the\nstolen syrup reappear or undoing the"}, {"start": 228.17642857142857, "end": 228.86, "text": "conviction."}]}, {"id": "long-033", "sentence": "In September 2020, the Supreme Court agreed to hear the prosecution's challenge to the reduced fine.", "captionGroups": ["In September 2020, the Supreme Court agreed to hear the prosecution's", "challenge to the reduced fine."], "route": "A", "start": 228.86, "end": 234.66, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 40.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "master": "assets/fa22b5ccd7daac18063d.png", "spokenStart": 228.86, "spokenEnd": 234.04, "cues": [{"start": 228.86, "end": 232.90242424242425, "text": "In September 2020, the Supreme Court\nagreed to hear the prosecution's"}, {"start": 232.90242424242425, "end": 234.66, "text": "challenge to the reduced fine."}]}, {"id": "long-034", "sentence": "The question reaching the country's highest court concerned how the penalty should be calculated after the crime had already been proved.", "captionGroups": ["The question reaching the country's highest court concerned how the", "penalty should be calculated after the crime had already been proved."], "route": "B", "start": 234.66, "end": 241.36, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0.0, "top": -0.026581605528973953, "width": 100.0, "anchorX": 46.65071770334928, "anchorY": 93.30499468650372}, "spokenStart": 234.66, "spokenEnd": 240.8, "cues": [{"start": 234.66, "end": 237.96073529411765, "text": "The question reaching the country's\nhighest court concerned how the"}, {"start": 237.96073529411765, "end": 241.36, "text": "penalty should be calculated after\nthe crime had already been proved."}]}, {"id": "long-035", "sentence": "On March 31, 2022, the Supreme Court allowed the Crown's appeal and set the fine at just over nine million Canadian dollars.", "captionGroups": ["On March 31, 2022, the Supreme Court allowed the Crown's appeal and set the", "fine at just over nine million Canadian dollars."], "route": "B", "start": 241.36, "end": 249.52, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0.0, "top": -0.026581605528973953, "width": 100.0, "anchorX": 46.65071770334928, "anchorY": 93.30499468650372}, "spokenStart": 241.36, "spokenEnd": 248.94, "cues": [{"start": 241.36, "end": 246.07024390243905, "text": "On March 31, 2022, the Supreme Court\nallowed the Crown's appeal and set"}, {"start": 246.07024390243905, "end": 249.52, "text": "the fine at just over nine\nmillion Canadian dollars."}]}, {"id": "long-036", "sentence": "The decision was unanimous, and it rejected limiting the fine to Vallières' personal profit.", "captionGroups": ["The decision was unanimous, and it rejected limiting the fine to", "Vallières' personal profit."], "route": "A", "start": 249.52, "end": 254.96, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "62.0% 31.0%", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "master": "assets/c25f693af47f27b2248a.png", "spokenStart": 249.52, "spokenEnd": 254.44, "cues": [{"start": 249.52, "end": 253.34593406593407, "text": "The decision was unanimous, and\nit rejected limiting the fine to"}, {"start": 253.34593406593407, "end": 254.96, "text": "Vallières' personal profit."}]}, {"id": "long-037", "sentence": "The calculation began with ten million dollars and subtracted a separate restitution order of roughly eight hundred twenty-nine thousand dollars.", "captionGroups": ["The calculation began with ten million dollars and subtracted a separate", "restitution order of roughly eight hundred twenty-nine thousand dollars."], "route": "A", "start": 254.96, "end": 263.3, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "52.0% 52.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "master": "assets/7ce894c84014c82d732e.png", "spokenStart": 254.96, "spokenEnd": 262.66, "cues": [{"start": 254.96, "end": 259.13, "text": "The calculation began with ten million\ndollars and subtracted a separate"}, {"start": 259.13, "end": 263.3, "text": "restitution order of roughly eight\nhundred twenty-nine thousand dollars."}]}, {"id": "long-038", "sentence": "The resulting fine was nine million, one hundred seventy-one thousand, three hundred ninety-seven dollars and fifty-seven cents.", "captionGroups": ["The resulting fine was nine million, one hundred seventy-one thousand,", "three hundred ninety-seven dollars and fifty-seven cents."], "route": "B", "start": 263.3, "end": 269.64, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0.0, "top": -0.026581605528973953, "width": 100.0, "anchorX": 46.65071770334928, "anchorY": 93.30499468650372}, "spokenStart": 263.3, "spokenEnd": 269.64, "cues": [{"start": 263.3, "end": 266.7944881889764, "text": "The resulting fine was nine million,\none hundred seventy-one thousand,"}, {"start": 266.7944881889764, "end": 269.64, "text": "three hundred ninety-seven\ndollars and fifty-seven cents."}]}, {"id": "long-039", "sentence": "The subtraction recognised another court order; it was not an announcement that this amount had already been paid back to producers.", "captionGroups": ["The subtraction recognised another court order; it was not an", "announcement that this amount had already been paid back to producers."], "route": "A", "start": 269.64, "end": 277.5, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "59.0% 48.0%", "motion": {"cameraStart": 1.12, "cameraEnd": 1.1984}, "master": "assets/7ce894c84014c82d732e.png", "spokenStart": 269.64, "spokenEnd": 276.64, "cues": [{"start": 269.64, "end": 273.3, "text": "The subtraction recognised\nanother court order; it was not an"}, {"start": 273.3, "end": 277.5, "text": "announcement that this amount had\nalready been paid back to producers."}]}, {"id": "long-040", "sentence": "The court's summary also explained that responsibility for property could be divided among multiple people when the evidence supported that division.", "captionGroups": ["The court's summary also explained that responsibility for property could", "be divided among multiple people when the evidence supported that division."], "route": "A", "start": 277.5, "end": 285.5, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "51.0% 48.0%", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "master": "assets/ddab35b8b58e84ee90f7.png", "spokenStart": 277.5, "spokenEnd": 284.92, "cues": [{"start": 277.5, "end": 281.1462585034014, "text": "The court's summary also explained\nthat responsibility for property"}, {"start": 281.1462585034014, "end": 285.01020408163265, "text": "could be divided among multiple people\nwhen the evidence supported that"}, {"start": 285.01020408163265, "end": 285.5, "text": "division."}]}, {"id": "long-041", "sentence": "That qualification could prevent double recovery, but Vallières had not established the necessary division in this case.", "captionGroups": ["That qualification could prevent double recovery, but Vallières had not", "established the necessary division in this case."], "route": "B", "start": 285.5, "end": 291.84, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0.0, "top": -0.026581605528973953, "width": 100.0, "anchorX": 46.65071770334928, "anchorY": 93.30499468650372}, "spokenStart" }, {"start": 301.81984, "end": 305.52, "text": "imprisonment in default, consecutive\nto any other prison term."}]}, {"id": "long-044", "sentence": "Those were the terms imposed in 2022, rather than proof of a later default or a statement about where he is now.", "captionGroups": ["Those were the terms imposed in 2022, rather than proof of a later default", "or a statement about where he is now."], "route": "B", "start": 305.52, "end": 312.82, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0.0, "top": -0.026581605528973953, "width": 100.0, "anchorX": 46.65071770334928, "anchorY": 93.30499468650372}, "spokenStart": 305.52, "spokenEnd": 312.26, "cues": [{"start": 305.52, "end": 309.8605405405405, "text": "Those were the terms imposed in\n2022, rather than proof of a later"}, {"start": 309.8605405405405, "end": 312.82, "text": "default or a statement\nabout where he is now."}]}, {"id": "long-045", "sentence": "The long route through sentencing and appeals shows why a theft's headline value does not automatically tell us the amount of every resulting order.", "captionGroups": ["The long route through sentencing and appeals shows why a theft's headline", "value does not automatically tell us the amount of every resulting order."], "route": "A", "start": 312.82, "end": 320.72, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "59.0% 76.0%", "motion": {"cameraStart": 1.12, "cameraEnd": 1.1984}, "master": "assets/6be00c0ad7f0c33f5676.png", "spokenStart": 312.82, "spokenEnd": 320.22, "cues": [{"start": 312.82, "end": 316.33712328767126, "text": "The long route through sentencing\nand appeals shows why a theft's"}, {"start": 316.33712328767126, "end": 319.85424657534253, "text": "headline value does not automatically\ntell us the amount of every"}, {"start": 319.85424657534253, "end": 320.72, "text": "resulting order."}]}, {"id": "long-046", "sentence": "Nor does a large criminal penalty tell us how an agricultural business has absorbed a loss across its producers, inventory and future sales.", "captionGroups": ["Nor does a large criminal penalty tell us how an agricultural business has", "absorbed a loss across its producers, inventory and future sales."], "route": "A", "start": 320.72, "end": 329.22, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "35.0% 46.0%", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "master": "assets/883afe4b67003fc87899.png", "spokenStart": 320.72, "spokenEnd": 328.62, "cues": [{"start": 320.72, "end": 325.0005755395684, "text": "Nor does a large criminal penalty\ntell us how an agricultural business"}, {"start": 325.0005755395684, "end": 329.22, "text": "has absorbed a loss across its\nproducers, inventory and future sales."}]}, {"id": "long-047", "sentence": "For the reserve, the original purpose remained easy to understand: preserve a harvest so it could help supply a later market.", "captionGroups": ["For the reserve, the original purpose remained easy to understand: preserve", "a harvest so it could help supply a later market."], "route": "A", "start": 329.22, "end": 336.5, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "78.0% 40.0%", "motion": {"cameraStart": 1.12, "cameraEnd": 1.1984}, "master": "assets/f49aad2c2c55780cfb2e.
