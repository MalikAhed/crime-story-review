 "cameraEnd": 1.0812}, "master": "assets/b5b8a0c8912a6298422d.png", "captionGroups": ["The objects could return to a laboratory while the knowledge recorded", "around them remained lost, leaving a very", "different ending from a simple recovery story."], "spokenStart": 9.12, "spokenEnd": 17.08, "cues": [{"start": 9.12, "end": 12.888461538461538, "text": "The objects could return to a\nlaboratory while the knowledge recorded"}, {"start": 12.888461538461538, "end": 16.82076923076923, "text": "around them remained lost, leaving a\nvery different ending from a simple"}, {"start": 16.82076923076923, "end": 17.64, "text": "recovery story."}]}, {"id": "long-003", "sentence": "In July two thousand two, lunar material was stolen from Everett Gibson's laboratory at NASA's Johnson Space Center in Houston, along with other research material.", "route": "A", "start": 17.64, "end": 26.16, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/052b83c5f4bfe2e21be1.png", "captionGroups": ["In July two thousand two, lunar material was stolen from Everett", "Gibson's laboratory at NASA's Johnson Space Center in Houston, along", "with other research material."], "spokenStart": 17.64, "spokenEnd": 26.16, "cues": [{"start": 17.64, "end": 21.026832298136647, "text": "In July two thousand two, lunar\nmaterial was stolen from Everett"}, {"start": 21.026832298136647, "end": 24.625341614906834, "text": "Gibson's laboratory at NASA's Johnson\nSpace Center in Houston, along"}, {"start": 24.625341614906834, "end": 26.16, "text": "with other research material."}]}, {"id": "long-004", "sentence": "The collection included material from Apollo missions, samples from Martian meteorites, and scientific records that belonged to the work being done with those objects.", "route": "A", "start": 26.16, "end": 35.78, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 55.00000000000001%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/b5b8a0c8912a6298422d.png", "captionGroups": ["The collection included material from Apollo missions, samples from", "Martian meteorites, and scientific records that belonged to the work", "being done with those objects."], "spokenStart": 26.16, "spokenEnd": 35.0, "cues": [{"start": 26.16, "end": 30.066303030303033, "text": "The collection included material\nfrom Apollo missions, samples from"}, {"start": 30.066303030303033, "end": 34.03090909090909, "text": "Martian meteorites, and scientific\nrecords that belonged to the work"}, {"start": 34.03090909090909, "end": 35.78, "text": "being done with those objects."}]}, {"id": "long-005", "sentence": "That combination matters because this case involved more than unusual rocks: it also involved the information a scientist needed to understand and continue his work.", "route": "A", "start": 35.78, "end": 45.52, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "70.0% 61.0%", "motion": {"cameraStart": 1.12, "cameraEnd": 1.1872}, "master": "assets/b5b8a0c8912a6298422d.png", "captionGroups": ["That combination matters because this case involved more than unusual", "rocks: it also involved the information a scientist needed to understand", "and continue his work."], "spokenStart": 35.78, "spokenEnd": 44.96, "cues": [{"start": 35.78, "end": 39.90306748466258, "text": "That combination matters because\nthis case involved more than unusual"}, {"start": 39.90306748466258, "end": 44.20539877300614, "text": "rocks: it also involved the information\na scientist needed to understand"}, {"start": 44.20539877300614, "end": 45.52, "text": "and continue his work."}]}, {"id": "long-006", "sentence": "A recovered specimen can be held up and shown to someone, but a missing observation or an uncertain history is harder to put back on display.", "route": "A", "start": 45.52, "end": 53.06, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "43.0% 62.0%", "motion": {"cameraStart": 1.2, "cameraEnd": 1.272}, "master": "assets/b5b8a0c8912a6298422d.png", "captionGroups": ["A recovered specimen can be held up and shown to someone, but a missing", "observation or an uncertain history is harder to put back on display."], "spokenStart": 45.52, "spokenEnd": 53.06, "cues": [{"start": 45.52, "end": 49.343857142857146, "text": "A recovered specimen can be held up\nand shown to someone, but a missing"}, {"start": 49.343857142857146, "end": 53.06, "text": "observation or an uncertain history\nis harder to put back on display."}]}, {"id": "long-007", "sentence": "Three NASA interns became defendants in the case: Thad Roberts, Tiffany Fowler and Shae Saur, while Gordon McWhorter was a separate associate, not another intern.", "route": "B", "start": 53.06, "end": 63.68, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5, "scaleStart": 1, "scaleEnd": 1.005}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "captionGroups": ["Three NASA interns became defendants in the case: Thad Roberts, Tiffany", "Fowler and Shae Saur, while Gordon McWhorter", "was a separate associate, not another intern."], "spokenStart": 53.06, "spokenEnd": 62.96, "cues": [{"start": 53.06, "end": 57.772625000000005, "text": "Three NASA interns became defendants\nin the case: Thad Roberts, Tiffany"}, {"start": 57.772625000000005, "end": 62.41887500000001, "text": "Fowler and Shae Saur, while Gordon\nMcWhorter was a separate associate,"}, {"start": 62.41887500000001, "end": 63.68, "text": "not another intern."}]}, {"id": "long-008", "sentence": "NASA's inspector general places the theft on July thirteenth, two thousand two, a date that fixes the loss of the collection within that summer.", "route": "A", "start": 63.68, "end": 71.82, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "79.0% 50.0%", "motion": {"cameraStart": 1.36, "cameraEnd": 1.4416}, "master": "assets/052b83c5f4bfe2e21be1.png", "captionGroups": ["NASA's inspector general places the theft on July thirteenth, two", "thousand two, a date that fixes the loss", "of the collection within that summer."], "spokenStart": 63.68, "spokenEnd": 71.24, "cues": [{"start": 63.68, "end": 67.40605633802816, "text": "NASA's inspector general places\nthe theft on July thirteenth, two"}, {"start": 67.40605633802816, "end": 71.41873239436619, "text": "thousand two, a date that fixes the\nloss of the collection within that"}, {"start": 71.41873239436619, "end": 71.82, "text": "summer."}]}, {"id": "long-009", "sentence": "The four defendants would not all take the same path through court, and their different outcomes are important to understanding how the case was resolved.", "route": "A", "start": 71.82, "end": 79.16, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "36.0% 60.0%", "motion": {"cameraStart": 1.05, "cameraEnd": 1.113}, "master": "assets/0f161fd , but it could answer only part of what had happened to the collection and its research.", "route": "B", "start": 106.04, "end": 113.62, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5, "scaleStart": 1, "scaleEnd": 1.005}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "captionGroups": ["The recovery gave the case an apparent point of resolution, but it could", "answer only part of what had happened", "to the collection and its research."], "spokenStart": 106.04, "spokenEnd": 112.94, "cues": [{"start": 106.04, "end": 109.83000000000001, "text": "The recovery gave the case an apparent\npoint of resolution, but it could"}, {"start": 109.83000000000001, "end": 113.14625000000001, "text": "answer only part of what had\nhappened to the collection and its"}, {"start": 113.14625000000001, "end": 113.62, "text": "research."}]}, {"id": "long-014", "sentence": "In testimony later described by the appeals court, Gibson said he believed the lunar samples had been recovered, but missing notebooks kept him from being certain.", "route": "A", "start": 113.62, "end": 122.26, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "22.0% 52.0%", "motion": {"cameraStart": 1.08, "cameraEnd": 1.1448}, "master": "assets/497df0bd1ce1bd0fb8d5.png", "captionGroups": ["In testimony later described by the appeals court, Gibson said he", "believed the lunar samples had been recovered, but missing notebooks", "kept him from being certain."], "spokenStart": 113.62, "spokenEnd": 121.6, "cues": [{"start": 113.62, "end": 117.10819875776399, "text": "In testimony later described by\nthe appeals court, Gibson said he"}, {"start": 117.10819875776399, "end": 120.75739130434783, "text": "believed the lunar samples had been\nrecovered, but missing notebooks"}, {"start": 120.75739130434783, "end": 122.26, "text": "kept him from being certain."}]}, {"id": "long-015", "sentence": "The missing records affected even that basic question: whether the material now in hand accounted for the lunar collection that had been taken from him.", "route": "A", "start": 122.26, "end": 130.28, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "81.0% 68.0%", "motion": {"cameraStart": 1.23, "cameraEnd": 1.3038}, "master": "assets/497df0bd1ce1bd0fb8d5.png", "captionGroups": ["The missing records affected even that basic question: whether the", "material now in hand accounted for the lunar", "collection that had been taken from him."], "spokenStart": 122.26, "spokenEnd": 129.8, "cues": [{"start": 122.26, "end": 125.78880000000001, "text": "The missing records affected even\nthat basic question: whether the"}, {"start": 125.78880000000001, "end": 129.478, "text": "material now in hand accounted for\nthe lunar collection that had been"}, {"start": 129.478, "end": 130.28, "text": "taken from him."}]}, {"id": "long-016", "sentence": "His testimony also distinguished the Martian material from the lunar samples, explaining that some Martian samples had been recovered while others were still missing.", "route": "A", "start": 130.28, "end": 138.9, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 36.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/497df0bd1ce1bd0fb8d5.png", "captionGroups": ["His testimony also distinguished the Martian material from the lunar", "samples, explaining that some Martian samples had been recovered while", "others were still missing."], "spokenStart": 130.28, "spokenEnd": 138.26, "cues": [{"start": 130.28, "end": 133.8541463414634, "text": "His testimony also distinguished\nthe Martian material from the lunar"}, {"start": 133.8541463414634, "end": 137.53341463414634, "text": "samples, explaining that some Martian\nsamples had been recovered while"}, {"start": 137.53341463414634, "end": 138.9, "text": "others were still missing."}]}, {"id": "long-017", "sentence": "Gibson described mixed samples and damaged provenance, meaning the history that connected material to its research could no longer be relied on as before.", "route": "A", "start": 138.9, "end": 147.48, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "15.0% 61.0%", "motion": {"cameraStart": 1.3, "cameraEnd": 1.378}, "master": "assets/497df0bd1ce1bd0fb8d5.png", "captionGroups": ["Gibson described mixed samples and damaged provenance, meaning the", "history that connected material to its research could no longer be", "relied on as before."], "spokenStart": 138.9, "spokenEnd": 146.82, "cues": [{"start": 138.9, "end": 142.62552631578947, "text": "Gibson described mixed samples and\ndamaged provenance, meaning the"}, {"start": 142.62552631578947, "end": 146.35105263157894, "text": "history that connected material\nto its research could no longer be"}, {"start": 146.35105263157894, "end": 147.48, "text": "relied on as before."}]}, {"id": "long-018", "sentence": "For the scientific work, the question extended beyond whether an object was present to whether its identity and its history could still support an investigation.", "route": "A", "start": 147.48, "end": 157.2, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 57.99999999999999%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/b5b8a0c8912a6298422d.png", "captionGroups": ["For the scientific work, the question extended beyond whether an object", "was present to whether its identity and its", "history could still support an investigation."], "spokenStart": 147.48, "spokenEnd": 156.44, "cues": [{"start": 147.48, "end": 151.82037735849056, "text": "For the scientific work, the question\nextended beyond whether an object"}, {"start": 151.82037735849056, "end": 156.16075471698113, "text": "was present to whether its identity\nand its history could still support"}, {"start": 156.16075471698113, "end": 157.2, "text": "an investigation."}]}, {"id": "long-019", "sentence": "The court's account of Gibson's testimony included lost unpublished research and the effort required to reconstruct work after the theft had disrupted the collection.", "route": "A", "start": 157.2, "end": 167.22, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "51.0% 56.00000000000001%", "motion": {"cameraStart": 1.08, "cameraEnd": 1.1448}, "master": "assets/497df0bd1ce1bd0fb8d5.png", "captionGroups": ["The court's account of Gibson's testimony included lost unpublished", "research and the effort required to reconstruct work after the theft had", "disrupted the collection."], "spokenStart": 157.2, "spokenEnd": 166.56, "cues": [{"start": 157.2, "end": 161.29353658536584, "text": "The court's account of Gibson's\ntestimony included lost unpublished"}, {"start": 161.29353658536584, "end": 165.69256097560975, "text": "research and the effort required to\nreconstruct work after the theft had"}, {"start": 165.69256097560975, "end": 167.22, "text": "disrupted the collection."}]}, {"id": "long-020", "sentence": "In his own account preserved by NASA, Gibson emphasized the lost records, contamination and broken chain of custody, and rejected the description of the samples as trash.", "route": "B", "start": 167.22, "end": 177.04, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5, "scaleStart": 1, "scaleEnd": 1.005}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "captionGroups": ["In his own account preserved by NASA, Gibson emphasized the lost", "records, contamination and broken chain of custody, and rejected the", "description of the samples as trash."], "spokenStart": 167.22, "spokenEnd": 176.36, "cues": [{"start": 167.22, "end": 170.96095238095236, "text": "In his own account preserved by\nNASA, Gibson emphasized the lost"}, {"start": 170.96095238095236, "end": 174.93571428571425, "text": "records, contamination and broken\nchain of custody, and rejected the"}, {"start": 174.93571428571425, "end": 177.04, "text": "description of the samples as trash."}]}, {"id": "long-021", "sentence": "Those records were part of the scientific value of the collection, and returning physical material could not recreate the information that had disappeared with them.", "route": "A", "start": 177.04, "end": 186.18, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "65.0% 35.0%", "motion": {"cameraStart": 1.13, "cameraEnd": 1.1978}, "master": "assets/497df0bd1ce1bd0fb8d5.png", "captionGroups": ["Those records were part of the scientific value of the collection, and", "returning physical material could not recreate the information that had", "disappeared with them."], "spokenStart": 177.04, "spokenEnd": 185.74, "cues": [{"start": 177.04, "end": 180.96515337423313, "text": "Those records were part of the\nscientific value of the collection, and"}, {"start": 180.96515337423313, "end": 184.94638036809818, "text": "returning physical material could\nnot recreate the information that had"}, {"start": 184.94638036809818, "end": 186.18, "text": "disappeared with them."}]}, {"id": "long-022", "sentence": "Roberts pleaded guilty to conspiracy and transporting stolen property, and a separate case involving possession of stolen fossil property was brought into the sentencing proceeding.", "route": "A", "start": 186.18, "end": 195.32, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 48.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/e6e08fbbe73bfbc46476.png", "captionGroups": ["Roberts pleaded guilty to conspiracy and transporting stolen property,", "and a separate case involving possession of stolen fossil property was", "brought into the sentencing proceeding."], "spokenStart": 186.18, "spokenEnd": 194.7, "cues": [{"start": 186.18, "end": 189.75430167597764, "text": "Roberts pleaded guilty to conspiracy\nand transporting stolen property,"}, {"start": 189.75430167597764, "end": 193.32860335195528, "text": "and a separate case involving\npossession of stolen fossil property was"}, {"start": 193.32860335195528, "end": 195.32, "text": "brought into the\nsentencing proceeding."}]}, {"id": "long-023", "sentence": "Contemporary reporting says Fowler and Saur also pleaded guilty, and in August two thousand three each received three years of probation and one hundred eighty days of home detention.", "route": "A", "start": 195.32, "end": 205.48, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "57.99999999999999% 48.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/bcb7b12610b6eb44c376.png", "captionGroups": ["Contemporary reporting says Fowler and Saur also pleaded guilty, and in", "August two thousand three each received three years of probation and one", "hundred eighty days of home detention."], "spokenStart": 195.32, "spokenEnd": 204.76, "cues": [{"start": 195.32, "end": 199.30541436464088, "text": "Contemporary reporting says Fowler\nand Saur also pleaded guilty, and in"}, {"start": 199.30541436464088, "end": 203.34696132596684, "text": "August two thousand three each received\nthree years of probation and one"}, {"start": 203.34696132596684, "end": 205.48, "text": "hundred eighty days of home detention."}]}, {"id": "long-024", "sentence": "The same reporting describes one hundred fifty hours of community service for each, along with restitution, adding further conditions to those reported sentences.", "route": "A", "start": 205.48, "end": 214.26, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/483de9411bdc68c8dc7d.png", "captionGroups": ["The same reporting describes one hundred fifty hours of community", "service for each, along with restitution, adding further conditions to", "those reported sentences."], "spokenStart": 205.48, "spokenEnd": 213.36, "cues": [{"start": 205.48, "end": 209.046875, "text": "The same reporting describes one\nhundred fifty hours of community"}, {"start": 209.046875, "end": 212.888125, "text": "service for each, along with\nrestitution, adding further conditions to"}, {"start": 212.888125, "end": 214.26, "text": "those reported sentences."}]}, {"id": "long-025", "sentence": "McWhorter went to trial instead, and the Associated Press reported his conviction in June two thousand three and a seventy-month prison sentence that August.", "route": "A", "start": 214.26, "end": 222.3, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "56.99999999999999% 47.0%", "motion": {"cameraStart": 1.15, "cameraEnd": 1.219}, "master": "assets/e6e08fbbe73bfbc46476.png", "captionGroups": ["McWhorter went to trial instead, and the Associated Press reported his", "conviction in June two thousand three and a seventy-month prison", "sentence that August."], "spokenStart": 214.26, "spokenEnd": 221.72, "cues": [{"start": 214.26, "end": 217.8909677419355, "text": "McWhorter went to trial instead, and\nthe Associated Press reported his"}, {"start": 217.8909677419355, "end": 221.21070967741937, "text": "conviction in June two thousand\nthree and a seventy-month prison"}, {"start": 221.21070967741937, "end": 222.3, "text": "sentence that August."}]}, {"id": "long-026", "sentence": "The report also said McWhorter maintained his innocence, a distinction worth preserving alongside the trial conviction rather than describing his case as another guilty plea.", "route": "B", "start": 222.3, "end": 231.8, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5, "scaleStart": 1, "scaleEnd": 1.005}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "captionGroups": ["The report also said McWhorter maintained his innocence, a distinction", "worth preserving alongside the trial conviction rather than describing", "his case as another guilty plea."], "spokenStart": 222.3, "spokenEnd": 231.28, "cues": [{"start": 222.3, "end": 226.16627906976746, "text": "The report also said McWhorter\nmaintained his innocence, a distinction"}, {"start": 226.16627906976746, "end": 230.0325581395349, "text": "worth preserving alongside the trial\nconviction rather than describing"}, {"start": 230.0325581395349, "end": 231.8, "text": "his case as another guilty plea."}]}, {"id": "long-027", "sentence": "The resulting picture was three interns who pleaded guilty and a separate associate convicted at trial, with different sentences rather than a single shared outcome.", "route": "A", "start": 231.8, "end": 240.24, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "53.0% 40.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/e6e08fbbe73bfbc46476.png", "captionGroups": ["The resulting picture was three interns who pleaded guilty and a", "separate associate convicted at trial, with different sentences rather", "than a single shared outcome."], "spokenStart": 231.8, "spokenEnd": 239.72, "cues": [{"start": 231.8, "end": 235.11386503067484, "text": "The resulting picture was three\ninterns who pleaded guilty and a"}, {"start": 235.11386503067484, "end": 238.73840490797545, "text": "separate associate convicted at\ntrial, with different sentences rather"}, {"start": 238.73840490797545, "end": 240.24, "text": "than a single shared outcome."}]}, {"id": "long-028", "sentence": "Roberts originally received a sentence totaling one hundred months, but that was not the final sentence recorded in the subsequent appeal of his case.", "route": "A", "start": 240.24, "end": 248.7, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "20.0% 80.0%", "motion": {"cameraStart": 1.3, "cameraEnd": 1.378}, "master": "assets/e6e08fbbe73bfbc46476.png", "captionGroups": ["Roberts originally received a sentence totaling one hundred months, but", "that was not the final sentence recorded", "in the subsequent appeal of his case."], "spokenStart": 240.24, "spokenEnd": 248.08, "cues": [{"start": 240.24, "end": 244.2985135135135, "text": "Roberts originally received a sentence\ntotaling one hundred months, but"}, {"start": 244.2985135135135, "end": 248.4141891891892, "text": "that was not the final sentence\nrecorded in the subsequent appeal of his"}, {"start": 248.4141891891892, "end": 248.7, "text": "case."}]}, {"id": "long-029", "sentence": "The original appeal found the record insufficient to support the sentencing court's finding of significant disruption to the government function involved in the case.", "route": "A", "start": 248.7, "end": 257.54, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "56.99999999999999% 37.0%", "motion": {"cameraStart": 1.3, "cameraEnd": 1.378}, "master": "assets/e6e08fbbe73bfbc46476.png", "captionGroups": ["The original appeal found the record insufficient to support the", "sentencing court's finding of significant disruption to the government", "function involved in the case."], "spokenStart": 248.7, "spokenEnd": 256.94, "cues": [{"start": 248.7, "end": 252.14975609756098, "text": "The original appeal found the\nrecord insufficient to support the"}, {"start": 252.14975609756098, "end": 255.9229268292683, "text": "sentencing court's finding of\nsignificant disruption to the government"}, {"start": 255.9229268292683, "end": 257.54, "text": "function involved in the case."}]}, {"id": "long-030", "sentence": "That was a question about the basis for the punishment, rather than a ruling that the theft had caused no harm or that Roberts was innocent.", "route": "B", "start": 257.54, "end": 264.66, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5, "scaleStart": 1, "scaleEnd": 1.005}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "captionGroups": ["That was a question about the basis for the punishment, rather than a", "ruling that the theft had caused no harm or that Roberts was innocent."], "spokenStart": 257.54, "spokenEnd": 263.92, "cues": [{"start": 257.54, "end": 261.0743884892087, "text": "That was a question about the basis\nfor the punishment, rather than a"}, {"start": 261.0743884892087, "end": 264.66, "text": "ruling that the theft had caused no\nharm or that Roberts was innocent."}]}, {"id": "long-031", "sentence": "At resentencing, the record addressed the damage to scientific work, including Gibson's account of missing records, impaired research and the disruption that followed the theft.", "route": "A", "start": 264.66, "end": 275.64, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/497df0bd1ce1bd0fb8d5.png", "captionGroups": ["At resentencing, the record addressed the damage to scientific work,", "including Gibson's account of missing records, impaired research and the", "disruption that followed the theft."], "spokenStart": 264.66, "spokenEnd": 275.0, "cues": [{"start": 264.66, "end": 268.9265142857143, "text": "At resentencing, the record addressed\nthe damage to scientific work,"}, {"start": 268.9265142857143, "end": 273.444, "text": "including Gibson's account of missing\nrecords, impaired research and the"}, {"start": 273.444, "end": 275.64, "text": "disruption that followed the theft."}]}, {"id": "long-032", "sentence": "The later appeals decision described research and funding losses and upheld the finding that the theft had significantly disrupted the government's work.", "route": "A", "start": 275.64, "end": 283.9, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "45.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/b5b8a0c8912a6298422d.png", "captionGroups": ["The later appeals decision described research and funding losses and", "upheld the finding that the theft had", "significantly disrupted the government's work."], "spokenStart": 275.64, "spokenEnd": 283.46, "cues": [{"start": 275.64, "end": 279.35973509933774, "text": "The later appeals decision described\nresearch and funding losses and"}, {"start": 279.35973509933774, "end": 282.9153642384106, "text": "upheld the finding that the theft\nhad significantly disrupted the"}, {"start": 282.9153642384106, "end": 283.9, "text": "government's work."}]}, {"id": "long-033", "sentence": "On February eleventh, two thousand five, Roberts was resentenced to a total of ninety months, replacing the original one-hundred-month sentence with a shorter term.", "route": "A", "start": 283.9, "end": 294.0, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "45.0% 56.00000000000001%", "motion": {"cameraStart": 1.03, "cameraEnd": 1.0918}, "master": "assets/e6e08fbbe73bfbc46476.png", "captionGroups": ["On February eleventh, two thousand five, Roberts was resentenced to a", "total of ninety months, replacing the original one-hundred-month", "sentence with a shorter term."], "spokenStart": 283.9, "spokenEnd": 293.52, "cues": [{"start": 283.9, "end": 288.2018518518518, "text": "On February eleventh, two thousand\nfive, Roberts was resentenced to a"}, {"start": 288.2018518518518, "end": 292.19197530864193, "text": "total of ninety months, replacing\nthe original one-hundred-month"}, {"start": 292.19197530864193, "end": 294.0, "text": "sentence with a shorter term."}]}, {"id": "long-034", "sentence": "The other terms ran concurrently, including forty-six months for the separate possession count, so those months were not added on top of the ninety.", "route": "A", "start": 294.0, "end": 301.9, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 68.0%", "motion": {"cameraStart": 1.14, "cameraEnd": 1.2084}, "master": "assets/e6e08fbbe73bfbc46476.png", "captionGroups": ["The other terms ran concurrently, including forty-six months for the", "separate possession count, so those months", "were not added on top of the ninety."], "spokenStart": 294.0, "spokenEnd": 301.28, "cues": [{"start": 294.0, "end": 297.6794520547945, "text": "The other terms ran concurrently,\nincluding forty-six months for the"}, {"start": 297.6794520547945, "end": 301.5212328767123, "text": "separate possession count, so those\nmonths were not added on top of the"}, {"start": 301.5212328767123, "end": 301.9, "text": "ninety."}]}, {"id": "long-035", "sentence": "The appeals court affirmed that sentence in November two thousand five, giving the case a documented legal endpoint without establishing how much time Roberts actually served.", "route": "A", "start": 301.9, "end": 310.84, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [16
