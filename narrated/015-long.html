</script><script>const P={"title": "The Fortune in the File", "aspect": "16:9", "duration": 347.24, "shortsSafeZones": false, "holdFinalFrame": true, "shots": [{"id": "long-001", "sentence": "In early 2022, federal investigators decrypted a file and found the keys to more than three billion dollars in stolen bitcoin.", "route": "B", "start": 0, "end": 7.88, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 0.0, "spokenEnd": 7.16, "cues": [{"start": 0, "end": 4.53888, "text": "In early 2022, federal investigators\ndecrypted a file and found the keys"}, {"start": 4.53888, "end": 7.88, "text": "to more than three billion\ndollars in stolen bitcoin."}]}, {"id": "long-002", "sentence": "Most of those coins had remained in the same wallet since a theft more than five years earlier.", "route": "A", "start": 7.88, "end": 12.74, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/f858c51a7199e93e924e.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 7.88, "spokenEnd": 12.2, "cues": [{"start": 7.88, "end": 11.499148936170213, "text": "Most of those coins had remained in\nthe same wallet since a theft more"}, {"start": 11.499148936170213, "end": 12.74, "text": "than five years earlier."}]}, {"id": "long-003", "sentence": "Following money on a public ledger and taking lawful control of it were two very different problems.", "route": "A", "start": 12.74, "end": 18.64, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/f858c51a7199e93e924e.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 12.74, "spokenEnd": 17.94, "cues": [{"start": 12.74, "end": 16.97131313131313, "text": "Following money on a public ledger\nand taking lawful control of it were"}, {"start": 16.97131313131313, "end": 18.64, "text": "two very different problems."}]}, {"id": "long-004", "sentence": "The investigation would lead to a couple in New York, a massive seizure, and a separate fight over who should receive the recovered fortune.", "route": "B", "start": 18.64, "end": 25.46, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 18.64, "spokenEnd": 25.46, "cues": [{"start": 18.64, "end": 22.172661870503596, "text": "The investigation would lead to a\ncouple in New York, a massive seizure,"}, {"start": 22.172661870503596, "end": 25.46, "text": "and a separate fight over who should\nreceive the recovered fortune."}]}, {"id": "long-005", "sentence": "On August 2, 2016, the cryptocurrency exchange Bitfinex announced that it had discovered a security breach.", "route": "A", "start": 25.46, "end": 32.78, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/9b8812af112511822805.png", "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "spokenStart": 25.46, "spokenEnd": 32.3, "cues": [{"start": 25.46, "end": 30.293962264150945, "text": "On August 2, 2016, the cryptocurrency\nexchange Bitfinex announced that"}, {"start": 30.293962264150945, "end": 32.78, "text": "it had discovered a security breach."}]}, {"id": "long-006", "sentence": "Trading stopped, along with digital token deposits and withdrawals, while the company investigated what had happened.", "route": "A", "start": 32.78, "end": 38.72, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/9b8812af112511822805.png", "motion": {"cameraStart": 1.035, "cameraEnd": 1.07}, "spokenStart": 32.78, "spokenEnd": 38.26, "cues": [{"start": 32.78, "end": 36.21086206896552, "text": "Trading stopped, along with digital\ntoken deposits and withdrawals,"}, {"start": 36.21086206896552, "end": 38.72, "text": "while the company investigated\nwhat had happened."}]}, {"id": "long-007", "sentence": "Its announcement confirmed that some customers had lost bitcoin and that law enforcement had been notified.", "route": "A", "start": 38.72, "end": 44.34, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/af1e62198a04ef333bca.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 38.72, "spokenEnd": 43.6, "cues": [{"start": 38.72, "end": 42.53735849056604, "text": "Its announcement confirmed that some\ncustomers had lost bitcoin and that"}, {"start": 42.53735849056604, "end": 44.34, "text": "law enforcement had been notified."}]}, {"id": "long-008", "sentence": "The account later established in the criminal case identified the intruder as Ilya Lichtenstein.", "route": "B", "start": 44.34, "end": 49.52, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 44.34, "spokenEnd": 49.04, "cues": [{"start": 44.34, "end": 47.88421052631579, "text": "The account later established in\nthe criminal case identified the"}, {"start": 47.88421052631579, "end": 49.52, "text": "intruder as Ilya Lichtenstein."}]}, {"id": "long-009", "sentence": "He had transferred nearly one hundred twenty thousand bitcoin out of Bitfinex through more than two thousand unauthorized transactions.", "route": "A", "start": 49.52, "end": 56.58, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/f858c51a7199e93e924e.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 49.52, "spokenEnd": 55.64, "cues": [{"start": 49.52, "end": 53.10268656716418, "text": "He had transferred nearly one hundred\ntwenty thousand bitcoin out of"}, {"start": 53.10268656716418, "end": 56.58, "text": "Bitfinex through more than two\nthousand unauthorized transactions."}]}, {"id": "long-010", "sentence": "At the time, the stolen coins were worth approximately seventy-one million dollars.", "route": "A", "start": 56.58, "end": 61.26, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/af1e62198a04ef333bca.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 56.58, "spokenEnd": 60.42, "cues": [{"start": 56.58, "end": 60.34682926829268, "text": "At the time, the stolen coins were\nworth approximately seventy-one"}, {"start": 60.34682926829268, "end": 61.26, "text": "million dollars."}]}, {"id": "long-011", "sentence": "The much larger figures in later headlines reflected bitcoin's rising price, not billions of dollars disappearing at the original valuation.", "route": "B", "start": 61.26, "end": 69.64, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 61.26, "spokenEnd": 68.96, "cues": [{"start": 61.26, "end": 65.41985611510792, "text": "The much larger figures in later\nheadlines reflected bitcoin's rising"}, {"start": 65.41985611510792, "end": 69.64, "text": "price, not billions of dollars\ndisappearing at the original valuation."}]}, {"id": "long-012", "sentence": "Four days after announcing the breach, Bitfinex told customers it would spread the losses across all accounts and assets.", "route": "A", "start": 69.64, "end": 76.6, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/8aa53c1ba82e4dfb6a69.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 69.64, "spokenEnd": 75.86, "cues": [{"start": 69.64, "end": 73.758, "text": "Four days after announcing the breach,\nBitfinex told customers it would"}, {"start": 73.758, "end": 76.6, "text": "spread the losses across\nall accounts and assets."}]}, {"id": "long-013", "sentence": "Account values were reduced by about thirty-six percent, including accounts that had not themselves been hacked.", "route": "A", "start": 76.6, "end": 82.48, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/ddaf21a6f99f6eceb9bd.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 76.6, "spokenEnd": 81.98, "cues": [{"start": 76.6, "end": 80.09621621621622, "text": "Account values were reduced by\nabout thirty-six percent, including"}, {"start": 80.09621621621622, "end": 82.48, "text": "accounts that had not\nthemselves been hacked."}]}, {"id": "long-014", "sentence": "In place of those losses, the exchange issued digital tokens representing customers' claims.", "route": "B", "start": 82.48, "end": 87.5, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 82.48, "spokenEnd": 86.84, "cues": [{"start": 82.48, "end": 85.78989010989011, "text": "In place of those losses, the\nexchange issued digital tokens"}, {"start": 85.78989010989011, "end": 87.5, "text": "representing customers' claims."}]}, {"id": "long-015", "sentence": "Customers later had options that included selling the tokens, redeeming them for cash, or exchanging them for shares in the exchange's parent company.", "route": "A", "start": 87.5, "end": 95.02, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/ddaf21a6f99f6eceb9bd.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 87.5, "spokenEnd": 94.4, "cues": [{"start": 87.5, "end": 91.10756756756757, "text": "Customers later had options that\nincluded selling the tokens, redeeming"}, {"start": 91.10756756756757, "end": 94.61351351351351, "text": "them for cash, or exchanging them\nfor shares in the exchange's parent"}, {"start": 94.61351351351351, "end": 95.02, "text": "company."}]}, {"id": "long-016", "sentence": "That response would matter years later, when recovering stolen coins raised difficult questions about the rights of the exchange and its customers.", "route": "B", "start": 95.02, "end": 103.08, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 95.02, "spokenEnd": 102.28, "cues": [{"start": 95.02, "end": 98.79986206896551, "text": "That response would matter years\nlater, when recovering stolen coins"}, {"start": 98.79986206896551, "end": 102.52413793103447, "text": "raised difficult questions about\nthe rights of the exchange and its"}, {"start": 102.52413793103447, "end": 103.08, "text": "customers."}]}, {"id": "long-017", "sentence": "Meanwhile, according to investigators' sworn account, a portion of the stolen bitcoin began moving out of the receiving wallet in early 2017.", "route": "B", "start": 103.08, "end": 110.7, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 103.08, "spokenEnd": 110.7, "cues": [{"start": 103.08, "end": 106.89, "text": "Meanwhile, according to investigators'\nsworn account, a portion of the"}, {"start": 106.89, "end": 110.7, "text": "stolen bitcoin began moving out of\nthe receiving wallet in early 2017."}]}, {"id": "long-018", "sentence": "The money passed through a complicated sequence of transactions that investigators said was intended to disguise its path.", "route": "A", "start": 110.7, "end": 117.68, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/f858c51a7199e93e924e.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 110.7, "spokenEnd": 117.08, "cues": [{"start": 110.7, "end": 114.62264462809918, "text": "The money passed through a complicated\nsequence of transactions that"}, {"start": 114.62264462809918, "end": 117.68, "text": "investigators said was\nintended to disguise its path."}]}, {"id": "long-019", "sentence": "But bitcoin transactions leave records on a public ledger, even when the people behind them are not immediately identified.", "route": "A", "start": 117.68, "end": 124.04, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/268bd73f3b61b070bf52.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 117.68, "spokenEnd": 123.64, "cues": [{"start": 117.68, "end": 121.43344262295082, "text": "But bitcoin transactions leave records\non a public ledger, even when the"}, {"start": 121.43344262295082, "end": 124.04, "text": "people behind them are not\nimmediately identified."}]}, {"id": "long-020", "sentence": "Investigators combined financial tracing with other evidence to connect funds to accounts controlled by Lichtenstein and Heather Morgan.", "route": "A", "start": 124.04, "end": 131.48, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/778e70dea5de205904f6.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 124.04, "spokenEnd": 130.78, "cues": [{"start": 124.04, "end": 127.95288888888889, "text": "Investigators combined financial\ntracing with other evidence to connect"}, {"start": 127.95288888888889, "end": 131.48, "text": "funds to accounts controlled by\nLichtenstein and Heather Morgan."}]}, {"id": "long-021", "sentence": "The Justice Department later described Lichtenstein as the hacker and Morgan as someone he enlisted to help launder the proceeds.", "route": "B", "start": 131.48, "end": 137.72, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 131.48, "spokenEnd": 137.72, "cues": [{"start": 131.48, "end": 134.84375, "text": "The Justice Department later described\nLichtenstein as the hacker and"}, {"start": 134.84375, "end": 137.72, "text": "Morgan as someone he enlisted\nto help launder the proceeds."}]}, {"id": "long-022", "sentence": "They shared responsibility for the laundering conspiracy, but their roles should not be collapsed into a story in which both carried out the original hack.", "route": "B", "start": 137.72, "end": 146.66, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 137.72, "spokenEnd": 146.1, "cues": [{"start": 137.72, "end": 141.6349019607843, "text": "They shared responsibility for the\nlaundering conspiracy, but their"}, {"start": 141.6349019607843, "end": 145.84196078431373, "text": "roles should not be collapsed into a\nstory in which both carried out the"}, {"start": 145.84196078431373, "end": 146.66, "text": "original hack."}]}, {"id": "long-023", "sentence": "Investigators from the IRS, the FBI, and Homeland Security worked on the case.", "route": "A", "start": 146.66, "end": 151.84, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/778e70dea5de205904f6.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 146.66, "spokenEnd": 151.3, "cues": [{"start": 146.66, "end": 151.50363636363636, "text": "Investigators from the IRS, the FBI,\nand Homeland Security worked on the"}, {"start": 151.50363636363636, "end": 151.84, "text": "case."}]}, {"id": "long-024", "sentence": "By early 2022, roughly twenty-five thousand of the stolen bitcoin had moved out of the original wallet.", "route": "A", "start": 151.84, "end": 158.42, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/f858c51a7199e93e924e.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 151.84, "spokenEnd": 157.84, "cues": [{"start": 151.84, "end": 156.29117647058823, "text": "By early 2022, roughly twenty-five\nthousand of the stolen bitcoin had"}, {"start": 156.29117647058823, "end": 158.42, "text": "moved out of the original wallet."}]}, {"id": "long-025", "sentence": "More than ninety-four thousand remained there.", "route": "A", "start": 158.42, "end": 160.96, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/f858c51a7199e93e924e.png", "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "spokenStart": 158.42, "spokenEnd": 160.48, "cues": [{"start": 158.42, "end": 160.96, "text": "More than ninety-four\nthousand remained there."}]}, {"id": "long-026", "sentence": "The theft had happened years before, but a huge part of its proceeds was still concentrated in one place.", "route": "A", "start": 160.96, "end": 166.34, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/f858c51a7199e93e924e.png", "motion": {"cameraStart": 1.035, "cameraEnd": 1.07}, "spokenStart": 160.96, "spokenEnd": 166.34, "cues": [{"start": 160.96, "end": 164.6846153846154, "text": "The theft had happened years before,\nbut a huge part of its proceeds was"}, {"start": 164.6846153846154, "end": 166.34, "text": "still concentrated in one place."}]}, {"id": "long-027", "sentence": "The crucial discovery came in material obtained from Lichtenstein's cloud storage account under a search warrant.", "route": "B", "start": 166.34, "end": 173.54, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 166.34, "spokenEnd": 172.92, "cues": [{"start": 166.34, "end": 170.64714285714285, "text": "The crucial discovery came in\nmaterial obtained from Lichtenstein's"}, {"start": 170.64714285714285, "end": 173.54, "text": "cloud storage account\nunder a search warrant."}]}, {"id": "long-028", "sentence": "An encrypted file contained cryptocurrency addresses and the private keys associated with them.", "route": "A", "start": 173.54, "end": 178.68, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/f858c51a7199e93e924e.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 173.54, "spokenEnd": 178.22, "cues": [{"start": 173.54, "end": 177.25829787234042, "text": "An encrypted file contained\ncryptocurrency addresses and the private"}, {"start": 177.25829787234042, "end": 178.68, "text": "keys associated with them."}]}, {"id": "long-029", "sentence": "Those keys provided control over the funds, rather than merely a view of their movement.", "route": "B", "start": 178.68, "end": 183.52, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 178.68, "spokenEnd": 182.84, "cues": [{"start": 178.68, "end": 182.68551724137933, "text": "Those keys provided control over the\nfunds, rather than merely a view of"}, {"start": 182.68551724137933, "end": 183.52, "text": "their movement."}]}, {"id": "long-030", "sentence": "The sworn affidavit says investigators decrypted the file on January 31, 2022.", "route": "A", "start": 183.52, "end": 188.96, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/778e70dea5de205904f6.png", "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "spokenStart": 183.52, "spokenEnd": 188.3, "cues": [{"start": 183.52, "end": 188.60675324675324, "text": "The sworn affidavit says investigators\ndecrypted the file on January 31,"}, {"start": 188.60675324675324, "end": 188.96, "text": "2022."}]}, {"id": "long-031", "sentence": "During that day and the next, authorities seized approximately ninety-four thousand six hundred bitcoin.", "route": "A", "start": 188.96, "end": 194.42, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/778e70dea5de205904f6.png", "motion": {"cameraStart": 1.035, "cameraEnd": 1.07}, "spokenStart": 188.96, "spokenEnd": 193.7, "cues": [{"start": 188.96, "end": 192.24660194174757, "text": "During that day and the next,\nauthorities seized approximately"}, {"start": 192.24660194174757, "end": 194.42, "text": "ninety-four thousand\nsix hundred bitcoin."}]}, {"id": "long-032", "sentence": "The recovered coins were worth about three point six billion dollars at the time of the seizure.", "route": "B", "start": 194.42, "end": 199.0, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 194.42, "spokenEnd": 198.34, "cues": [{"start": 194.42, "end": 197.84294736842105, "text": "The recovered coins were worth about\nthree point six billion dollars at"}, {"start": 197.84294736842105, "end": 199.0, "text": "the time of the seizure."}]}, {"id": "long-033", "sentence": "On February 8, the Justice Department announced the arrests of Lichtenstein and Morgan in Manhattan.", "route": "A", "start": 199.0, "end": 204.2, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/48ef644374a8f8f47c95.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 199.0, "spokenEnd": 203.52, "cues": [{"start": 199.0, "end": 202.25656565656564, "text": "On February 8, the Justice\nDepartment announced the arrests of"}, {"start": 202.25656565656564, "end": 204.2, "text": "Lichtenstein and Morgan in Manhattan."}]}, {"id": "long-034", "sentence": "It described the recovery as the largest financial seizure in the department's history up to that point.", "route": "B", "start": 204.2, "end": 209.18, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 204.2, "spokenEnd": 208.64, "cues": [{"start": 204.2, "end": 207.34271844660194, "text": "It described the recovery as the\nlargest financial seizure in the"}, {"start": 207.34271844660194, "end": 209.18, "text": "department's history up to that point."}]}, {"id": "long-035", "sentence": "The breakthrough combined a long financial investigation with evidence that allowed the government to secure the money.", "route": "A", "start": 209.18, "end": 215.02, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/778e70dea5de205904f6.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 209.18, "spokenEnd": 214.54, "cues": [{"start": 209.18, "end": 212.64440677966104, "text": "The breakthrough combined a long\nfinancial investigation with evidence"}, {"start": 212.64440677966104, "end": 215.02, "text": "that allowed the government\nto secure the money."}]}, {"id": "long-036", "sentence": "The case then moved from criminal allegations to guilty pleas.", "route": "B", "start": 215.02, "end": 218.8, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 215.02, "spokenEnd": 218.32, "cues": [{"start": 215.02, "end": 218.8, "text": "The case then moved from criminal\nallegations to guilty pleas."}]}, {"id": "long-037", "sentence": "On August 3, 2023, both defendants pleaded guilty to money laundering conspiracy.", "route": "A", "start": 218.8, "end": 224.22, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/97418d0c58eb724daf28.png", "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "spokenStart": 218.8, "spokenEnd": 223.26, "cues": [{"start": 218.8, "end": 223.47475, "text": "On August 3, 2023, both defendants\npleaded guilty to money laundering"}, {"start": 223.47475, "end": 224.22, "text": "conspiracy."}]}, {"id": "long-038", "sentence": "Morgan also pleaded guilty to a conspiracy to defraud the United States.", "route": "A", "start": 224.22, "end": 228.68, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/97418d0c58eb724daf28.png", "motion": {"cameraStart": 1.035, "cameraEnd": 1.07}, "spokenStart": 224.22, "spokenEnd": 228.08, "cues": [{"start": 224.22, "end": 228.68, "text": "Morgan also pleaded guilty to a\nconspiracy to defraud the United States."}]}, {"id": "long-039", "sentence": "Their convictions were for those conspiracy offenses, rather than separate convictions for the original hack or theft.", "route": "B", "start": 228.68, "end": 234.52, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 228.68, "spokenEnd": 233.94, "cues": [{"start": 228.68, "end": 231.92444444444445, "text": "Their convictions were for those\nconspiracy offenses, rather than"}, {"start": 231.92444444444445, "end": 234.52, "text": "separate convictions for\nthe original hack or theft."}]}, {"id": "long-040", "sentence": "In November 2024, Lichtenstein received a five-year prison sentence and three years of supervised release.", "route": "A", "start": 234.52, "end": 241.36, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/97418d0c58eb724daf28.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 234.52, "spokenEnd": 240.66, "cues": [{"start": 234.52, "end": 239.14514285714287, "text": "In November 2024, Lichtenstein received\na five-year prison sentence and"}, {"start": 239.14514285714287, "end": 241.36, "text": "three years of supervised release."}]}, {"id": "long-041", "sentence": "Morgan received an eighteen-month prison sentence four days later.", "route": "A", "start": 241.36, "end": 245.08, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/97418d0c58eb724daf28.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 241.36, "spokenEnd": 244.94, "cues": [{"start": 241.36, "end": 245.08, "text": "Morgan received an eighteen-month\nprison sentence four days later."}]}, {"id": "long-042", "sentence": "Lichtenstein's sentence included credit for the time he had already spent in custody since his 2022 arrest.", "route": "B", "start": 245.08, "end": 251.48, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 245.08, "spokenEnd": 250.84, "cues": [{"start": 245.08, "end": 249.12528301886792, "text": "Lichtenstein's sentence included\ncredit for the time he had already"}, {"start": 249.12528301886792, "end": 251.48, "text": "spent in custody\nsince his 2022 arrest."}]}, {"id": "long-043", "sentence": "At his sentencing, a prosecutor said he had begun cooperating after his arrest and helped with other cybercrime investigations.", "route": "A", "start": 251.48, "end": 258.52, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/97418d0c58eb724daf28.png", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 251.48, "spokenEnd": 257.56, "cues": [{"start": 251.48, "end": 255.44698412698412, "text": "At his sentencing, a prosecutor said\nhe had begun cooperating after his"}, {"start": 255.44698412698412, "end": 258.52, "text": "arrest and helped with other\ncybercrime investigations."}]}, {"id": "long-044", "sentence": "The convictions resolved criminal responsibility for the conspiracies, but did not automatically settle ownership of all the recovered assets.", "route": "B", "start": 258.52, "end": 265.64, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 258.52, "spokenEnd": 264.9, "cues": [{"start": 258.52, "end": 262.05475177304965, "text": "The convictions resolved criminal\nresponsibility for the conspiracies,"}, {"start": 262.05475177304965, "end": 265.64, "text": "but did not automatically settle\nownership of all the recovered assets."}]}, {"id": "long-045", "sentence": "Bitfinex and other claimants asserted competing rights to some of the same property.", "route": "A", "start": 265.64, "end": 269.5, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/8aa53c1ba82e4dfb6a69.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 265.64, "spokenEnd": 269.5, "cues": [{"start": 265.64, "end": 268.8489156626506, "text": "Bitfinex and other claimants asserted\ncompeting rights to some of the"}, {"start": 268.8489156626506, "end": 269.5, "text": "same property."}]}, {"id": "long-046", "sentence": "On April 4, 2025, the federal court declined to award restitution to Bitfinex in that proceeding.", "route": "A", "start": 269.5, "end": 276.9, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/97418d0c58eb724daf28.png", "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "spokenStart": 269.5, "spokenEnd": 276.14, "cues": [{"start": 269.5, "end": 274.7416666666667, "text": "On April 4, 2025, the federal court\ndeclined to award restitution to"}, {"start": 274.7416666666667, "end": 276.9, "text": "Bitfinex in that proceeding."}]}, {"id": "long-047", "sentence": "It directed the competing claims into a separate forfeiture process designed to determine who had the superior legal interest.", "route": "A", "start": 276.9, "end": 283.48, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/97418d0c58eb724daf28.png", "motion": {"cameraStart": 1.035, "cameraEnd": 1.07}, "spokenStart": 276.9, "spokenEnd": 282.78, "cues": [{"start": 276.9, "end": 280.42688, "text": "It directed the competing claims\ninto a separate forfeiture process"}, {"start": 280.42688, "end": 283.48, "text": "designed to determine who had\nthe superior legal interest."}]}, {"id": "long-048", "sentence": "That ruling did not erase the theft, and it did not establish that the customers had suffered no harm.", "route": "A", "start": 283.48, "end": 289.3, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/af1e62198a04ef333bca.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 283.48, "spokenEnd": 288.78, "cues": [{"start": 283.48, "end": 287.51366336633663, "text": "That ruling did not erase the theft,\nand it did not establish that the"}, {"start": 287.51366336633663, "end": 289.3, "text": "customers had suffered no harm."}]}, {"id": "long-049", "sentence": "It showed how recovering property, punishing offenders, and deciding who receives the property can become separate legal questions.", "route": "B", "start": 289.3, "end": 295.76, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 289.3, "spokenEnd": 295.76, "cues": [{"start": 289.3, "end": 292.8778461538462, "text": "It showed how recovering property,\npunishing offenders, and deciding who"}, {"start": 292.8778461538462, "end": 295.76, "text": "receives the property can\nbecome separate legal questions."}]}, {"id": "long-050", "sentence": "The April ruling cannot, by itself, tell us who ultimately received the assets.", "route": "B", "start": 295.76, "end": 300.84, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 295.76, "spokenEnd": 300.22, "cues": [{"start": 295.76, "end": 300.38410256410253, "text": "The April ruling cannot, by itself,\ntell us who ultimately received the"}, {"start": 300.38410256410253, "end": 300.84, "text": "assets."}]}, {"id": "long-051", "sentence": "One object from the investigation had already found a different destination: the Smithsonian's National Numismatic Collection.", "route": "A", "start": 300.84, "end": 307.88, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/cb3785cd6f3524f004e9.png", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 300.84, "spokenEnd": 307.08, "cues": [{"start": 300.84, "end": 304.38815999999997, "text": "One object from the investigation\nhad already found a different"}, {"start": 304.38815999999997, "end": 307.88, "text": "destination: the Smithsonian's\nNational Numismatic Collection."}]}, {"id": "long-052", "sentence": "It was the laptop used by IRS investigator Chris Janczewski in the case.", "route": "B", "start": 307.88, "end": 312.84, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 307.88, "spokenEnd": 312.22, "cues": [{"start": 307.88, "end": 312.84, "text": "It was the laptop used by IRS\ninvestigator Chris Janczewski in the case."}]}, {"id": "long-053", "sentence": "The museum acquired it from the Treasury Department to help tell the history of money in a digital age.", "route": "A", "start": 312.84, "end": 318.5, "focus": "50% 50%", "platePosition": "50% 50.0%", "label": "AI illustration · ASR-timed draft · boundary review pending", "master": "assets/cb3785cd6f3524f004e9.png", "motion": {"cameraStart": 1, "cameraEnd": 1.035}, "spokenStart": 312.84, "spokenEnd": 317.92, "cues": [{"start": 312.84, "end": 316.61333333333
