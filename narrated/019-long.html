18, 2015, the EPA issued a notice of violation covering specified Volkswagen and Audi cars with two-litre diesel engines.", "route": "A", "start": 108.58, "end": 118.06, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "67.0% 40.0%", "motion": {"cameraStart": 1.04, "cameraEnd": 1.11}, "master": "assets/0d1df0f64ba5025ecba5.png", "captionGroups": ["On September 18, 2015, the EPA issued a notice of violation covering", "specified Volkswagen and Audi cars with two-litre diesel engines."], "spokenStart": 108.58, "spokenEnd": 117.3, "cues": [{"start": 108.58, "end": 113.42691729323309, "text": "On September 18, 2015, the EPA\nissued a notice of violation covering"}, {"start": 113.42691729323309, "end": 118.06, "text": "specified Volkswagen and Audi cars\nwith two-litre diesel engines."}]}, {"id": "long-016", "sentence": "The agency described software that made emissions controls work differently during testing than during normal driving.", "route": "A", "start": 118.06, "end": 123.78, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "48.0% 49.0%", "motion": {"cameraStart": 1.06, "cameraEnd": 1.0}, "master": "assets/0059d0d249a3da709d00.png", "captionGroups": ["The agency described software that made emissions controls work", "differently during testing than during normal driving."], "spokenStart": 118.06, "spokenEnd": 123.22, "cues": [{"start": 118.06, "end": 121.14, "text": "The agency described software\nthat made emissions controls work"}, {"start": 121.14, "end": 123.78, "text": "differently during testing\nthan during normal driving."}]}, {"id": "long-017", "sentence": "For the affected vehicles described in that notice, nitrogen-oxide emissions could reach up to forty times the permitted level.", "route": "B", "start": 123.78, "end": 130.22, "sourceCrop": {"x": 0.0, "y": 0.8125, "width": 1670, "height": 939.375}, "sourceImageDimensions": [1670, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 17.004701606373168, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "captionGroups": ["For the affected vehicles described in that notice, nitrogen-oxide", "emissions could reach up to forty times the permitted level."], "spokenStart": 123.78, "spokenEnd": 130.22, "cues": [{"start": 123.78, "end": 127.15333333333334, "text": "For the affected vehicles described\nin that notice, nitrogen-oxide"}, {"start": 127.15333333333334, "end": 130.22, "text": "emissions could reach up to\nforty times the permitted level."}]}, {"id": "long-018", "sentence": "Nitrogen oxides contribute to harmful smog and soot, with consequences for respiratory and cardiovascular health, the government's settlement announcement explained.", "route": "A", "start": 130.22, "end": 140.72, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "51.0% 35.0%", "motion": {"cameraStart": 1.06, "cameraEnd": 1.0}, "master": "assets/0d1df0f64ba5025ecba5.png", "captionGroups": ["Nitrogen oxides contribute to harmful smog and soot, with consequences", "for respiratory and cardiovascular health, the government's settlement", "announcement explained."], "spokenStart": 130.22, "spokenEnd": 140.0, "cues": [{"start": 130.22, "end": 134.72920245398774, "text": "Nitrogen oxides contribute to harmful\nsmog and soot, with consequences"}, {"start": 134.72920245398774, "end": 139.23840490797548, "text": "for respiratory and cardiovascular\nhealth, the government's settlement"}, {"start": 139.23840490797548, "end": 140.72, "text": "announcement explained."}]}, {"id": "long-019", "sentence": "The people affected therefore included more than car owners, because pollution from a vehicle also enters the air shared by the surrounding community.", "route": "A", "start": 140.72, "end": 148.66, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "28.000000000000004% 70.0%", "motion": {"cameraStart": 1.06, "cameraEnd": 1.13}, "master": "assets/0d1df0f64ba5025ecba5.png", "captionGroups": ["The people affected therefore included more than car owners, because", "pollution from a vehicle also enters the air shared by the surrounding", "community."], "spokenStart": 140.72, "spokenEnd": 147.98, "cues": [{"start": 140.72, "end": 144.36810810810812, "text": "The people affected therefore\nincluded more than car owners, because"}, {"start": 144.36810810810812, "end": 148.12351351351353, "text": "pollution from a vehicle also enters\nthe air shared by the surrounding"}, {"start": 148.12351351351353, "end": 148.66, "text": "community."}]}, {"id": "long-020", "sentence": "A separate notice in November 2015 covered certain larger diesel engines, widening the case beyond the vehicles in the first announcement.", "route": "B", "start": 148.66, "end": 156.24, "sourceCrop": {"x": 0.0, "y": 0.8125, "width": 1670, "height": 939.375}, "sourceImageDimensions": [1670, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 17.004701606373168, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "captionGroups": ["A separate notice in November 2015 covered certain larger diesel", "engines, widening the case beyond the vehicles in the first", "announcement."], "spokenStart": 148.66, "spokenEnd": 155.26, "cues": [{"start": 148.66, "end": 152.2270588235294, "text": "A separate notice in November\n2015 covered certain larger diesel"}, {"start": 152.2270588235294, "end": 155.51544117647057, "text": "engines, widening the case\nbeyond the vehicles in the first"}, {"start": 155.51544117647057, "end": 156.24, "text": "announcement."}]}, {"id": "long-021", "sentence": "In March 2016, the Federal Trade Commission went to court seeking compensation for American consumers who had bought or leased affected cars.", "route": "A", "start": 156.24, "end": 163.62, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "68.0% 42.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "master": "assets/0d1df0f64ba5025ecba5.png", "captionGroups": ["In March 2016, the Federal Trade Commission went to court seeking", "compensation for American consumers who had bought or leased affected", "cars."], "spokenStart": 156.24, "spokenEnd": 162.98, "cues": [{"start": 156.24, "end": 159.69107913669066, "text": "In March 2016, the Federal Trade\nCommission went to court seeking"}, {"start": 159.69107913669066, "end": 163.35453237410073, "text": "compensation for American consumers\nwho had bought or leased affected"}, {"start": 163.35453237410073, "end": 163.62, "text": "cars."}]}, {"id": "long-022", "sentence": "The investigation now had distinct questions to answer: what would happen to the cars, how would buyers be compensated, and how would environmental damage be addressed?", "route": "B", "start": 163.62, "end": 173.36, "sourceCrop": {"x": 0.0, "y": 0.8125, "width": 1670, "height": 939.375}, "sourceImageDimensions": [1670, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 17.004701606373168, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "captionGroups": ["The investigation now had distinct questions to answer: what would", "happen to the cars, how would buyers be compensated, and how would", "environmental damage be addressed?"], "spokenStart": 163.62, "spokenEnd": 172.54, "cues": [{"start": 163.62, "end": 167.49253012048194, "text": "The investigation now had distinct\nquestions to answer: what would"}, {"start": 167.49253012048194, "end": 171.36506024096389, "text": "happen to the cars, how would\nbuyers be compensated, and how would"}, {"start": 171.36506024096389, "end": 173.36, "text": "environmental damage be addressed?"}]}, {"id": "long-023", "sentence": "In June 2016, proposed settlements offered owners of affected two-litre vehicles a buyback and gave people leasing those vehicles a way to end their leases.", "route": "A", "start": 173.36, "end": 182.54, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "48.0% 60.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "master": "assets/0059d0d249a3da709d00.png", "captionGroups": ["In June 2016, proposed settlements offered owners of affected two-litre", "vehicles a buyback and gave people leasing those vehicles a way to end", "their leases."], "spokenStart": 173.36, "spokenEnd": 182.54, "cues": [{"start": 173.36, "end": 177.59233766233766, "text": "In June 2016, proposed settlements\noffered owners of affected two-litre"}, {"start": 177.59233766233766, "end": 181.7650649350649, "text": "vehicles a buyback and gave people\nleasing those vehicles a way to end"}, {"start": 181.7650649350649, "end": 182.54, "text": "their leases."}]}, {"id": "long-024", "sentence": "An approved emissions modification could provide another option, allowing people to keep their cars and receive compensation.", "route": "A", "start": 182.54, "end": 189.5, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "75.0% 53.0%", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "master": "assets/0c83d1538f6efcd46745.png", "captionGroups": ["An approved emissions modification could provide another option,", "allowing people to keep their cars and receive compensation."], "spokenStart": 182.54, "spokenEnd": 188.66, "cues": [{"start": 182.54, "end": 186.13225806451612, "text": "An approved emissions modification\ncould provide another option,"}, {"start": 186.13225806451612, "end": 189.5, "text": "allowing people to keep their\ncars and receive compensation."}]}, {"id": "long-025", "sentence": "These choices recognized that undoing a car purchase is a practical problem involving transport, ownership and money, not simply correcting a misleading advertisement.", "route": "A", "start": 189.5, "end": 198.94, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "57.99999999999999% 65.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "master": "assets/1c8393eae52e195aebbb.png", "captionGroups": ["These choices recognized that undoing a car purchase is a practical", "problem involving transport, ownership and money, not simply correcting", "a misleading advertisement."], "spokenStart": 189.5, "spokenEnd": 198.12, "cues": [{"start": 189.5, "end": 193.3332121212121, "text": "These choices recognized that\nundoing a car purchase is a practical"}, {"start": 193.3332121212121, "end": 197.39527272727273, "text": "problem involving transport, ownership\nand money, not simply correcting"}, {"start": 197.39527272727273, "end": 198.94, "text": "a misleading advertisement."}]}, {"id": "long-026", "sentence": "The first settlement took effect in October 2016, and another agreement addressing three-litre vehicles followed that December.", "route": "B", "start": 198.94, "end": 205.42, "sourceCrop": {"x": 0.0, "y": 0.8125, "width": 1670, "height": 939.375}, "sourceImageDimensions": [1670, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 17.004701606373168, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "captionGroups": ["The first settlement took effect in October 2016, and another agreement", "addressing three-litre vehicles followed that December."], "spokenStart": 198.94, "spokenEnd": 205.42, "cues": [{"start": 198.94, "end": 202.59142857142857, "text": "The first settlement took effect in\nOctober 2016, and another agreement"}, {"start": 202.59142857142857, "end": 205.42, "text": "addressing three-litre vehicles\nfollowed that December."}]}, {"id": "long-027", "sentence": "The criminal case continued separately, and on March 10, 2017, Volkswagen AG pleaded guilty in federal court in Detroit.", "route": "A", "start": 205.42, "end": 214.52, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 45.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "master": "assets/afa0c3d4f1fecad2f4af.png", "captionGroups": ["The criminal case continued separately, and on March 10, 2017,", "Volkswagen AG pleaded guilty in federal court in Detroit."], "spokenStart": 205.42, "spokenEnd": 213.9, "cues": [{"start": 205.42, "end": 210.16117647058823, "text": "The criminal case continued\nseparately, and on March 10, 2017,"}, {"start": 210.16117647058823, "end": 214.52, "text": "Volkswagen AG pleaded guilty\nin federal court in Detroit."}]}, {"id": "long-028", "sentence": "The company's plea covered three felony counts involving conspiracy, obstruction of justice and importing vehicles through false statements.", "route": "B", "start": 214.52, "end": 222.22, "sourceCrop": {"x": 0.0, "y": 0.8125, "width": 1670, "height": 939.375}, "sourceImageDimensions": [1670, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 17.004701606373168, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "captionGroups": ["The company's plea covered three felony counts involving conspiracy,", "obstruction of justice and importing vehicles through false statements."], "spokenStart": 214.52, "spokenEnd": 221.48, "cues": [{"start": 214.52, "end": 218.28690647482014, "text": "The company's plea covered three\nfelony counts involving conspiracy,"}, {"start": 218.28690647482014, "end": 222.22, "text": "obstruction of justice and importing\nvehicles through false statements."}]}, {"id": "long-029", "sentence": "The Justice Department said the admitted conduct included misleading regulators and customers, concealing the cheating, and destroying documents connected with the scheme.", "route": "A", "start": 222.22, "end": 231.0, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "45.0% 55.00000000000001%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "master": "assets/fd8b24ca3f33c9cac702.png", "captionGroups": ["The Justice Department said the admitted conduct included misleading", "regulators and customers, concealing the cheating, and destroying", "documents connected with the scheme."], "spokenStart": 222.22, "spokenEnd": 230.46, "cues": [{"start": 222.22, "end": 225.75278106508875, "text": "The Justice Department said the\nadmitted conduct included misleading"}, {"start": 225.75278106508875, "end": 229.12970414201183, "text": "regulators and customers, concealing\nthe cheating, and destroying"}, {"start": 229.12970414201183, "end": 231.0, "text": "documents connected with the scheme."}]}, {"id": "long-030", "sentence": "This was an admission by the company, and it should not be confused with the separate legal position of any individual employee or executive.", "route": "B", "start": 231.0, "end": 238.72, "sourceCrop": {"x": 0.0, "y": 0.8125, "width": 1670, "height": 939.375}, "sourceImageDimensions": [1670, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 17.004701606373168, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "captionGroups": ["This was an admission by the company, and it should not be confused with", "the separate legal position of any individual employee or executive."], "spokenStart": 231.0, "spokenEnd": 238.02, "cues": [{"start": 231.0, "end": 234.97028571428572, "text": "This was an admission by the company,\nand it should not be confused with"}, {"start": 234.97028571428572, "end": 238.72, "text": "the separate legal position of any\nindividual employee or executive."}]}, {"id": "long-031", "sentence": "On April 21, 2017, the court sentenced Volkswagen and accepted an agreement requiring a criminal penalty of two point eight billion dollars.", "route": "A", "start": 238.72, "end": 246.84, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "68.0% 40.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "master": "assets/0d1df0f64ba5025ecba5.png", "captionGroups": ["On April 21, 2017, the court sentenced Volkswagen and accepted an", "agreement requiring a criminal penalty of two point eight billion", "dollars."], "spokenStart": 238.72, "spokenEnd": 246.1, "cues": [{"start": 238.72, "end": 242.54463768115943, "text": "On April 21, 2017, the court\nsentenced Volkswagen and accepted an"}, {"start": 242.54463768115943, "end": 246.36927536231886, "text": "agreement requiring a criminal\npenalty of two point eight billion"}, {"start": 246.36927536231886, "end": 246.84, "text": "dollars."}]}, {"id": "long-032", "sentence": "That penalty belonged to the criminal proceeding, while the consumer settlements addressed the people who had bought or leased the affected vehicles.", "route": "B", "start": 246.84, "end": 255.44, "sourceCrop": {"x": 0.0, "y": 0.8125, "width": 1670, "height": 939.375}, "sourceImageDimensions": [1670, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 17.004701606373168, "width": 56.79556652195644, "anchorX": 50.0, "anchorY": 94.45933869526363}, "captionGroups": ["That penalty belonged to the criminal proceeding, while the consumer", "settlements addressed the people who had bought or leased the affected", "vehicles."], "spokenStart": 246.84, "spokenEnd": 254.8, "cues": [{"start": 246.84, "end": 250.818231292517, "text": "That penalty belonged to the criminal\nproceeding, while the consumer"}, {"start": 250.818231292517, "end": 254.9134693877551, "text": "settlements addressed the people who\nhad bought or leased the affected"}, {"start": 254.9134693877551, "end": 255.44, "text": "vehicles."}]}, {"id": "long-033", "sentence": "A large figure in a court announcement still left another question: had compensation actually reached the people it was intended to help?", "route": "A", "start": 255.44, "end": 263.46, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "82.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "master": "assets/0059d0d249a3da709d00.png", "captionGroups": ["A large figure in a court announcement still left another question: had", "compensation actually reached the people it was intended to help?"], "spokenStart": 255.44, "spokenEnd": 262.86, "cues": [{"start": 255.44, "end": 259.6269117647059, "text": "A large figure in a court announcement\nstill left another question: had"}, {"start": 259.6269117647059, "end": 263.46, "text": "compensation actually reached the\npeople it was intended to help?"}]}, {"id": "long-034", "sentence": "By July 27, 2020, the Federal Trade Commission could report to the court that the defendants had repaid consumers more than nine point five billion dollars.", "route": "B", "start": 263.46, "end": 272.14, "sourceCrop": {"x": 0.0, "y": 0.8125, "width": 1670, "height": 939.375}, "sourceImageDimensions": [1670, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "os
