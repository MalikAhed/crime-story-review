 illustration · not authentic platform or private data", "master": "assets/twitter-014-familiar-account-viewer-master.png", "captionGroups": ["A familiar name on the screen", "was no longer enough to tell a viewer", "who was speaking."], "labelBacking": true, "captionPosition": {"left": 6, "bottom": 20, "width": 45}, "spokenStart": 57.24, "spokenEnd": 61.44, "cues": [{"start": 57.24, "end": 58.6085393258427, "text": "A familiar name\non the screen"}, {"start": 58.6085393258427, "end": 60.354606741573036, "text": "was no longer enough\nto tell a viewer"}, {"start": 60.354606741573036, "end": 61.56, "text": "who was speaking."}], "id": "scene-14"}, {"sentence": "Control had changed, even when the public identity looked familiar.", "start": 61.56, "end": 65.6, "route": "B", "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6, "cameraStart": 1, "cameraEnd": 1}, "label": "Modern narrator · historical case, illustrative visuals", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "captionGroups": ["Control had changed,", "even when the public identity", "looked familiar."], "labelBacking": true, "spokenStart": 61.56, "spokenEnd": 65.48, "cues": [{"start": 61.56, "end": 62.76213333333334, "text": "Control had changed,"}, {"start": 62.76213333333334, "end": 64.27786666666667, "text": "even when the public identity"}, {"start": 64.27786666666667, "end": 65.6, "text": "looked familiar."}], "id": "scene-15"}, {"sentence": "The fraudulent giveaway promised people more bitcoin in return for sending their own.", "start": 65.6, "end": 70.4, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.025}, "label": "Editorial illustration · not authentic platform or private data", "master": "assets/twitter-016-fraudulent-giveaway-master.png", "captionGroups": ["The fraudulent giveaway promised people", "more bitcoin in return", "for sending their own."], "labelBacking": true, "stageAnnotation": {"items": [{"text": "FRAUDULENT\nGIVEAWAY", "left": 10, "top": 30, "width": 35, "fontScene": 0.027, "backing": "#ffffffed"}]}, "spokenStart": 65.6, "spokenEnd": 70.28, "cues": [{"start": 65.6, "end": 67.74729411764706, "text": "The fraudulent giveaway\npromised people"}, {"start": 67.74729411764706, "end": 69.01364705882354, "text": "more bitcoin in return"}, {"start": 69.01364705882354, "end": 70.4, "text": "for sending their own."}], "id": "scene-16"}, {"sentence": "According to the regulator, the attackers stole approximately one hundred eighteen thousand dollars’ worth.", "start": 70.4, "end": 76.16, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.025}, "label": "Regulator estimate · aggregate incident loss, not individual household loss", "master": "assets/twitter-017-reported-losses-master.png", "captionGroups": ["According to the regulator,", "the attackers stole approximately", "one hundred eighteen thousand", "dollars’ worth."], "labelBacking": true, "stageAnnotation": {"items": [{"text": "APPROX. $118,000\nAGGREGATE INCIDENT LOSS", "left": 18, "top": 35, "width": 44, "fontScene": 0.025, "backing": "#ffffffed"}]}, "spokenStart": 70.4, "spokenEnd": 76.04, "cues": [{"start": 70.4, "end": 71.75964285714286, "text": "According to the regulator,"}, {"start": 71.75964285714286, "end": 73.42142857142858, "text": "the attackers stole approximately"}, {"start": 73.42142857142858, "end": 74.88178571428573, "text": "one hundred eighteen thousand"}, {"start": 74.88178571428573, "end": 76.16, "text": "dollars’ worth."}], "id": "scene-17"}, {"sentence": "The people sending money were not participating in a harmless internet joke.", "start": 76.16, "end": 80.36, "route": "B", "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6, "cameraStart": 1, "cameraEnd": 1}, "label": "Modern narrator · historical case, illustrative visuals", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "captionGroups": ["The people sending money", "were not participating", "in a harmless internet joke."], "labelBacking": true, "spokenStart": 76.16, "spokenEnd": 80.24, "cues": [{"start": 76.16, "end": 77.4656, "text": "The people sending money"}, {"start": 77.4656, "end": 78.71679999999999, "text": "were not participating"}, {"start": 78.71679999999999, "end": 80.36, "text": "in a harmless internet joke."}], "id": "scene-18"}, {"sentence": "They were losing money to criminals speaking through trusted accounts.", "start": 80.36, "end": 83.96, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.025}, "label": "Editorial illustration · not authentic platform or private data", "master": "assets/twitter-019-ordinary-victim-master.png", "captionGroups": ["They were losing money to criminals", "speaking through trusted accounts."], "labelBacking": true, "spokenStart": 80.36, "spokenEnd": 83.84, "cues": [{"start": 80.36, "end": 82.12521739130435, "text": "They were losing money to criminals"}, {"start": 82.12521739130435, "end": 83.96, "text": "speaking through trusted accounts."}], "id": "scene-19"}, {"sentence": "Twitter restricted many verified accounts while responding to the incident.", "start": 83.96, "end": 87.76, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.025}, "label": "Response restrictions · generic illustrative facility, not actual Twitter premises", "master": "assets/twitter-020-response-restrictions-master.png", "captionGroups": ["Twitter restricted many verified accounts", "while responding to the incident."], "labelBacking": true, "spokenStart": 83.96, "spokenEnd": 87.64, "cues": [{"start": 83.96, "end": 85.99891891891892, "text": "Twitter restricted\nmany verified accounts"}, {"start": 85.99891891891892, "end": 87.76, "text": "while responding to the incident."}], "id": "scene-20"}, {"sentence": "Legitimate users could not tweet while the restrictions were in place.", "start": 87.76, "end": 91.48, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.02}, "label": "Restrictions affected legitimate users · illustrative workplace", "master": "assets/twitter-021-tweeting-restrictions-master.png", "captionGroups": ["Legitimate users could not tweet", "while the restrictions were in place."], "labelBacking": true, "spokenStart": 87.76, "spokenEnd": 91.36, "cues": [{"start": 87.76, "end": 89.42956521739131, "text": "Legitimate users could not tweet"}, {"start": 89.42956521739131, "end": 91.48, "text": "while the restrictions were in place."}], "id": "scene-21"}, {"sentence": "The regulator’s report records that the National Weather Service could not tweet a tornado advisory.", "start": 91.48, "end": 96.88, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.02}, "label": "NYDFS account · National Weather Service could not tweet an advisory · no casualties claimed", "master": "assets/twitter-022-weather-advisory-blocked-master.png", "captionGroups": ["The regulator’s report records", "that the National Weather Service", "could not tweet a tornado advisory."], "labelBacking": true, "spokenStart": 91.48, "spokenEnd": 96.76, "cues": [{"start": 91.48, "end": 93.09632653061225, "text": "The regulator’s report records"}, {"start": 93.09632653061225, "end": 94.87428571428572, "text": "that the National Weather Service"}, {"start": 94.87428571428572, "end": 96.88, "text": "could not tweet a tornado advisory."}], "id": "scene-22"}, {"sentence": "The effects reached beyond the people whose accounts had been directly taken over.", "start": 96.88, "end": 100.88, "route": "B", "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "label": "Modern narrator · historical case, illustrative visuals", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "captionGroups": ["The effects reached beyond the people", "whose accounts had been directly taken over."], "labelBacking": true, "spokenStart": 96.88, "spokenEnd": 100.76, "cues": [{"start": 96.88, "end": 98.65234567901234, "text": "The effects reached beyond the people"}, {"start": 98.65234567901234, "end": 100.88, "text": "whose accounts had been\ndirectly taken over."}], "id": "scene-23"}, {"sentence": "One criminal case arising from the attack would center on Joseph James O’Connor, a British citizen.", "start": 100.88, "end": 106.08, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.02}, "label": "Generic courthouse · editorial illustration, not the actual venue", "master": "assets/twitter-024-one-participant-case-master.png", "captionGroups": ["One criminal case arising from the attack", "would center on Joseph James O’Connor,", "a British citizen."], "labelBacking": true, "spokenStart": 100.88, "spokenEnd": 105.96, "cues": [{"start": 100.88, "end": 102.92196078431373, "text": "One criminal case\narising from the attack"}, {"start": 102.92196078431373, "end": 104.81450980392157, "text": "would center on Joseph James O’Connor,"}, {"start": 104.81450980392157, "end": 106.08, "text": "a British citizen."}], "id": "scene-24"}, {"sentence": "His name does not mean he single-handedly carried out every part of the Twitter takeover.", "start": 106.08, "end": 111.12, "route": "B", "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "label": "Modern narrator · historical case, illustrative visuals", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "captionGroups": ["His name does not mean he single-handedly", "carried out every part", "of the Twitter takeover."], "labelBacking": true, "spokenStart": 106.08, "spokenEnd": 111.0, "cues": [{"start": 106.08, "end": 108.37227272727273, "text": "His name does not mean\nhe single-handedly"}, {"start": 108.37227272727273, "end": 109.65818181818182, "text": "carried out every part"}, {"start": 109.65818181818182, "end": 111.12, "text": "of the Twitter takeover."}], "id": "scene-25"}, {"sentence": "Prosecutors described a conspiracy with different participants.", "start": 111.12, "end": 114.64, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.02}, "label": "Conceptual grouping · empty chairs do not indicate an exact headcount", "master": "assets/twitter-026-different-participants-master.png", "captionGroups": ["Prosecutors described a conspiracy", "with different participants."], "labelBacking": true, "spokenStart": 111.12, "spokenEnd": 114.52, "cues": [{"start": 111.12, "end": 112.98451612903226, "text": "Prosecutors described a conspiracy"}, {"start": 112.98451612903226, "end": 114.64, "text": "with different participants."}], "id": "scene-26"}, {"sentence": "They said O’Connor discussed buying unauthorized access to accounts, including accounts associated with public figures.", "start": 114.64, "end": 121.2, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.02}, "label": "Prosecutors’ account · symbolic objects, not an authentic chat log", "master": "assets/twitter-027-prosecutor-access-account-master.png", "captionGroups": ["They said O’Connor discussed buying", "unauthorized access to accounts,", "including accounts associated", "with public figures."], "labelBacking": true, "spokenStart": 114.64, "spokenEnd": 121.08, "cues": [{"start": 114.64, "end": 116.53411764705882, "text": "They said O’Connor discussed buying"}, {"start": 116.53411764705882, "end": 118.26588235294118, "text": "unauthorized access to accounts,"}, {"start": 118.26588235294118, "end": 119.83529411764705, "text": "including accounts associated"}, {"start": 119.83529411764705, "end": 121.2, "text": "with public figures."}], "id": "scene-27"}, {"sentence": "Accounts he targeted were subsequently transferred away from their rightful owners.", "start": 121.2, "end": 125.52, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.02}, "label": "Illustrative account viewer · no actual platform UI or victim identity", "master": "assets/twitter-028-control-away-from-owner-master.png", "captionGroups": ["Accounts he targeted", "were subsequently transferred away", "from their rightful owners."], "labelBacking": true, "spokenStart": 121.2, "spokenEnd": 125.4, "cues": [{"start": 121.2, "end": 122.35000000000001, "text": "Accounts he targeted"}, {"start": 122.35000000000001, "end": 124.05000000000001, "text": "were subsequently transferred away"}, {"start": 124.05000000000001, "end": 125.52, "text": "from their rightful owners."}], "id": "scene-28"}, {"sentence": "The distinction matters because buying criminal access is a role in the crime, not proof that the buyer personally performed every intrusion.", "start": 125.52, "end": 133.84, "route": "B", "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "label": "Modern narrator · historical case, illustrative visuals", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "captionGroups": ["The distinction matters because", "buying criminal access is a role", "in the crime, not proof that the buyer", "personally performed every intrusion."], "labelBacking": true, "spokenStart": 125.52, "spokenEnd": 133.72, "cues": [{"start": 125.52, "end": 127.36202898550724, "text": "The distinction matters because"}, {"start": 127.36202898550724, "end": 129.26347826086956, "text": "buying criminal access is a role"}, {"start": 129.26347826086956, "end": 131.52144927536233, "text": "in the crime, not proof that the buyer"}, {"start": 131.52144927536233, "end": 133.84, "text": "personally performed every intrusion."}], "id": "scene-29"}, {"sentence": "His eventual case would also reach beyond Twitter.", "start": 133.84, "end": 136.68, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.02}, "label": "Editorial case review · props are not original evidence", "master": "assets/twitter-030-broader-case-scope-master.png", "captionGroups": ["His eventual case would also reach", "beyond Twitter."], "labelBacking": true, "spokenStart": 133.84, "spokenEnd": 136.56, "cues": [{"start": 133.84, "end": 135.46245614035087, "text": "His eventual case would also reach"}, {"start": 135.46245614035087, "end": 136.68, "text": "beyond Twitter."}], "id": "scene-30"}, {"sentence": "In July twenty twenty-one, Spanish police arrested O’Connor in Estepona at the request of the United States.", "start": 136.68, "end": 143.6, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.02}, "label": "Allegation stage · source attribution, not a separate finding", "master": "assets/twitter-031-estepona-arrest-context-master.png", "captionGroups": ["In July twenty twenty-one,", "Spanish police arrested O’Connor in Estepona", "at the request of the United States."], "labelBacking": true, "spokenStart": 136.68, "spokenEnd": 143.48, "cues": [{"start": 136.68, "end": 138.3479245283019, "text": "In July twenty twenty-one,"}, {"start": 138.3479245283019, "end": 141.17056603773585, "text": "Spanish police arrested\nO’Connor in Estepona"}, {"start": 141.17056603773585, "end": 143.6, "text": "at the request of the United States."}], "id": "scene-31"}, {"sentence": "The arrest was an allegation stage, not a conviction.", "start": 143.6, "end": 146.96, "route": "B", "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "label": "Modern narrator · historical case, illustrative visuals", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "captionGroups": ["The arrest was an allegation stage,", "not a conviction."], "labelBacking": true, "spokenStart": 143.6, "spokenEnd": 146.84, "cues": [{"start": 143.6, "end": 145.55517241379312, "text": "The arrest was an allegation stage,"}, {"start": 145.55517241379312, "end": 146.96, "text": "not a conviction."}], "id": "scene-32"}, {"sentence": "He was extradited from Spain in April twenty twenty-three.", "start": 146.96, "end": 150.28, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.02}, "label": "Editorial illustration · not actual people, premises or evidence", "master": "assets/twitter-033-extradition-context-master.png", "captionGroups": ["He was extradited from Spain", "in April twenty twenty-three."], "labelBacking": true, "spokenStart": 146.96, "spokenEnd": 150.16, "cues": [{"start": 146.96, "end": 148.53192982456142, "text": "He was extradited from Spain"}, {"start": 148.53192982456142, "end": 150.28, "text": "in April twenty twenty-three."}], "id": "scene-33"}, {"sentence": "The following month, he pleaded guilty in a New York federal court.", "start": 150.28, "end": 153.8, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.02}, "label": "Editorial illustration · not actual people, premises or evidence", "master": "assets/twitter-034-guilty-plea-court-master.png", "captionGroups": ["The following month, he pleaded guilty", "in a New York federal court."], "labelBacking": true, "spokenStart": 150.28, "spokenEnd": 153.68, "cues": [{"start": 150.28, "end": 152.23757575757577, "text": "The following month, he pleaded guilty"}, {"start": 152.23757575757577, "end": 153.8, "text": "in a New York federal court."}], "id": "scene-34"}, {"sentence": "The charges covered computer intrusions and other offenses across two sets of cases.", "start": 153.8, "end": 158.76, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.02}, "label": "Editorial illustration · not actual people, premises or evidence", "master": "assets/twitter-035-two-case-sets-master.png", "captionGroups": ["The charges covered computer intrusions", "and other offenses across two sets of cases."], "labelBacking": true, "spokenStart": 153.8, "spokenEnd": 158.64, "cues": [{"start": 153.8, "end": 156.0742168674699, "text": "The charges covered\ncomputer intrusions"}, {"start": 156.0742168674699, "end": 158.76, "text": "and other offenses\nacross two sets of cases."}], "id": "scene-35"}, {"sentence": "They included his part in the Twitter conspiracy, other account takeovers, and crimes involving threats and stalking.", "start": 158.76, "end": 165.4, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.02}, "label": "Illustrative human impact · no particular victim or counseling event", "master": "assets/twitter-036-human-harm-context-master.png", "captionGroups": ["They included his part", "in the Twitter conspiracy,", "other account takeovers,", "and crimes involving threats and stalking."], "labelBacking": true, "spokenStart": 158.76, "spokenEnd": 165.28, "cues": [{"start": 158.76, "end": 160.064, "text": "They included his part"}, {"start": 160.064, "end": 161.53808695652174, "text": "in the Twitter conspiracy,"}, {"start": 161.53808695652174, "end": 162.89878260869565, "text": "other account takeovers,"}, {"start": 162.89878260869565, "end": 165.4, "text": "and crimes involving\nthreats and stalking."}], "id": "scene-36"}, {"sentence": "Those victims were real people, not supporting characters in a hacker’s success story.", "start": 165.4, "end": 170.44, "route": "B", "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "label": "Modern narrator · historical case, illustrative visuals", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "captionGroups": ["Those victims were real people,", "not supporting characters", "in a hacker’s success story."], "labelBacking": true, "spokenStart": 165.4, "spokenEnd": 170.32, "cues": [{"start": 165.4, "end": 167.21571428571428, "text": "Those victims were real people,"}, {"start": 167.21571428571428, "end": 168.68, "text": "not supporting characters"}, {"start": 168.68, "end": 170.44, "text": "in a hacker’s success story."}], "id": "scene-37"}, {"sentence": "On June twenty-third, twenty twenty-three, the court sentenced O’Connor to five years in prison.", "start": 170.44, "end": 175.96, "route": "A", "motion": {"cameraStart": 1, "cameraEnd": 1.02}, "label": "Five-year sentence imposed in broader case · not time served or current status", "master": "assets/twitter-038-sentencing-courtroom-master.png", "captionGroups": ["On June twenty-third, twenty twenty-three,", "the court sentenced O’Connor", "to five years in prison."], "labelBacking": true, "spokenStart": 170.44, "spokenEnd": 175.84, "cues": [{"start": 170.44, "end": 172.85276595744682, "text": "On June twenty-third,\ntwenty twenty-three,"}, {"start": 172.85276595744682, "end": 174.4612765957447, "text": "the court sentenced O’Connor"}, {"start": 174.4612765957447, "end": 175.96, "text": "to five years in prison."}], "id": "scene-38"}, {"sentence": "That sentence covered the broader cybercrime cases, not just the bitcoin giveaway on Twitter.", "start": 175.96, "end": 181.36, "route": "B", "motion": {"oscillateDegrees": 0.85, "oscillatePeriodSeconds": 4.6}, "label": "Modern narrator · historical case, illustrative visuals", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground-openhand.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "captionGroups": ["That sentence covered", "the broader cybercrime cases,", "not just the bitcoin giveaway on Twitter."], "labelBacking": true, "spokenStart": 175.96, "spokenEnd": 181.24, "cues": [{"start": 175.96, "end": 177.26580645161292, "text": "That sentence covered"}, {"start": 177.26580645161292, "end": 178.91225806451615, "text": "the broader cybercrime cases,"}, {"start": 178.91225806451615, "end": 181.36, "text": "not just the bitcoin\ngive function prefetch(i){if(prefetchedIndex===i)return;prefetchedIndex=i;const keep=new Set([...sceneKeys(i),...sceneKeys(i+1),...sceneKeys(i+2)]);for(const name of [...sceneKeys(i+1),...sceneKeys(i+2)])loadImage(name,keep).catch(()=>{});trimCache(keep)}
function ensureScene(){const i=sceneIndex(),keys=sceneKeys(i);if(keys.every(k=>decodedAssets[k])){waitingIndex=-1;failedIndex=-1;loadUI.style.display='none';camera.style.visibility='visible';return true}if(waitingIndex===i||failedIndex===i)return false;const epoch=++loadEpoch;waitingIndex=i;++playEpoch;if(playing)wantPlay=true;playing=false;narration.pause();t=Math.min(P.duration,pendingSeek!==null?pendingSeek:(narration.currentTime||t));setAudioTime(t);cancelPending();loadingMessage('Loading this scene…');const keep=new Set(keys);Promise.all(keys.map(k=>loadImage(k,keep))).then(()=>{if(epoch!==loadEpoch)return;waitingIndex=-1;failedIndex=-1;loadUI.style.display='none';camera.style.visibility='visible';draw();prefetch(i);if(wantPlay)startAudio()}).catch(error=>{if(epoch!==loadEpoch)return;waitingIndex=-1;failedIndex=i;playing=false;loadingMessage(error.message,true);show()});return false}

function swapImage(old,name,id){const next=decodedAssets[name];if(!next)throw new Error('Asset not decoded: '+name);if(old!==next){next.id=id;old.removeAttribute('id');old.replaceWith(next)}return next}
let captionFitKey='';function fitCaption(){if(P.aspect!=='9:16')return;const c=el('caption'),key=c.textContent+'|'+stage.clientWidth;if(key===captionFitKey)return;captionFitKey=key;c.style.whiteSpace='pre';let size=Math.max(13,Math.min(29,stage.clientWidth*.052));c.style.fontSize=size+'px';while(c.scrollWidth>c.clientWidth+1&&size>8){size-=.5;c.style.fontSize=size+'px'}}
const narration=new Audio(P.audioData);narration.id='narration';narration.hidden=true;document.body.appendChild(narration);narration.preload='metadata';narration.addEventListener('loadedmetadata',applyPendingSeek);narration.onended=()=>{playing=false;wantPlay=false;t=P.duration;draw()};seek.max=P.duration;function show(){el('bar').classList.remove('hide');clearTimeout(hide);hide=setTimeout(()=>{if(playing&&document.activeElement!==seek)el('bar').classList.add('hide')},2000)}
function lastItem(items){return items&&items[items.length-1]}function lerp(a,b,p){return a+(b-a)*p}function draw(){if(!ready||!ensureScene())return;const s=P.shots.find(x=>t>=x.start&&t<x.end)||P.shots[P.shots.length-1],p=Math.max(0,Math.min(1,(t-s.start)/(s.end-s.start))),q=.8*p+.2*p*p*(3-2*p),m=s.motion||{},reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,r=reduced?0:q;
plate=swapImage(plate,s.route==='B'?s.plate:s.master,'plate');plate.style.objectFit=s.plateFit==='contain'?'contain':'cover';plate.style.objectPosition=s.platePosition||'50% 50%';plate.style.transform=s.plateScale?'scale('+s.plateScale+')':'none';plate.style.transformOrigin='50% 100%';camera.style.transformOrigin=s.focus||'50% 50%';camera.style.transform=`scale(${lerp(m.cameraStart||1,m.cameraEnd||1,r)})`;
if(s.route==='B'){actor.style.display='block';subject=swapImage(subject,s.foreground,'subject');const v=s.placement;actor.style.left=v.left+'%';actor.style.top=v.top+'%';actor.style.width=v.width+'%';actor.style.transformOrigin=v.anchorX+'% '+v.anchorY+'%';actor.style.transform=`translate(${(m.dxScene||0)*stage.clientWidth*r}px,${(m.dyScene||0)*stage.clientHeight*r}px) rotate(${m.oscillateDegrees?(reduced?0:m.oscillateDegrees*Math.sin(2*Math.PI*(t-s.start)/(m.oscillatePeriodSeconds||5))):lerp(m.rotateStart||0,m.rotateEnd||0,r)}deg) scale(${lerp(m.scaleStart||1,m.scaleEnd||1,r)})`;const z=s.annotation;annotation.textContent=lastItem(z?.frames?.filter(f=>p>=f.atProgress))?.text||z?.text||'';if(z){annotation.style.left=z.left+'%';annotation.style.top=z.top+'%';annotation.style.width=z.width+'%';annotation.style.fontSize=(z.fontScene*stage.clientWidth)+'px';annotation.style.color=z.color||'#402e1c';annotation.style.textShadow=z.shadow||'none';annotation.style.background=z.backing||'';annotation.style.padding=z.backing?'.3em .4em':''}
if(z?.items){annotation.replaceChildren();annotation.style.left='0';annotation.style.top='0';annotation.style.width='100%';for(const item of z.items){const span=document.createElement('span');span.textContent=item.text;Object.assign(span.style,{position:'absolute',left:item.left+'%',top:item.top+'%',width:item.width+'%',fontSize:(item.fontScene*stage.clientWidth)+'px'});annotation.appendChild(span)}annotation.style.height='100%'}else{annotation.style.height='auto'}
}else{actor.style.display='none';actor.style.transform='none';annotation.textContent=''}
const sa=el('stageAnnotation');sa.replaceChildren();for(const item of (s.stageAnnotation?.items||[])){const node=document.createElement('span');node.textContent=item.text;Object.assign(node.style,{position:'absolute',left:item.left+'%',top:item.top+'%',width:item.width+'%',fontSize:(item.fontScene*stage.clientWidth)+'px',color:item.color||'#172c3b',background:item.backing||'',padding:'.2em'});sa.appendChild(node)}el('gradient').style.background=s.lowerGradient?'linear-gradient(transparent 48%,#080b11e8 61%,#080b11 100%)':'';const cp=s.captionPosition;el('caption').style.left=cp?cp.left+'%':'';el('caption').style.bottom=cp?cp.bottom+'%':'';el('caption').style.width=cp?cp.width+'%':'';const cues=s.cues||[{start:s.start,end:s.end,text:s.sentence}];el('caption').textContent=(cues.find(c=>t>=c.start&&t<c.end)||((P.holdFinalFrame??P.completeLongForm)&&t>=P.duration?cues[cues.length-1]:{})).text||'';fitCaption();el('label').textContent=s.label||'Illustrated reconstruction · preparing narration';el('label').style.background=s.labelBacking?'#080b11cc':'';el('label').style.padding=s.labelBacking?'.35em .5em':'';el('audioHint').textContent=t>=P.duration?'Ended · Click to replay':playing?'Playing narration · Click to pause':'Paused · Click or Space to play narration';prefetch(sceneIndex());seek.value=t;el('end').style.display=t>=P.duration&&!(P.holdFinalFrame??P.completeLongForm)?'grid':'none'}
function jump(v){++loadEpoch;++playEpoch;waitingIndex=-1;failedIndex=-1;prefetchedIndex=-1;cancelPending();t=Math.max(0,Math.min(P.duration,v));setAudioTime(t);if(t>=P.duration){playing=false;wantPlay=false;narration.pause()}draw();if(wantPlay&&!playing&&waitingIndex===-1&&failedIndex===-1)startAudio();show()}function toggle(){if(t>=P.duration){jump(0)}wantPlay=!wantPlay;if(!wantPlay){++playEpoch;narration.pause();playing=false}else if(ensureScene())startAudio();show();draw()}

stage.onclick=e=>{if(!e.target.closest('#bar,#loading'))toggle()};seek.oninput=()=>jump(+seek.value);stage.onpointermove=show;window.onresize=draw;document.onkeydown=e=>{if(['Space','ArrowLeft','ArrowRight','Home','End'].includes(e.code))e.preventDefault();if(e.code==='Space')toggle();if(e.code==='ArrowLeft')jump(t-5);if(e.code==='ArrowRight')jump(t+5);if(e.code==='Home')jump(0);if(e.code==='End')jump(P.duration);if(e.code==='KeyF'){if(!document.fullscreenElement)stage.requestFullscreen?.();else document.exitFullscreen?.()}};
function frame(now){if(playing){t=Math.min(P.duration,narration.currentTime);if(t>=P.duration)playing=false;draw()}last=now;requestAnimationFrame(frame)}window.motionQA={seek:jump,state:()=>({time:t,playing,duration:P.duration,shot:P.shots.find(s=>t>=s.start&&t<s.end)?.id,subjectTransform:actor.style.transform,cameraTransform:camera.style.transform})};ready=true;playing=false;wantPlay=false;ensureScene();show();requestAnimationFrame(frame);
</script></html>
