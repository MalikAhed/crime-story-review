</script><script>const P={"title": "The Warning That Arrived Too Late", "aspect": "16:9", "duration": 359.96, "shortsSafeZones": false, "holdFinalFrame": true, "shots": [{"id": "long-001", "sentence": "The programmer who unleashed the Morris worm tried to send out a warning, but the network was already too congested for it to arrive in time.", "route": "A", "master": "assets/0c32c4efa2593fcbca8e.png", "start": 0.0, "end": 7.32, "focus": "50.0% 44.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 0.0, "spokenEnd": 7.2, "cues": [{"start": 0.0, "end": 3.3151079136690647, "text": "The programmer who unleashed the\nMorris worm tried to send out a"}, {"start": 3.3151079136690647, "end": 6.941007194244604, "text": "warning, but the network was already\ntoo congested for it to arrive in"}, {"start": 6.941007194244604, "end": 7.32, "text": "time."}]}, {"id": "long-002", "sentence": "His own program had helped block the route that might have carried instructions for stopping it.", "route": "A", "master": "assets/e4660f481e101d26db14.png", "start": 7.32, "end": 11.92, "focus": "52.0% 39.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 7.32, "spokenEnd": 11.8, "cues": [{"start": 7.32, "end": 10.432421052631579, "text": "His own program had helped block\nthe route that might have carried"}, {"start": 10.432421052631579, "end": 11.92, "text": "instructions for stopping it."}]}, {"id": "long-003", "sentence": "The case would lead to the first conviction under the 1986 Computer Fraud and Abuse Act.", "route": "A", "master": "assets/83cfb34875e38b7e6e1a.png", "start": 11.92, "end": 18.2, "focus": "65.0% 46.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 11.92, "spokenEnd": 18.08, "cues": [{"start": 11.92, "end": 16.66390804597701, "text": "The case would lead to the first\nconviction under the 1986 Computer"}, {"start": 16.66390804597701, "end": 18.2, "text": "Fraud and Abuse Act."}]}, {"id": "long-004", "sentence": "To understand the scale, go back to November 2, 1988, before the World Wide Web existed.", "route": "A", "master": "assets/2c168643d9d2ffad51b9.png", "start": 18.2, "end": 24.48, "focus": "50.0% 43.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 18.2, "spokenEnd": 24.36, "cues": [{"start": 18.2, "end": 23.15632183908046, "text": "To understand the scale, go back to\nNovember 2, 1988, before the World"}, {"start": 23.15632183908046, "end": 24.48, "text": "Wide Web existed."}]}, {"id": "long-005", "sentence": "The internet was already connecting universities, research centers, and government organizations, but it was far smaller than the network we know today.", "route": "A", "master": "assets/8b8254580c6e92c51186.png", "start": 24.48, "end": 32.76, "focus": "54.0% 53.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 24.48, "spokenEnd": 32.64, "cues": [{"start": 24.48, "end": 28.3424, "text": "The internet was already connecting\nuniversities, research centers, and"}, {"start": 28.3424, "end": 32.0416, "text": "government organizations, but it\nwas far smaller than the network we"}, {"start": 32.0416, "end": 32.76, "text": "know today."}]}, {"id": "long-006", "sentence": "One widely repeated estimate puts its population then at roughly sixty thousand connected computers.", "route": "A", "master": "assets/6952d9531aad2f563a53.png", "start": 32.76, "end": 38.68, "focus": "76.0% 43.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 32.76, "spokenEnd": 38.56, "cues": [{"start": 32.76, "end": 36.8610101010101, "text": "One widely repeated estimate puts\nits population then at roughly sixty"}, {"start": 36.8610101010101, "end": 38.68, "text": "thousand connected computers."}]}, {"id": "long-007", "sentence": "Within a day of the worm's release, an estimated six thousand had been hit.", "route": "A", "master": "assets/c9e94a06768724f564b0.png", "start": 38.68, "end": 43.08, "focus": "49.0% 41.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 38.68, "spokenEnd": 42.96, "cues": [{"start": 38.68, "end": 42.72864864864865, "text": "Within a day of the worm's release,\nan estimated six thousand had been"}, {"start": 42.72864864864865, "end": 43.08, "text": "hit."}]}, {"id": "long-008", "sentence": "Those numbers are estimates, and the disruption extended beyond the machines that were actually infected.", "route": "A", "master": "assets/0c32c4efa2593fcbca8e.png", "start": 43.08, "end": 48.48, "focus": "50.0% 44.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 43.08, "spokenEnd": 48.36, "cues": [{"start": 43.08, "end": 46.48153846153846, "text": "Those numbers are estimates, and\nthe disruption extended beyond the"}, {"start": 46.48153846153846, "end": 48.48, "text": "machines that were actually infected."}]}, {"id": "long-009", "sentence": "Other computers had to be checked and protected, pulling people away from the work those systems were supposed to support.", "route": "A", "master": "assets/003ee770d8e0221adacf.png", "start": 48.48, "end": 55.16, "focus": "56.00000000000001% 43.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 48.48, "spokenEnd": 55.04, "cues": [{"start": 48.48, "end": 52.16661157024793, "text": "Other computers had to be checked\nand protected, pulling people away"}, {"start": 52.16661157024793, "end": 55.16, "text": "from the work those systems\nwere supposed to support."}]}, {"id": "long-010", "sentence": "For a researcher, even an uninfected computer could become part of the emergency when normal work stopped for safety checks.", "route": "A", "master": "assets/98cab1a542d44188b373.png", "start": 55.16, "end": 62.0, "focus": "47.0% 45.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 55.16, "spokenEnd": 61.88, "cues": [{"start": 55.16, "end": 58.98439024390244, "text": "For a researcher, even an uninfected\ncomputer could become part of the"}, {"start": 58.98439024390244, "end": 62.0, "text": "emergency when normal work\nstopped for safety checks."}]}, {"id": "long-011", "sentence": "A worm is a program that can run independently and send working copies of itself to other computers.", "route": "A", "master": "assets/0c32c4efa2593fcbca8e.png", "start": 62.0, "end": 67.92, "focus": "50.0% 44.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 62.0, "spokenEnd": 67.8, "cues": [{"start": 62.0, "end": 66.1010101010101, "text": "A worm is a program that can run\nindependently and send working copies"}, {"start": 66.1010101010101, "end": 67.92, "text": "of itself to other computers."}]}, {"id": "long-012", "sentence": "This one attacked particular Unix systems, spreading through weaknesses in the software connecting them.", "route": "A", "master": "assets/e4660f481e101d26db14.png", "start": 67.92, "end": 73.16, "focus": "50.0% 46.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 67.92, "spokenEnd": 73.04, "cues": [{"start": 67.92, "end": 71.44932038834952, "text": "This one attacked particular Unix\nsystems, spreading through weaknesses"}, {"start": 71.44932038834952, "end": 73.16, "text": "in the software connecting them."}]}, {"id": "long-013", "sentence": "As copies accumulated, machines spent more and more of their resources running the intruder instead of doing useful work.", "route": "A", "master": "assets/6952d9531aad2f563a53.png", "start": 73.16, "end": 79.08, "focus": "34.0% 43.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 73.16, "spokenEnd": 78.96, "cues": [{"start": 73.16, "end": 76.54333333333332, "text": "As copies accumulated, machines spent\nmore and more of their resources"}, {"start": 76.54333333333332, "end": 79.08, "text": "running the intruder instead\nof doing useful work."}]}, {"id": "long-014", "sentence": "Some became unable to process anything else, and some failed altogether.", "route": "A", "master": "assets/c9e94a06768724f564b0.png", "start": 79.08, "end": 83.04, "focus": "38.0% 47.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 79.08, "spokenEnd": 82.92, "cues": [{"start": 79.08, "end": 83.04, "text": "Some became unable to process anything\nelse, and some failed altogether."}]}, {"id": "long-015", "sentence": "The FBI's historical account lists Harvard, Stanford, NASA, and the Lawrence Livermore National Laboratory among the affected institutions.", "route": "A", "master": "assets/4100585d9f4add0f6b61.png", "start": 83.04, "end": 91.08, "focus": "61.0% 52.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 83.04, "spokenEnd": 90.96, "cues": [{"start": 83.04, "end": 86.88521739130435, "text": "The FBI's historical account lists\nHarvard, Stanford, NASA, and the"}, {"start": 86.88521739130435, "end": 91.08, "text": "Lawrence Livermore National Laboratory\namong the affected institutions."}]}, {"id": "long-016", "sentence": "Messages were delayed, and some organizations disconnected their computers from the network.", "route": "A", "master": "assets/600a402e97da8e16eb2f.png", "start": 91.08, "end": 95.84, "focus": "60.0% 48.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 91.08, "spokenEnd": 95.72, "cues": [{"start": 91.08, "end": 94.3432967032967, "text": "Messages were delayed, and some\norganizations disconnected their"}, {"start": 94.3432967032967, "end": 95.84, "text": "computers from the network."}]}, {"id": "long-017", "sentence": "At first, responders also feared that something worse might be happening quietly inside the machines.", "route": "A", "master": "assets/003ee770d8e0221adacf.png", "start": 95.84, "end": 101.68, "focus": "55.00000000000001% 41.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 95.84, "spokenEnd": 101.56, "cues": [{"start": 95.84, "end": 99.9584, "text": "At first, responders also feared that\nsomething worse might be happening"}, {"start": 99.9584, "end": 101.68, "text": "quietly inside the machines."}]}, {"id": "long-018", "sentence": "Were files being changed or destroyed while everyone struggled with the slowdown?", "route": "A", "master": "assets/98cab1a542d44188b373.png", "start": 101.68, "end": 105.84, "focus": "47.0% 45.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 101.68, "spokenEnd": 105.72, "cues": [{"start": 101.68, "end": 105.2655, "text": "Were files being changed or destroyed\nwhile everyone struggled with the"}, {"start": 105.2655, "end": 105.84, "text": "slowdown?"}]}, {"id": "long-019", "sentence": "The Cornell inquiry later found that the worm had not modified or destroyed system or user files.", "route": "A", "master": "assets/0c32c4efa2593fcbca8e.png", "start": 105.84, "end": 111.4, "focus": "50.0% 44.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 105.84, "spokenEnd": 111.28, "cues": [{"start": 105.84, "end": 109.52333333333334, "text": "The Cornell inquiry later found\nthat the worm had not modified or"}, {"start": 109.52333333333334, "end": 111.4, "text": "destroyed system or user files."}]}, {"id": "long-020", "sentence": "But the interruption still consumed staff time and brought research to a halt.", "route": "A", "master": "assets/98cab1a542d44188b373.png", "start": 111.4, "end": 115.48, "focus": "47.0% 45.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 111.4, "spokenEnd": 115.36, "cues": [{"start": 111.4, "end": 115.10285714285715, "text": "But the interruption still consumed\nstaff time and brought research to a"}, {"start": 115.10285714285715, "end": 115.48, "text": "halt."}]}, {"id": "long-021", "sentence": "A machine can contain every file it had yesterday and still be useless to the person who needs it now.", "route": "A", "master": "assets/98cab1a542d44188b373.png", "start": 115.48, "end": 121.24, "focus": "53.0% 44.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 115.48, "spokenEnd": 121.12, "cues": [{"start": 115.48, "end": 119.38891089108911, "text": "A machine can contain every file it\nhad yesterday and still be useless"}, {"start": 119.38891089108911, "end": 121.24, "text": "to the person who needs it now."}]}, {"id": "long-022", "sentence": "The author was Robert Tappan Morris, a twenty-three-year-old graduate student at Cornell University.", "route": "A", "master": "assets/0c32c4efa2593fcbca8e.png", "start": 121.24, "end": 126.72, "focus": "50.0% 44.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 121.24, "spokenEnd": 126.6, "cues": [{"start": 121.24, "end": 124.97575757575757, "text": "The author was Robert Tappan Morris,\na twenty-three-year-old graduate"}, {"start": 124.97575757575757, "end": 126.72, "text": "student at Cornell University."}]}, {"id": "long-023", "sentence": "He had released the program through a computer at MIT.", "route": "A", "master": "assets/600a402e97da8e16eb2f.png", "start": 126.72, "end": 129.88, "focus": "48.0% 49.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 126.72, "spokenEnd": 129.76, "cues": [{"start": 126.72, "end": 129.88, "text": "He had released the program\nthrough a computer at MIT."}]}, {"id": "long-024", "sentence": "Cornell's investigation found no evidence that anyone else at the university had helped him or knew about the worm before its launch.", "route": "A", "master": "assets/5f783edba8d75e16da87.png", "start": 129.88, "end": 136.56, "focus": "55.00000000000001% 57.99999999999999%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 129.88, "spokenEnd": 136.44, "cues": [{"start": 129.88, "end": 133.11030303030302, "text": "Cornell's investigation found no\nevidence that anyone else at the"}, {"start": 133.11030303030302, "end": 136.56, "text": "university had helped him or knew\nabout the worm before its launch."}]}, {"id": "long-025", "sentence": "He intended the program to spread, but the uncontrolled multiplication was not the outcome he had anticipated.", "route": "A", "master": "assets/e4660f481e101d26db14.png", "start": 136.56, "end": 142.68, "focus": "51.0% 36.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 136.56, "spokenEnd": 142.56, "cues": [{"start": 136.56, "end": 140.41321100917432, "text": "He intended the program to spread,\nbut the uncontrolled multiplication"}, {"start": 140.41321100917432, "end": 142.68, "text": "was not the outcome\nhe had anticipated."}]}, {"id": "long-026", "sentence": "The court's account describes a program that was supposed to consume little processing time and avoid interrupting ordinary use.", "route": "A", "master": "assets/e4660f481e101d26db14.png", "start": 142.68, "end": 149.84, "focus": "50.0% 46.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 142.68, "spokenEnd": 149.72, "cues": [{"start": 142.68, "end": 146.44944881889765, "text": "The court's account describes a\nprogram that was supposed to consume"}, {"start": 146.44944881889765, "end": 149.84, "text": "little processing time and\navoid interrupting ordinary use."}]}, {"id": "long-027", "sentence": "Cornell's commission nevertheless concluded that he had disregarded consequences he should have foreseen.", "route": "A", "master": "assets/5f783edba8d75e16da87.png", "start": 149.84, "end": 155.68, "focus": "55.00000000000001% 57.99999999999999%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 149.84, "spokenEnd": 155.56, "cues": [{"start": 149.84, "end": 153.525, "text": "Cornell's commission nevertheless\nconcluded that he had disregarded"}, {"start": 153.525, "end": 155.68, "text": "consequences he should have foreseen."}]}, {"id": "long-028", "sentence": "The decision to release it and the scale of the resulting damage were separate questions.", "route": "A", "master": "assets/0c32c4efa2593fcbca8e.png", "start": 155.68, "end": 159.8, "focus": "50.0% 44.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 155.68, "spokenEnd": 159.68, "cues": [{"start": 155.68, "end": 158.81636363636363, "text": "The decision to release it and the\nscale of the resulting damage were"}, {"start": 158.81636363636363, "end": 159.8, "text": "separate questions."}]}, {"id": "long-029", "sentence": "That distinction would eventually become central to his appeal.", "route": "A", "master": "assets/b94d41dbe2a4e0b6cf25.png", "start": 159.8, "end": 163.16, "focus": "46.0% 44.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 159.8, "spokenEnd": 163.04, "cues": [{"start": 159.8, "end": 163.16, "text": "That distinction would eventually\nbecome central to his appeal."}]}, {"id": "long-030", "sentence": "After realizing how quickly the worm was spreading, Morris contacted a friend at Harvard.", "route": "A", "master": "assets/e4660f481e101d26db14.png", "start": 163.16, "end": 167.96, "focus": "54.0% 51.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 163.16, "spokenEnd": 167.84, "cues": [{"start": 163.16, "end": 166.88272727272727, "text": "After realizing how quickly the worm\nwas spreading, Morris contacted a"}, {"start": 166.88272727272727, "end": 167.96, "text": "friend at Harvard."}]}, {"id": "long-031", "sentence": "They sent an anonymous message with information intended to help administrators stop the infection.", "route": "A", "master": "assets/e4660f481e101d26db14.png", "start": 167.96, "end": 172.84, "focus": "52.0% 39.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 167.96, "spokenEnd": 172.72, "cues": [{"start": 167.96, "end": 171.06857142857143, "text": "They sent an anonymous message\nwith information intended to help"}, {"start": 171.06857142857143, "end": 172.84, "text": "administrators stop the infection."}]}, {"id": "long-032", "sentence": "According to the appeals court, congestion prevented that message from getting through until it was too late.", "route": "A", "master": "assets/e4660f481e101d26db14.png", "start": 172.84, "end": 178.2, "focus": "52.0% 39.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 172.84, "spokenEnd": 178.08, "cues": [{"start": 172.84, "end": 176.2362962962963, "text": "According to the appeals court,\ncongestion prevented that message from"}, {"start": 176.2362962962963, "end": 178.2, "text": "getting through until it was too late."}]}, {"id": "long-033", "sentence": "The Cornell commission also criticized the limited response, finding that Morris had not alerted anyone in a position of responsibility.", "route": "A", "master": "assets/5f783edba8d75e16da87.png", "start": 178.2, "end": 185.36, "focus": "55.00000000000001% 57.99999999999999%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 178.2, "spokenEnd": 185.24, "cues": [{"start": 178.2, "end": 181.74607407407407, "text": "The Cornell commission also criticized\nthe limited response, finding"}, {"start": 181.74607407407407, "end": 185.36, "text": "that Morris had not alerted anyone\nin a position of responsibility."}]}, {"id": "long-034", "sentence": "An attempted warning did not erase the consequences of releasing the program.", "route": "A", "master": "assets/0c32c4efa2593fcbca8e.png", "start": 185.36, "end": 189.6, "focus": "50.0% 44.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 185.36, "spokenEnd": 189.48, "cues": [{"start": 185.36, "end": 189.04631578947368, "text": "An attempted warning did not erase\nthe consequences of releasing the"}, {"start": 189.04631578947368, "end": 189.6, "text": "program."}]}, {"id": "long-035", "sentence": "Meanwhile, people at Berkeley and MIT had obtained copies of the worm and begun examining them.", "route": "A", "master": "assets/57ddbbdb09724b8a153e.png", "start": 189.6, "end": 194.88, "focus": "50.0% 43.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 189.6, "spokenEnd": 194.76, "cues": [{"start": 189.6, "end": 193.38765957446807, "text": "Meanwhile, people at Berkeley and\nMIT had obtained copies of the worm"}, {"start": 193.38765957446807, "end": 194.88, "text": "and begun examining them."}]}, {"id": "long-036", "sentence": "Teams exchanged findings and worked out ways to stop the spread and prevent machines from being infected again.", "route": "A", "master": "assets/ca4047daa59bde448ea2.png", "start": 194.88, "end": 200.8, "focus": "51.0% 40.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 194.88, "spokenEnd": 200.68, "cues": [{"start": 194.88, "end": 198.41272727272727, "text": "Teams exchanged findings and worked\nout ways to stop the spread and"}, {"start": 198.41272727272727, "end": 200.8, "text": "prevent machines from\nbeing infected again."}]}, {"id": "long-037", "sentence": "But institutions cutting themselves off for protection also made it harder to circulate useful information.", "route": "A", "master": "assets/600a402e97da8e16eb2f.png", "start": 200.8, "end": 206.48, "focus": "60.0% 48.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 200.8, "spokenEnd": 206.36, "cues": [{"start": 200.8, "end": 204.3143396226415, "text": "But institutions cutting themselves\noff for protection also made it"}, {"start": 204.3143396226415, "end": 206.48, "text": "harder to circulate\nuseful information."}]}, {"id": "long-038", "sentence": "Responders used phone calls as well as email to pass along what they were learning.", "route": "A", "master": "assets/e4660f481e101d26db14.png", "start": 206.48, "end": 210.56, "focus": "54.0% 51.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 206.48, "spokenEnd": 210.44, "cues": [{"start": 206.48, "end": 209.76390243902438, "text": "Responders used phone calls as well\nas email to pass along what they"}, {"start": 209.76390243902438, "end": 210.56, "text": "were learning."}]}, {"id": "long-039", "sentence": "Existing relationships helped people find someone who knew an answer, or someone else who might.", "route": "A", "master": "assets/57ddbbdb09724b8a153e.png", "start": 210.56, "end": 215.48, "focus": "50.0% 43.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 210.56, "spokenEnd": 215.36, "cues": [{"start": 210.56, "end": 214.1978947368421, "text": "Existing relationships helped people\nfind someone who knew an answer, or"}, {"start": 214.1978947368421, "end": 215.48, "text": "someone else who might."}]}, {"id": "long-040", "sentence": "The emergency had become a problem of coordination as much as a problem of computer code.", "route": "A", "master": "assets/0c32c4efa2593fcbca8e.png", "start": 215.48, "end": 220.44, "focus": "50.0% 44.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 215.48, "spokenEnd": 220.32, "cues": [{"start": 215.48, "end": 219.385, "text": "The emergency had become a problem\nof coordination as much as a problem"}, {"start": 219.385, "end": 220.44, "text": "of computer code."}]}, {"id": "long-041", "sentence": "A technical account published the following year reported that most infected computers were cleared within forty-eight to seventy-two hours.", "route": "A", "master": "assets/a1c59b6baffcb3fc9211.png", "start": 220.44, "end": 228.08, "focus": "51.0% 45.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 220.44, "spokenEnd": 227.96, "cues": [{"start": 220.44, "end": 224.06474820143885, "text": "A technical account published the\nfollowing year reported that most"}, {"start": 224.06474820143885, "end": 228.08, "text": "infected computers were cleared within\nforty-eight to seventy-two hours."}]}, {"id": "long-042", "sentence": "That was a major recovery, although it did not mean every organization had returned to normal at the same moment.", "route": "A", "master": "assets/c9e94a06768724f564b0.png", "start": 228.08, "end": 234.32, "focus": "49.0% 41.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 228.08, "spokenEnd": 234.2, "cues": [{"start": 228.08, "end": 231.905, "text": "That was a major recovery, although\nit did not mean every organization"}, {"start": 231.905, "end": 234.32, "text": "had returned to normal\nat the same moment."}]}, {"id": "long-043", "sentence": "Outside the computer rooms, a different chain of conversations was pointing toward the author.", "route": "A", "master": "assets/61e8c43407279a12e74f.png", "start": 234.32, "end": 239.56, "focus": "49.0% 48.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 234.32, "spokenEnd": 239.44, "cues": [{"start": 234.32, "end": 237.95354838709676, "text": "Outside the computer rooms, a\ndifferent chain of conversations was"}, {"start": 237.95354838709676, "end": 239.56, "text": "pointing toward the author."}]}, {"id": "long-044", "sentence": "The FBI recounts how a friend anonymously contacted the New York Times and inadvertently used Morris's initials in follow-up conversations.", "route": "A", "master": "assets/e4660f481e101d26db14.png", "start": 239.56, "end": 247.52, "focus": "54.0% 51.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 239.56, "spokenEnd": 247.4, "cues": [{"start": 239.56, "end": 243.5368115942029, "text": "The FBI recounts how a friend\nanonymously contacted the New York Times"}, {"start": 243.5368115942029, "end": 247.52, "text": "and inadvertently used Morris's\ninitials in follow-up conversations."}]}, {"id": "long-045", "sentence": "The newspaper established his identity, and the FBI investigation then confirmed his involvement.", "route": "A", "master": "assets/61e8c43407279a12e74f.png", "start": 247.52, "end": 252.92, "focus": "49.0% 48.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 247.52, "spokenEnd": 252.8, "cues": [{"start": 247.52, "end": 251.37, "text": "The newspaper established his identity,\nand the FBI investigation then"}, {"start": 251.37, "end": 252.92, "text": "confirmed his involvement."}]}, {"id": "long-046", "sentence": "Agents interviewed Morris and his associates and examined his computer files.", "route": "A", "master": "assets/d1149e615463cb89947d.png", "start": 252.92, "end": 257.04, "focus": "53.0% 49.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 252.92, "spokenEnd": 256.92, "cues": [{"start": 252.92, "end": 256.6042105263158, "text": "Agents interviewed Morris and his\nassociates and examined his computer"}, {"start": 256.6042105263158, "end": 257.04, "text": "files."}]}, {"id": "long-047", "sentence": "The mystery of who had written the worm was giving way to the question of criminal responsibility.", "route": "A", "master": "assets/0c32c4efa2593fcbca8e.png", "start": 257.04, "end": 262.28, "focus": "50.0% 44.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 257.04, "spokenEnd": 262.16, "cues": [{"start": 257.04, "end": 260.73484536082475, "text": "The mystery of who had written the\nworm was giving way to the question"}, {"start": 260.73484536082475, "end": 262.28, "text": "of criminal responsibility."}]}, {"id": "long-048", "sentence": "Even before the criminal case reached its conclusion, the attack had prompted a lasting institutional response.", "route": "A", "master": "assets/ca4047daa59bde448ea2.png", "start": 262.28, "end": 268.92, "focus": "51.0% 43.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 262.28, "spokenEnd": 268.8, "cues": [{"start": 262.28, "end": 266.31054545454543, "text": "Even before the criminal case reached\nits conclusion, the attack had"}, {"start": 266.31054545454543, "end": 268.92, "text": "prompted a lasting\ninstitutional response."}]}, {"id": "long-049", "sentence": "The Defense Advanced Research Projects Agency asked Carnegie Mellon University's Software Engineering Institute to establish a computer emergency response team.", "route": "A", "master": "assets/8b8254580c6e92c51186.png", "start": 268.92, "end": 277.96, "focus": "54.0% 53.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 268.92, "spokenEnd": 277.84, "cues": [{"start": 268.92, "end": 272.7025316455696, "text": "The Defense Advanced Research\nProjects Agency asked Carnegie Mellon"}, {"start": 272.7025316455696, "end": 276.48506329113917, "text": "University's Software Engineering\nInstitute to establish a computer"}, {"start": 276.48506329113917, "end": 277.96, "text": "emergency response team."}]}, {"id": "long-050", "sentence": "That organization became known as the CERT Coordination Center.", "route": "A", "master": "assets/ca4047daa59bde448ea2.png", "start": 277.96, "end": 281.48, "focus": "60.0% 30.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 277.96, "spokenEnd": 281.36, "cues": [{"start": 277.96, "end": 281.48, "text": "That organization became known\nas the CERT Coordination Center."}]}, {"id": "long-051", "sentence": "Its role included helping information about software weaknesses reach the people who could address them.", "route": "A", "master": "assets/ca4047daa59bde448ea2.png", "start": 281.48, "end": 286.72, "focus": "51.0% 40.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 281.48, "spokenEnd": 286.6, "cues": [{"start": 281.48, "end": 284.90990291262136, "text": "Its role included helping information\nabout software weaknesses reach"}, {"start": 284.90990291262136, "end": 286.72, "text": "the people who could address them."}]}, {"id": "long-052", "sentence": "The response to a future emergency would need more than scattered experts discovering the same problem separately.", "route": "A", "master": "assets/57ddbbdb09724b8a153e.png", "start": 286.72, "end": 292.64, "focus": "50.0% 43.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 286.72, "spokenEnd": 292.52, "cues": [{"start": 286.72, "end": 290.0562831858407, "text": "The response to a future emergency\nwould need more than scattered"}, {"start": 290.0562831858407, "end": 292.64, "text": "experts discovering the\nsame problem separately."}]}, {"id": "long-053", "sentence": "It would need a reliable way for those experts to work together.", "route": "A", "master": "assets/0c32c4efa2593fcbca8e.png", "start": 292.64, "end": 295.8, "focus": "50.0% 44.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 292.64, "spokenEnd": 295.68, "cues": [{"start": 292.64, "end": 295.8, "text": "It would need a reliable way for\nthose experts to work together."}]}, {"id": "long-054", "sentence": "In 1990, a jury convicted Morris under the Computer Fraud and Abuse Act.", "route": "A", "master": "assets/2df05dc9f9698820bd0b.png", "start": 295.8, "end": 300.8, "focus": "50.0% 44.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 295.8, "spokenEnd": 300.68, "cues": [{"start": 295.8, "end": 300.8, "text": "In 1990, a jury convicted Morris under\nthe Computer Fraud and Abuse Act."}]}, {"id": "long-055", "sentence": "He received three years of probation, four hundred hours of community service, and a fine of more than ten thousand dollars.", "route": "A", "master": "assets/b94d41dbe2a4e0b6cf25.png", "start": 300.8, "end": 308.0, "focus": "46.0% 44.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 300.8, "spokenEnd": 307.88, "cues": [{"start": 300.8, "end": 304.77170731707315, "text": "He received three years of probation,\nfour hundred hours of community"}, {"start": 304.77170731707315, "end": 308.0, "text": "service, and a fine of more\nthan ten thousand dollars."}]}, {"id": "long-056", "sentence": "He did not receive a prison sentence.", "route": "A", "master": "assets/0c32c4efa2593fcbca8e.png", "start": 308.0, "end": 310.48, "focus": "50.0% 44.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 308.0, "spokenEnd": 310.36, "cues": [{"start": 308.0, "end": 310.48, "text": "He did not receive a prison sentence."}]}, {"id": "long-057", "sentence": "On appeal, he argued that the government needed to prove he had intended the resulting interference and loss, not just the unauthorized access.", "route": "A", "master": "assets/b94d41dbe2a4e0b6cf25.png", "start": 310.48, "end": 318.52, "focus": "46.0% 44.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 310.48, "spokenEnd": 318.4, "cues": [{"start": 310.48, "end": 314.49577464788734, "text": "On appeal, he argued that the government\nneeded to prove he had intended"}, {"start": 314.49577464788734, "end": 318.52, "text": "the resulting interference and loss,\nnot just the unauthorized access."}]}, {"id": "long-058", "sentence": "The appeals court rejected that interpretation of the law as it then stood.", "route": "A", "master": "assets/2df05dc9f9698820bd0b.png", "start": 318.52, "end": 322.6, "focus": "50.0% 55.00000000000001%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 318.52, "spokenEnd": 322.48, "cues": [{"start": 318.52, "end": 322.1589189189189, "text": "The appeals court rejected that\ninterpretation of the law as it then"}, {"start": 322.1589189189189, "end": 322.6, "text": "stood."}]}, {"id": "long-059", "sentence": "It also rejected the idea that permission to use some computers gave him permission to enter others.", "route": "A", "master": "assets/e4660f481e101d26db14.png", "start": 322.6, "end": 328.08, "focus": "50.0% 46.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.07}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 322.6, "spokenEnd": 327.96, "cues": [{"start": 322.6, "end": 326.4981818181818, "text": "It also rejected the idea that\npermission to use some computers gave him"}, {"start": 326.4981818181818, "end": 328.08, "text": "permission to enter others."}]}, {"id": "long-060", "sentence": "On March 7, 1991, the Second Circuit affirmed his conviction.", "route": "A", "master": "assets/83cfb34875e38b7e6e1a.png", "start": 328.08, "end": 332.44, "focus": "65.0% 46.0%", "platePosition": "50% 50%", "motion": {"cameraStart": 1.07, "cameraEnd": 1.0}, "label": "AI-generated editorial illustration · narrated review draft", "spokenStart": 328.08, "spokenEnd": 332.32, "cues": [{"start": 328.08, "end": 332.44, "text": "On March 7, 1991, the Second\nCircuit affirmed his conviction."}]}, {"id": "long-061", "sentence": "The case ended
