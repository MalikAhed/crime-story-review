, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/c44063866bb1b875edef.png", "focus": "52.0% 43.0%", "motion": {"cameraStart": 1.06, "cameraEnd": 1.0}, "spokenStart": 9.84, "spokenEnd": 15.52, "cues": [{"start": 9.84, "end": 13.430188679245283, "text": "Their case ended with guilty pleas,\nprobation, and an order to keep"}, {"start": 13.430188679245283, "end": 15.64, "text": "helping investigators\nfight cybercrime."}]}, {"id": "long-004", "sentence": "The story began with devices whose owners had never agreed to take part.", "route": "A", "start": 15.64, "end": 19.44, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/21ff7a38c7a97c607c2f.png", "focus": "50.0% 54.0%", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 15.64, "spokenEnd": 19.32, "cues": [{"start": 15.64, "end": 19.44, "text": "The story began with devices whose\nowners had never agreed to take part."}]}, {"id": "long-005", "sentence": "In the summer and fall of 2016, Paras Jha, Josiah White, and Dalton Norman created a malicious network called Mirai.", "route": "A", "start": 19.44, "end": 28.28, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 150, "width": 941, "height": 529.3125}, "sourceDimensions": [941, 1672], "sourceImageDimensions": [941, 1672], "master": "assets/a4ea3043139623aff365.png", "focus": "50.0% 44.0%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.06}, "spokenStart": 19.44, "spokenEnd": 28.16, "cues": [{"start": 19.44, "end": 24.520347826086958, "text": "In the summer and fall of 2016,\nParas Jha, Josiah White, and Dalton"}, {"start": 24.520347826086958, "end": 28.28, "text": "Norman created a malicious\nnetwork called Mirai."}]}, {"id": "long-006", "sentence": "It targeted internet-connected equipment including wireless cameras, home routers, and digital video recorders.", "route": "A", "start": 28.28, "end": 34.96, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/43fde7ba7693c004989a.png", "focus": "55.00000000000001% 5.0%", "motion": {"cameraStart": 1.06, "cameraEnd": 1.0}, "spokenStart": 28.28, "spokenEnd": 34.84, "cues": [{"start": 28.28, "end": 32.33527272727273, "text": "It targeted internet-connected\nequipment including wireless cameras,"}, {"start": 32.33527272727273, "end": 34.96, "text": "home routers, and\ndigital video recorders."}]}, {"id": "long-007", "sentence": "Once compromised, those devices could be controlled together without their owners knowing or giving permission.", "route": "A", "start": 34.96, "end": 41.12, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/21ff7a38c7a97c607c2f.png", "focus": "78.0% 35.0%", "motion": {"cameraStart": 1.0, "cameraEnd": 1.06}, "spokenStart": 34.96, "spokenEnd": 41.0, "cues": [{"start": 34.96, "end": 38.69381818181818, "text": "Once compromised, those devices\ncould be controlled together without"}, {"start": 38.69381818181818, "end": 41.12, "text": "their owners knowing\nor giving permission."}]}, {"id": "long-008", "sentence": "That collection of infected machines was a botnet, and Mirai grew to hundreds of thousands of devices.", "route": "A", "start": 41.12, "end": 46.92, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 460, "width": 992, "height": 558}, "sourceDimensions": [992, 1586], "sourceImageDimensions": [992, 1586], "master": "assets/6306772c842b39892dbb.png", "focus": "55.00000000000001% 57.99999999999999%", "motion": {"cameraStart": 1.06, "cameraEnd": 1.0}, "spokenStart": 41.12, "spokenEnd": 46.8, "cues": [{"start": 41.12, "end": 44.944158415841585, "text": "That collection of infected machines\nwas a botnet, and Mirai grew to"}, {"start": 44.944158415841585, "end": 46.92, "text": "hundreds of thousands of devices."}]}, {"id": "long-009", "sentence": "Its operators could direct large numbers of those devices to overwhelm the internet connections of selected targets.", "route": "A", "start": 46.92, "end": 53.4, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/d5a10a846a0fb9c6e5c3.png", "focus": "72.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 46.92, "spokenEnd": 53.28, "cues": [{"start": 46.92, "end": 50.791304347826085, "text": "Its operators could direct large\nnumbers of those devices to overwhelm"}, {"start": 50.791304347826085, "end": 53.4, "text": "the internet connections\nof selected targets."}]}, {"id": "long-010", "sentence": "The resulting flood of traffic could make a website unavailable to the people trying to use it.", "route": "A", "start": 53.4, "end": 58.44, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 340, "width": 992, "height": 558}, "sourceDimensions": [992, 1586], "sourceImageDimensions": [992, 1586], "master": "assets/814c76df969707c4fd61.png", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1.06, "cameraEnd": 1}, "spokenStart": 53.4, "spokenEnd": 58.32, "cues": [{"start": 53.4, "end": 57.06382978723404, "text": "The resulting flood of traffic could\nmake a website unavailable to the"}, {"start": 57.06382978723404, "end": 58.44, "text": "people trying to use it."}]}, {"id": "long-011", "sentence": "Damage could also spread to the providers carrying that traffic, beyond the intended target.", "route": "A", "start": 58.44, "end": 63.52, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/97701aa70fb4cbbb2c48.png", "focus": "10.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "spokenStart": 58.44, "spokenEnd": 63.4, "cues": [{"start": 58.44, "end": 62.309890109890105, "text": "Damage could also spread to the\nproviders carrying that traffic, beyond"}, {"start": 62.309890109890105, "end": 63.52, "text": "the intended target."}]}, {"id": "long-012", "sentence": "Jha’s plea agreement explains the criminal purposes he admitted for the network.", "route": "B", "start": 63.52, "end": 67.64, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.8125, "width": 1670, "height": 939.375}, "sourceDimensions": [1670, 941], "sourceImageDimensions": [1670, 941], "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "focus": "50.0% 50.0%", "placement": {"left": 21.35568862275449, "top": 16.94717232202262, "width": 56.82934131736527, "anchorX": 50, "anchorY": 94.45933869526363}, "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 63.52, "spokenEnd": 67.52, "cues": [{"start": 63.52, "end": 67.11493670886075, "text": "Jha’s plea agreement explains the\ncriminal purposes he admitted for the"}, {"start": 67.11493670886075, "end": 67.64, "text": "network."}]}, {"id": "long-013", "sentence": "His plea agreement described plans to attack business competitors and people against whom the conspirators held grudges.", "route": "A", "start": 67.64, "end": 73.92, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/c97d9173ca982626dfd0.png", "focus": "55.00000000000001% 60.0%", "motion": {"cameraStart": 1.06, "cameraEnd": 1}, "spokenStart": 67.64, "spokenEnd": 73.8, "cues": [{"start": 67.64, "end": 71.21176470588235, "text": "His plea agreement described plans\nto attack business competitors and"}, {"start": 71.21176470588235, "end": 73.92, "text": "people against whom the\nconspirators held grudges."}]}, {"id": "long-014", "sentence": "It also described two ways they intended to make money: renting the network and demanding protection payments.", "route": "A", "start": 73.92, "end": 79.56, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 405, "width": 941, "height": 529.3125}, "sourceDimensions": [941, 1672], "sourceImageDimensions": [941, 1672], "master": "assets/e59d637dbe74ffa2b50c.png", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "spokenStart": 73.92, "spokenEnd": 79.44, "cues": [{"start": 73.92, "end": 77.31302752293578, "text": "It also described two ways they\nintended to make money: renting the"}, {"start": 77.31302752293578, "end": 79.56, "text": "network and demanding\nprotection payments."}]}, {"id": "long-015", "sentence": "In August and September of 2016, they used Mirai against hosting companies and other targets.", "route": "A", "start": 79.56, "end": 86.0, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/5e86fcd1249129f97f5a.png", "focus": "70.0% 55.00000000000001%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "spokenStart": 79.56, "spokenEnd": 85.88, "cues": [{"start": 79.56, "end": 83.95652173913044, "text": "In August and September of 2016,\nthey used Mirai against hosting"}, {"start": 83.95652173913044, "end": 86.0, "text": "companies and other targets."}]}, {"id": "long-016", "sentence": "They also accepted payments from other criminals who wanted access to the network for their own attacks.", "route": "A", "start": 86.0, "end": 91.44, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 405, "width": 941, "height": 529.3125}, "sourceDimensions": [941, 1672], "sourceImageDimensions": [941, 1672], "master": "assets/e59d637dbe74ffa2b50c.png", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1.06, "cameraEnd": 1}, "spokenStart": 86.0, "spokenEnd": 91.32, "cues": [{"start": 86.0, "end": 89.56388349514563, "text": "They also accepted payments from\nother criminals who wanted access to"}, {"start": 89.56388349514563, "end": 91.44, "text": "the network for their own attacks."}]}, {"id": "long-017", "sentence": "A collection of other people’s household equipment had become something the conspirators could sell access to.", "route": "A", "start": 91.44, "end": 97.08, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/21ff7a38c7a97c607c2f.png", "focus": "88.0% 35.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "spokenStart": 91.44, "spokenEnd": 96.96, "cues": [{"start": 91.44, "end": 95.03559633027523, "text": "A collection of other people’s\nhousehold equipment had become something"}, {"start": 95.03559633027523, "end": 97.08, "text": "the conspirators could sell access to."}]}, {"id": "long-018", "sentence": "The device owners had not volunteered their connections, and the businesses being attacked had not agreed to be targets.", "route": "A", "start": 97.08, "end": 103.2, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/e488c03c9fe7dd5d4386.png", "focus": "50.0% 25.0%", "motion": {"cameraStart": 1.06, "cameraEnd": 1}, "spokenStart": 97.08, "spokenEnd": 103.08, "cues": [{"start": 97.08, "end": 100.30689075630252, "text": "The device owners had not volunteered\ntheir connections, and the"}, {"start": 100.30689075630252, "end": 103.2, "text": "businesses being attacked\nhad not agreed to be targets."}]}, {"id": "long-019", "sentence": "One public account of the disruption came from security journalist Brian Krebs, whose reporting website was hit in September 2016.", "route": "A", "start": 103.2, "end": 110.64, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/7f68e9a312570fbc56d2.png", "focus": "50.0% 46.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 103.2, "spokenEnd": 110.52, "cues": [{"start": 103.2, "end": 107.28558139534884, "text": "One public account of the disruption\ncame from security journalist Brian"}, {"start": 107.28558139534884, "end": 110.64, "text": "Krebs, whose reporting website\nwas hit in September 2016."}]}, {"id": "long-020", "sentence": "He later wrote that the Mirai attack had kept his site offline for nearly four days.", "route": "A", "start": 110.64, "end": 116.12, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 440, "y": 100, "width": 880, "height": 495}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/7f68e9a312570fbc56d2.png", "focus": "40.0% 40.0%", "motion": {"cameraStart": 1.06, "cameraEnd": 1}, "spokenStart": 110.64, "spokenEnd": 116.0, "cues": [{"start": 110.64, "end": 114.9021686746988, "text": "He later wrote that the Mirai\nattack had kept his site offline for"}, {"start": 114.9021686746988, "end": 116.12, "text": "nearly four days."}]}, {"id": "long-021", "sentence": "For readers trying to reach that reporting, the damage was a missing destination, rather than an abstract number of infected devices.", "route": "A", "start": 116.12, "end": 123.52, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 340, "width": 992, "height": 558}, "sourceDimensions": [992, 1586], "sourceImageDimensions": [992, 1586], "master": "assets/814c76df969707c4fd61.png", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "spokenStart": 116.12, "spokenEnd": 123.4, "cues": [{"start": 116.12, "end": 119.87030303030303, "text": "For readers trying to reach that\nreporting, the damage was a missing"}, {"start": 119.87030303030303, "end": 123.52, "text": "destination, rather than an\nabstract number of infected devices."}]}, {"id": "long-022", "sentence": "The scale of the network mattered because it could keep people from using services they expected to be available.", "route": "A", "start": 123.52, "end": 129.44, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/f24c5221dea292f79dd0.png", "focus": "50.0% 60.0%", "motion": {"cameraStart": 1.06, "cameraEnd": 1}, "spokenStart": 123.52, "spokenEnd": 129.32, "cues": [{"start": 123.52, "end": 126.98964285714285, "text": "The scale of the network mattered\nbecause it could keep people from"}, {"start": 126.98964285714285, "end": 129.44, "text": "using services they\nexpected to be available."}]}, {"id": "long-023", "sentence": "Then, in the fall of 2016, Jha published Mirai’s source code on a criminal forum.", "route": "A", "start": 129.44, "end": 134.44, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/7f68e9a312570fbc56d2.png", "focus": "52.0% 47.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 129.44, "spokenEnd": 134.32, "cues": [{"start": 129.44, "end": 133.405, "text": "Then, in the fall of 2016, Jha\npublished Mirai’s source code on a"}, {"start": 133.405, "end": 134.44, "text": "criminal forum."}]}, {"id": "long-024", "sentence": "The Justice Department says the three men’s involvement with the original version ended that fall.", "route": "A", "start": 134.44, "end": 139.36, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/196d5f8134c2926d6eb2.png", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 134.44, "spokenEnd": 139.24, "cues": [{"start": 134.44, "end": 137.60701030927837, "text": "The Justice Department says the\nthree men’s involvement with the"}, {"start": 137.60701030927837, "end": 139.36, "text": "original version ended that fall."}]}, {"id": "long-025", "sentence": "Other criminals used versions of the released code in further attacks, extending the damage beyond the original group.", "route": "A", "start": 139.36, "end": 146.36, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 530, "width": 992, "height": 558}, "sourceDimensions": [992, 1586], "sourceImageDimensions": [992, 1586], "master": "assets/6306772c842b39892dbb.png", "focus": "55.00000000000001% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 139.36, "spokenEnd": 146.24, "cues": [{"start": 139.36, "end": 143.47623931623932, "text": "Other criminals used versions of the\nreleased code in further attacks,"}, {"start": 143.47623931623932, "end": 146.36, "text": "extending the damage\nbeyond the original group."}]}, {"id": "long-026", "sentence": "That distinction matters when the same malware name appears in reports about different crimes.", "route": "B", "start": 146.36, "end": 151.04, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.53125, "width": 1671, "height": 939.9375}, "sourceDimensions": [1671, 941], "sourceImageDimensions": [1670, 941], "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "focus": "50.0% 50.0%", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.795566521956445, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 146.36, "spokenEnd": 150.92, "cues": [{"start": 146.36, "end": 149.79225806451612, "text": "That distinction matters when the\nsame malware name appears in reports"}, {"start": 149.79225806451612, "end": 151.04, "text": "about different crimes."}]}, {"id": "long-027", "sentence": "The Associated Press reported that prosecutors did not believe these three men were responsible for the major October 2016 outage.", "route": "A", "start": 151.04, "end": 157.72, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/f0ac9c25439dc79993ae.png", "focus": "52.0% 56.00000000000001%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 151.04, "spokenEnd": 157.6, "cues": [{"start": 151.04, "end": 154.49798449612402, "text": "The Associated Press reported that\nprosecutors did not believe these"}, {"start": 154.49798449612402, "end": 157.72, "text": "three men were responsible for\nthe major October 2016 outage."}]}, {"id": "long-028", "sentence": "A separate case later produced a guilty plea over attacks that affected the internet infrastructure company Dyn that October.", "route": "A", "start": 157.72, "end": 164.56, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/b8f7e0282d258e4fce82.png", "focus": "60.0% 53.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 157.72, "spokenEnd": 164.44, "cues": [{"start": 157.72, "end": 161.56774193548387, "text": "A separate case later produced a\nguilty plea over attacks that affected"}, {"start": 161.56774193548387, "end": 164.56, "text": "the internet infrastructure\ncompany Dyn that October."}]}, {"id": "long-029", "sentence": "That was a different defendant and a different prosecution, not another conviction of Mirai’s three creators.", "route": "A", "start": 164.56, "end": 170.64, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 900, "y": 270, "width": 760, "height": 427.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/f0ac9c25439dc79993ae.png", "focus": "52.0% 52.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 164.56, "spokenEnd": 170.52, "cues": [{"start": 164.56, "end": 168.47814814814816, "text": "That was a different defendant and\na different prosecution, not another"}, {"start": 168.47814814814816, "end": 170.64, "text": "conviction of Mirai’s three creators."}]}, {"id": "long-030", "sentence": "The FBI investigated the original Mirai conspiracy, with its Anchorage office playing a central role.", "route": "A", "start": 170.64, "end": 176.92, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/3da0877913c027f6944d.png", "focus": "55.00000000000001% 48.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 170.64, "spokenEnd": 176.8, "cues": [{"start": 170.64, "end": 174.952, "text": "The FBI investigated the original\nMirai conspiracy, with its Anchorage"}, {"start": 174.952, "end": 176.92, "text": "office playing a central role."}]}, {"id": "long-031", "sentence": "The infected devices included computers in Alaska, putting part of this widespread crime within the district.", "route": "A", "start": 176.92, "end": 182.84, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/21ff7a38c7a97c607c2f.png", "focus": "50.0% 54.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 176.92, "spokenEnd": 182.72, "cues": [{"start": 176.92, "end": 180.73296296296297, "text": "The infected devices included computers\nin Alaska, putting part of this"}, {"start": 180.73296296296297, "end": 182.84, "text": "widespread crime within the district."}]}, {"id": "long-032", "sentence": "On December eighth, 2017, Jha, White, and Norman each pleaded guilty in federal court in Alaska.", "route": "A", "start": 182.84, "end": 189.36, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/6602340570d29206a67e.png", "focus": "50.0% 55.00000000000001%", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 182.84, "spokenEnd": 189.24, "cues": [{"start": 182.84, "end": 187.62315789473686, "text": "On December eighth, 2017, Jha, White,\nand Norman each pleaded guilty in"}, {"start": 187.62315789473686, "end": 189.36, "text": "federal court in Alaska."}]}, {"id": "long-033", "sentence": "Their pleas concerned a conspiracy to violate the Computer Fraud and Abuse Act through the operation of Mirai.", "route": "A", "start": 189.36, "end": 195.28, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 80, "y": 260, "width": 850, "height": 478.125}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/f0ac9c25439dc79993ae.png", "focus": "50.0% 55.00000000000001%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 189.36, "spokenEnd": 195.16, "cues": [{"start": 189.36, "end": 192.9783486238532, "text": "Their pleas concerned a conspiracy\nto violate the Computer Fraud and"}, {"start": 192.9783486238532, "end": 195.28, "text": "Abuse Act through the\noperation of Mirai."}]}, {"id": "long-034", "sentence": "Jha’s signed plea agreement admitted the attack network, its criminal purpose, and the paid access given to other offenders.", "route": "A", "start": 195.28, "end": 202.4, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/b8f7e0282d258e4fce82.png", "focus": "65.0% 70.0%", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 195.28, "spokenEnd": 202.28, "cues": [{"start": 195.28, "end": 199.2068292682927, "text": "Jha’s signed plea agreement admitted\nthe attack network, its criminal"}, {"start": 199.2068292682927, "end": 202.4, "text": "purpose, and the paid access\ngiven to other offenders."}]}, {"id": "long-035", "sentence": "The record therefore went beyond an accusation that his name had been linked to malicious software.", "route": "B", "start": 202.4, "end": 207.92, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.53125, "width": 1671, "height": 939.9375}, "sourceDimensions": [1671, 941], "sourceImageDimensions": [1670, 941], "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "focus": "50.0% 50.0%", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.795566521956445, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 202.4, "spokenEnd": 207.8, "cues": [{"start": 202.4, "end": 206.20204081632653, "text": "The record therefore went beyond an\naccusation that his name had been"}, {"start": 206.20204081632653, "end": 207.92, "text": "linked to malicious software."}]}, {"id": "long-036", "sentence": "Jha and Norman also pleaded guilty in a separate case involving another botnet used for advertising fraud.", "route": "A", "start": 207.92, "end": 214.12, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/f0ac9c25439dc79993ae.png", "focus": "52.0% 56.00000000000001%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 207.92, "spokenEnd": 214.0, "cues": [{"start": 207.92, "end": 212.03123809523808, "text": "Jha and Norman also pleaded guilty\nin a separate case involving another"}, {"start": 212.03123809523808, "end": 214.12, "text": "botnet used for advertising fraud."}]}, {"id": "long-037", "sentence": "That scheme generated fake advertising clicks, making it appear that real people had clicked on advertisements.", "route": "A", "start": 214.12, "end": 220.2, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/25fc6309cd4011e18056.png", "focus": "50.0% 45.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 214.12, "spokenEnd": 220.08, "cues": [{"start": 214.12, "end": 217.80436363636363, "text": "That scheme generated fake advertising\nclicks, making it appear that"}, {"start": 217.80436363636363, "end": 220.2, "text": "real people had clicked\non advertisements."}]}, {"id": "long-038", "sentence": "White was not named among the defendants pleading guilty in that separate advertising-fraud case.", "route": "A", "start": 220.2, "end": 225.56, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 900, "y": 270, "width": 760, "height": 427.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/f0ac9c25439dc79993ae.png", "focus": "52.0% 52.0%", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 220.2, "spokenEnd": 225.44, "cues": [{"start": 220.2, "end": 223.69333333333333, "text": "White was not named among the\ndefendants pleading guilty in that"}, {"start": 223.69333333333333, "end": 225.56, "text": "separate advertising-fraud case."}]}, {"id": "long-039", "sentence": "Jha also faced a separate prosecution in New Jersey for attacks against Rutgers University.", "route": "B", "start": 225.56, "end": 230.92, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.53125, "width": 1671, "height": 939.9375}, "sourceDimensions": [1671, 941], "sourceImageDimensions": [1670, 941], "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "focus": "50.0% 50.0%", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.795566521956445, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 225.56, "spokenEnd": 230.8, "cues": [{"start": 225.56, "end": 229.6937777777778, "text": "Jha also faced a separate prosecution\nin New Jersey for attacks against"}, {"start": 229.6937777777778, "end": 230.92, "text": "Rutgers University."}]}, {"id": "long-040", "sentence": "Those attacks began in November 2014, before Mirai, and continued through September 2016.", "route": "A", "start": 230.92, "end": 237.08, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/336417ec09ea039c3a43.png", "focus": "55.00000000000001% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 230.92, "spokenEnd": 236.96, "cues": [{"start": 230.92, "end": 235.38136363636363, "text": "Those attacks began in November\n2014, before Mirai, and continued"}, {"start": 235.38136363636363, "end": 237.08, "text": "through September 2016."}]}, {"id": "long-041", "sentence": "The university’s central authentication server was shut down, disrupting a portal used for assignments and assessments.", "route": "A", "start": 237.08, "end": 243.72, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/033e8bca6d1250c5536c.png", "focus": "50.0% 45.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 237.08, "spokenEnd": 243.6, "cues": [{"start": 237.08, "end": 241.05830508474577, "text": "The university’s central authentication\nserver was shut down, disrupting"}, {"start": 241.05830508474577, "end": 243.72, "text": "a portal used for\nassignments and assessments."}]}, {"id": "long-042", "sentence": "At times the portal was unavailable for days, harming students, faculty, and the university.", "route": "A", "start": 243.72, "end": 249.4, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/f24c5221dea292f79dd0.png", "focus": "52.0% 50.0%", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 243.72, "spokenEnd": 249.28, "cues": [{"start": 243.72, "end": 248.11912087912089, "text": "At times the portal was unavailable\nfor days, harming students, faculty,"}, {"start": 248.11912087912089, "end": 249.4, "text": "and the university."}]}, {"id": "long-043", "sentence": "By the time of the Alaska sentencing, the three Mirai defendants had been cooperating extensively with the FBI.", "route": "B", "start": 249.4, "end": 256.12, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.53125, "width": 1671, "height": 939.9375}, "sourceDimensions": [1671, 941], "sourceImageDimensions": [1670, 941], "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "focus": "50.0% 50.0%", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.795566521956445, "anchorX": 50.0, "anchorY": 94.45933869526363}, "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "spokenStart": 249.4, "spokenEnd": 256.0, "cues": [{"start": 249.4, "end": 253.48, "text": "By the time of the Alaska sentencing,\nthe three Mirai defendants had"}, {"start": 253.48, "end": 256.12, "text": "been cooperating\nextensively with the FBI."}]}, {"id": "long-044", "sentence": "According to the Justice Department, their assistance had substantially helped active cybercrime investigations and broader work to defend computer systems.", "route": "A", "start": 256.12, "end": 264.4, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/b61d44bc9e638650cb19.png", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 256.12, "spokenEnd": 264.28, "cues": [{"start": 256.12, "end": 259.88207792207794, "text": "According to the Justice Department,\ntheir assistance had substantially"}, {"start": 259.88207792207794, "end": 263.37922077922076, "text": "helped active cybercrime investigations\nand broader work to defend"}, {"start": 263.37922077922076, "end": 264.4, "text": "computer systems."}]}, {"id": "long-045", "sentence": "Federal investigators supported leniency, pointing to help identifying other offenders and countering serious cyberattacks.", "route": "A", "start": 264.4, "end": 271.72, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 80, "y": 260, "width": 850, "height": 478.125}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/f0ac9c25439dc79993ae.png", "focus": "50.0% 55.00000000000001%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 264.4, "spokenEnd": 271.6, "cues": [{"start": 264.4, "end": 268.5311475409836, "text": "Federal investigators supported\nleniency, pointing to help identifying"}, {"start": 268.5311475409836, "end": 271.72, "text": "other offenders and countering\nserious cyberattacks."}]}, {"id": "long-046", "sentence": "On September eighteenth, 2018, a federal judge sentenced each of the three men to five years of probation.", "route": "A", "start": 271.72, "end": 278.52, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/6602340570d29206a67e.png", "focus": "50.0% 55.00000000000001%", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 271.72, "spokenEnd": 278.4, "cues": [{"start": 271.72, "end": 276.04609523809523, "text": "On September eighteenth, 2018, a\nfederal judge sentenced each of the"}, {"start": 276.04609523809523, "end": 278.52, "text": "three men to five years of probation."}]}, {"id": "long-047", "sentence": "Each also received twenty-five hundred hours of community service, and the sentences included restitution.", "route": "A", "start": 278.52, "end": 284.56, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/768f96c251de91090af8.png", "focus": "50.0% 55.00000000000001%", "motion": {"cameraStart": 1, "cameraEnd": 1.07}, "spokenStart": 278.52, "spokenEnd": 284.44, "cues": [{"start": 278.52, "end": 282.46666666666664, "text": "Each also received twenty-five hundred\nhours of community service, and"}, {"start": 282.46666666666664, "end": 284.56, "text": "the sentences included restitution."}]}, {"id": "long-048", "sentence": "They had also given up significant amounts of cryptocurrency seized during the investigation, according to the sentencing announcement.", "route": "A", "start": 284.56, "end": 290.72, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [1672, 941], "sourceImageDimensions": [1672, 941], "master": "assets/f4f0abfd51909c479e1c.png", "focus": "50.0% 55.00000000000001%", "motion": {"cameraStart": 1.07, "cameraEnd": 1}, "spokenStart": 284.56, "spokenEnd": 290.6, "cues": [{"start": 284.56, "end": 287.58000000000004, "text": "They had also given up significant\namounts of cryptocurrency seized"}, {"start": 287.58000000000004, "end": 290.72, "text": "during the investigation, according\nto the sentencing announcement."}]}, {"id": "long-049", "sentence": "Continuing to help the FBI with cybercrime and cybersecurity matters became a requirement of their sentences.", "route": "A", "start": 290.72, "end": 296.8, "label": "AI-generated editorial illustration · narrated review draft", "sourceCrop": {"x": 0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceDimensions": [167 function startAudio(){const token=++playEpoch;if(!wantPlay||waitingIndex!==-1||failedIndex!==-1)return;applyPendingSeek();narration.play().then(()=>{if(token!==playEpoch){if(!wantPlay||waitingIndex!==-1)narration.pause();return}if(!wantPlay){narration.pause();return}playing=true;show()}).catch(()=>{if(token!==playEpoch)return;playing=false;wantPlay=false;el('audioHint').textContent='Tap to play narration';show()})}
function prefetch(i){if(prefetchedIndex===i)return;prefetchedIndex=i;const keep=new Set([...sceneKeys(i),...sceneKeys(i+1),...sceneKeys(i+2)]);for(const name of [...sceneKeys(i+1),...sceneKeys(i+2)])loadImage(name,keep).catch(()=>{});trimCache(keep)}
function ensureScene(){const i=sceneIndex(),keys=sceneKeys(i);if(keys.every(k=>decodedAssets[k])){waitingIndex=-1;failedIndex=-1;loadUI.style.display='none';camera.style.visibility='visible';return true}if(waitingIndex===i||failedIndex===i)return false;const epoch=++loadEpoch;waitingIndex=i;++playEpoch;if(playing)wantPlay=true;playing=false;narration.pause();t=Math.min(P.duration,pendingSeek!==null?pendingSeek:(narration.currentTime||t));setAudioTime(t);cancelPending();loadingMessage('Loading this scene…');const keep=new Set(keys);Promise.all(keys.map(k=>loadImage(k,keep))).then(()=>{if(epoch!==loadEpoch)return;waitingIndex=-1;failedIndex=-1;loadUI.style.display='none';camera.style.visibility='visible';draw();prefetch(i);if(wantPlay)startAudio()}).catch(error=>{if(epoch!==loadEpoch)return;waitingIndex=-1;failedIndex=i;playing=false;loadingMessage(error.message,true);show()});return false}

function swapImage(old,name,id){const next=decodedAssets[name];if(!next)throw new Error('Asset not decoded: '+name);if(old!==next){next.id=id;old.removeAttribute('id');old.replaceWith(next)}return next}
let captionFitKey='';function fitCaption(){if(P.aspect!=='9:16')return;const c=el('caption'),key=c.textContent+'|'+stage.clientWidth;if(key===captionFitKey)return;captionFitKey=key;c.style.whiteSpace='pre';let size=Math.max(13,Math.min(29,stage.clientWidth*.052));c.style.fontSize=size+'px';while(c.scrollWidth>c.clientWidth+1&&size>8){size-=.5;c.style.fontSize=size+'px'}}
const narration=new Audio(P.audioData);narration.id='narration';narration.hidden=true;document.body.appendChild(narration);narration.preload='metadata';narration.addEventListener('loadedmetadata',applyPendingSeek);narration.onended=()=>{playing=false;wantPlay=false;t=P.duration;draw()};seek.max=P.duration;function show(){el('bar').classList.remove('hide');clearTimeout(hide);hide=setTimeout(()=>{if(playing&&document.activeElement!==seek)el('bar').classList.add('hide')},2000)}
function lastItem(items){return items&&items[items.length-1]}function lerp(a,b,p){return a+(b-a)*p}function draw(){if(!ready||!ensureScene())return;const s=P.shots.find(x=>t>=x.start&&t<x.end)||P.shots[P.shots.length-1],p=Math.max(0,Math.min(1,(t-s.start)/(s.end-s.start))),q=.8*p+.2*p*p*(3-2*p),m=s.motion||{},reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,r=reduced?0:q;
plate=swapImage(plate,s.route==='B'?s.plate:s.master,'plate');plate.style.objectFit=s.plateFit==='contain'?'contain':'cover';plate.style.objectPosition=s.platePosition||'50% 50%';plate.style.transform=s.plateScale?'scale('+s.plateScale+')':'none';plate.style.transformOrigin='50% 100%';camera.style.transformOrigin=s.focus||'50% 50%';camera.style.transform=`scale(${lerp(m.cameraStart||1,m.cameraEnd||1,r)})`;
if(s.route==='B'){actor.style.display='block';subject=swapImage(subject,s.foreground,'subject');const v=s.placement;actor.style.left=v.left+'%';actor.style.top=v.top+'%';actor.style.width=v.width+'%';actor.style.transformOrigin=v.anchorX+'% '+v.anchorY+'%';actor.style.transform=`translate(${(m.dxScene||0)*stage.clientWidth*r}px,${(m.dyScene||0)*stage.clientHeight*r}px) rotate(${m.oscillateDegrees?(reduced?0:m.oscillateDegrees*Math.sin(2*Math.PI*(t-s.start)/(m.oscillatePeriodSeconds||5))):lerp(m.rotateStart||0,m.rotateEnd||0,r)}deg) scale(${lerp(m.scaleStart||1,m.scaleEnd||1,r)})`;const z=s.annotation;annotation.textContent=lastItem(z?.frames?.filter(f=>p>=f.atProgress))?.text||z?.text||'';if(z){annotation.style.left=z.left+'%';annotation.style.top=z.top+'%';annotation.style.width=z.width+'%';annotation.style.fontSize=(z.fontScene*stage.clientWidth)+'px';annotation.style.color=z.color||'#402e1c';annotation.style.textShadow=z.shadow||'none';annotation.style.background=z.backing||'';annotation.style.padding=z.backing?'.3em .4em':''}
if(z?.items){annotation.replaceChildren();annotation.style.left='0';annotation.style.top='0';annotation.style.width='100%';for(const item of z.items){const span=document.createElement('span');span.textContent=item.text;Object.assign(span.style,{position:'absolute',left:item.left+'%',top:item.top+'%',width:item.width+'%',fontSize:(item.fontScene*stage.clientWidth)+'px'});annotation.appendChild(span)}annotation.style.height='100%'}else{annotation.style.height='auto'}
}else{actor.style.display='none';actor.style.transform='none';annotation.textContent=''}
const sa=el('stageAnnotation');sa.replaceChildren();for(const item of (s.stageAnnotation?.items||[])){const node=document.createElement('span');node.textContent=item.text;Object.assign(node.style,{position:'absolute',left:item.left+'%',top:item.top+'%',width:item.width+'%',fontSize:(item.fontScene*stage.clientWidth)+'px',color:item.color||'#172c3b',background:item.backing||'',padding:'.2em'});sa.appendChild(node)}el('gradient').style.background=s.lowerGradient?'linear-gradient(transparent 48%,#080b11e8 61%,#080b11 100%)':'';const cp=s.captionPosition;el('caption').style.left=cp?cp.left+'%':'';el('caption').style.bottom=cp?cp.bottom+'%':'';el('caption').style.width=cp?cp.width+'%':'';const cues=s.cues||[{start:s.start,end:s.end,text:s.sentence}];el('caption').textContent=(cues.find(c=>t>=c.start&&t<c.end)||((P.holdFinalFrame??P.completeLongForm)&&t>=P.duration?cues[cues.length-1]:{})).text||'';fitCaption();el('label').textContent=s.label||'Illustrated reconstruction · preparing narration';el('label').style.background=s.labelBacking?'#080b11cc':'';el('label').style.padding=s.labelBacking?'.35em .5em':'';el('audioHint').textContent=t>=P.duration?'Ended · Click to replay':playing?'Playing narration · Click to pause':'Paused · Click or Space to play narration';prefetch(sceneIndex());seek.value=t;el('end').style.display=t>=P.duration&&!(P.holdFinalFrame??P.completeLongForm)?'grid':'none'}
function jump(v){++loadEpoch;++playEpoch;waitingIndex=-1;failedIndex=-1;prefetchedIndex=-1;cancelPending();t=Math.max(0,Math.min(P.duration,v));setAudioTime(t);if(t>=P.duration){playing=false;wantPlay=false;narration.pause()}draw();if(wantPlay&&!playing&&waitingIndex===-1&&failedIndex===-1)startAudio();show()}function toggle(){if(t>=P.duration){jump(0)}wantPlay=!wantPlay;if(!wantPlay){++playEpoch;narration.pause();playing=false}else if(ensureScene())startAudio();show();draw()}

stage.onclick=e=>{if(!e.target.closest('#bar,#loading'))toggle()};seek.oninput=()=>jump(+seek.value);stage.onpointermove=show;window.onresize=draw;document.onkeydown=e=>{if(['Space','ArrowLeft','ArrowRight','Home','End'].includes(e.code))e.preventDefault();if(e.code==='Space')toggle();if(e.code==='ArrowLeft')jump(t-5);if(e.code==='ArrowRight')jump(t+5);if(e.code==='Home')jump(0);if(e.code==='End')jump(P.duration);if(e.code==='KeyF'){if(!document.fullscreenElement)stage.requestFullscreen?.();else document.exitFullscreen?.()}};
function frame(now){if(playing){t=Math.min(P.duration,narration.currentTime);if(t>=P.duration)playing=false;draw()}last=now;requestAnimationFrame(frame)}window.motionQA={seek:jump,state:()=>({time:t,playing,duration:P.duration,shot:P.shots.find(s=>t>=s.start&&t<s.end)?.id,subjectTransform:actor.style.transform,cameraTransform:camera.style.transform})};ready=true;playing=false;wantPlay=false;ensureScene();show();requestAnimationFrame(frame);
