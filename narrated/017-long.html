 "cues": [{"start": 163.76, "end": 168.06328358208955, "text": "Totenberg continued teaching for\ndecades after the theft, and Boston"}, {"start": 168.06328358208955, "end": 172.24, "text": "University honoured that work with\nits top teaching award in 1996."}]}, {"id": "long-025", "sentence": "The university's account of his life described lasting relationships with students, some of whom became leading performers themselves.", "route": "A", "start": 172.24, "end": 179.56, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/d7e97019dae8fafe9e3d.png", "spokenStart": 172.24, "spokenEnd": 178.64, "cues": [{"start": 172.24, "end": 175.98255639097744, "text": "The university's account of his\nlife described lasting relationships"}, {"start": 175.98255639097744, "end": 179.56, "text": "with students, some of whom became\nleading performers themselves."}]}, {"id": "long-026", "sentence": "He died in May 2012, with the missing violin still absent from his life.", "route": "B", "start": 179.56, "end": 184.28, "sourceCrop": {"x": 0.0, "y": 0.53125, "width": 1671, "height": 939.9375}, "sourceImageDimensions": [1670, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1.03, "cameraEnd": 1.03, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.795566521956445, "anchorX": 50.0, "anchorY": 94.45933869526363}, "spokenStart": 179.56, "spokenEnd": 183.66, "cues": [{"start": 179.56, "end": 184.28, "text": "He died in May 2012, with the missing\nviolin still absent from his life."}]}, {"id": "long-027", "sentence": "Jill iming to settle every later question about the case.", "route": "A", "start": 297.98, "end": 305.88, "sourceCrop": {"x": 560.0, "y": 130.0, "width": 960, "height": 540.0}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/d7e97019dae8fafe9e3d.png", "spokenStart": 297.98, "spokenEnd": 305.3, "cues": [{"start": 297.98, "end": 301.61741007194246, "text": "That dated report is a reason to\ndistinguish the recovery from a"}, {"start": 301.61741007194246, "end": 305.5958273381295, "text": "prosecution, without claiming to\nsettle every later question about the"}, {"start": 305.5958273381295, "end": 305.88, "text": "case."}]}, {"id": "long-044", "sentence": "In her interview after the return, Nina described the instrument's beauty and the feeling of a connection with both her father and her mother.", "route": "B", "start": 305.88, "end": 313.84, "sourceCrop": {"x": 0.0, "y": 0.53125, "width": 1671, "height": 939.9375}, "sourceImageDimensions": [1670, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/1753b3104c514b01ef1f.webp", "foreground": "assets/361f06b8ca147eecd83a.webp", "placement": {"left": 21.343418607043862, "top": 16.96740390887389, "width": 56.795566521956445, "anchorX": 50.0, "anchorY": 94.45933869526363}, "spokenStart": 305.88, "spokenEnd": 313.3, "cues": [{"start": 305.88, "end": 309.6325714285714, "text": "In her interview after the return,\nNina described the instrument's"}, {"start": 309.6325714285714, "end": 313.44199999999995, "text": "beauty and the feeling of a connection\nwith both her father and her"}, {"start": 313.44199999999995, "end": 313.84, "text": "mother."}]}, {"id": "long-045", "sentence": "Her response placed the recovered violin within a family history, rather than treating the ceremony simply as the return of a valuable possession.", "route": "A", "start": 313.84, "end": 321.96, "sourceCrop": {"x": 500.0, "y": 70.125, "width": 1100, "height": 618.75}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/5b1de215b4379aaf7722.png", "spokenStart": 313.84, "spokenEnd": 321.32, "cues": [{"start": 313.84, "end": 317.9, "text": "Her response placed the recovered\nviolin within a family history, rather"}, {"start": 317.9, "end": 321.3397222222222, "text": "than treating the ceremony simply\nas the return of a valuable"}, {"start": 321.3397222222222, "end": 321.96, "text": "possession."}]}, {"id": "long-046", "sentence": "Jill told ABC that the family planned restoration and hoped to find a musician who could play the instrument again.", "route": "A", "start": 321.96, "end": 328.04, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1.06, "cameraEnd": 1}, "master": "assets/cbc01a5b869ce74197c8.png", "spokenStart": 321.96, "spokenEnd": 327.48, "cues": [{"start": 321.96, "end": 325.64, "text": "Jill told ABC that the family planned\nrestoration and hoped to find a"}, {"start": 325.64, "end": 328.04, "text": "musician who could play\nthe instrument again."}]}, {"id": "long-047", "sentence": "That was their hope at the time, not proof in this account of a later concert or a particular future owner.", "route": "B", "start": 328.04, "end": 334.08, "sourceCrop": {"x": 0.0, "y": 0.53125, "width": 1671, "height": 939.9375}, "sourceImageDimensions": [1670, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1,
