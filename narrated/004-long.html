rson to attach them to."}], "id": "scene-18"}, {"sentence": "A CIA historical study describes the message as unreadable until information became available from a defector four years later.", "start": 74.08, "end": 82.36, "captionGroups": ["A CIA historical study describes", "the message as unreadable", "until information became available", "from a defector four years later."], "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-019-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 74.08, "spokenEnd": 82.24, "cues": [{"start": 74.08, "end": 76.1858064516129, "text": "A CIA historical study describes"}, {"start": 76.1858064516129, "end": 77.83096774193548, "text": "the message as unreadable"}, {"start": 77.83096774193548, "end": 80.06838709677419, "text": "until information became available"}, {"start": 80.06838709677419, "end": 82.36, "text": "from a defector four years later."}], "id": "scene-19"}, {"sentence": "The important gap was not between finding the coin and opening it.", "start": 82.36, "end": 86.2, "captionGroups": ["The important gap was not between", "finding the coin and opening it."], "label": "AI illustration · silent visual draft", "route": "B", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5, "cameraStart": 1, "cameraEnd": 1, "scaleStart": 1, "scaleEnd": 1}, "spokenStart": 82.36, "spokenEnd": 86.08, "cues": [{"start": 82.36, "end": 84.24861538461538, "text": "The important gap was not between"}, {"start": 84.24861538461538, "end": 86.2, "text": "finding the coin and opening it."}], "id": "scene-20"}, {"sentence": "It was between finding the message and understanding it.", "start": 86.2, "end": 89.64, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-021-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 86.2, "spokenEnd": 89.52, "cues": [{"start": 86.2, "end": 89.64, "text": "It was between finding the\nmessage and understanding it."}], "id": "scene-21"}, {"sentence": "The photograph survived that gap.", "start": 89.64, "end": 91.64, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-022-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 89.64, "spokenEnd": 91.52, "cues": [{"start": 89.64, "end": 91.64, "text": "The photograph survived that gap."}], "id": "scene-22"}, {"sentence": "When the missing knowledge finally arrived, investigators still had the original problem waiting to be solved.", "start": 91.64, "end": 97.28, "label": "AI illustration · silent visual draft", "route": "B", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5, "cameraStart": 1, "cameraEnd": 1, "scaleStart": 1, "scaleEnd": 1}, "spokenStart": 91.64, "spokenEnd": 97.16, "cues": [{"start": 91.64, "end": 95.23559633027523, "text": "When the missing knowledge finally\narrived, investigators still had the"}, {"start": 95.23559633027523, "end": 97.28, "text": "original problem waiting to be solved."}], "id": "scene-23"}, {"sentence": "In May nineteen fifty-seven, Reino Hayhanen contacted the American embassy in Paris.", "start": 97.28, "end": 102.84, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-024-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 97.28, "spokenEnd": 102.72, "cues": [{"start": 97.28, "end": 101.31415730337079, "text": "In May nineteen fifty-seven, Reino\nHayhanen contacted the American"}, {"start": 101.31415730337079, "end": 102.84, "text": "embassy in Paris."}], "id": "scene-24"}, {"sentence": "He had worked for Soviet intelligence in the United States and had been ordered back to Moscow.", "start": 102.84, "end": 107.76, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-025-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 102.84, "spokenEnd": 107.64, "cues": [{"start": 102.84, "end": 106.46553191489362, "text": "He had worked for Soviet intelligence\nin the United States and had been"}, {"start": 106.46553191489362, "end": 107.76, "text": "ordered back to Moscow."}], "id": "scene-25"}, {"sentence": "Instead, he sought to defect.", "start": 107.76, "end": 110.16, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-026-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 107.76, "spokenEnd": 110.04, "cues": [{"start": 107.76, "end": 110.16, "text": "Instead, he sought to defect."}], "id": "scene-26"}, {"sentence": "His information gave American investigators something the nickel itself could never provide: knowledge from inside the organization.", "start": 110.16, "end": 117.0, "label": "AI illustration · silent visual draft", "route": "B", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5, "cameraStart": 1, "cameraEnd": 1, "scaleStart": 1, "scaleEnd": 1}, "spokenStart": 110.16, "spokenEnd": 116.88, "cues": [{"start": 110.16, "end": 113.80213740458015, "text": "His information gave American\ninvestigators something the nickel itself"}, {"start": 113.80213740458015, "end": 117.0, "text": "could never provide: knowledge\nfrom inside the organization."}], "id": "scene-27"}, {"sentence": "He helped them understand the message and supplied information about h : "assets/new-style-v4/nickel-031-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 132.24, "spokenEnd": 136.56, "cues": [{"start": 132.24, "end": 135.46813186813188, "text": "The decoded message was not a list\nof targets or a confession naming"}, {"start": 135.46813186813188, "end": 136.68, "text": "every spy."}], "id": "scene-31"}, {"sentence": "Its opening welcomed the recipient after his arrival.", "start": 136.68, "end": 139.92, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-032-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 136.68, "spokenEnd": 139.8, "cues": [{"start": 136.68, "end": 139.92, "text": "Its opening welcomed the\nrecipient after his arrival."}], "id": "scene-32"}, {"sentence": "It belonged to the routine correspondence of an intelligence operation, rather than the dramatic warning a viewer might expect.", "start": 139.92, "end": 146.72, "label": "AI illustration · silent visual draft", "route": "B", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5, "cameraStart": 1, "cameraEnd": 1, "scaleStart": 1, "scaleEnd": 1}, "spokenStart": 139.92, "spokenEnd": 146.6, "cues": [{"start": 139.92, "end": 143.68412698412698, "text": "It belonged to the routine correspondence\nof an intelligence operation,"}, {"start": 143.68412698412698, "end": 146.72, "text": "rather than the dramatic\nwarning a viewer might expect."}], "id": "scene-33"}, {"sentence": "But its meaning now connected an unexplained object to a real network.", "start": 146.72, "end": 150.68, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-034-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 146.72, "spokenEnd": 150.56 ent": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5, "cameraStart": 1, "cameraEnd": 1, "scaleStart": 1, "scaleEnd": 1}, "spokenStart": 164.24, "spokenEnd": 167.56, "cues": [{"start": 164.24, "end": 167.68, "text": "The case name was another\nidentity, not his original name."}], "id": "scene-38"}, {"sentence": "In June nineteen fifty-seven, he was taken into custody.", "start": 167.68, "end": 171.44, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-039-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 167.68, "spokenEnd": 171.32, "cues": [{"start": 167.68, "end": 171.44, "text": "In June nineteen fifty-seven,\nhe was taken into custody."}], "id": "scene-39"}, {"sentence": "His initial arrest was under an immigration warrant, a distinction that later mattered in court.", "start": 171.44, "end": 176.32, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-040-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 171.44, "spokenEnd": 176.2, "cues": [{"start": 171.44, "end": 174.99747368421052, "text": "His initial arrest was under an\nimmigration warrant, a distinction that"}, {"start": 174.99747368421052, "end": 176.32, "text": "later mattered in court."}], "id": "scene-40"}, {"sentence": "Items seized by government officers became evidence in the espionage prosecution.", "start": 176.32, "end": 181.0, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-041-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 176.32, "spokenEnd": 180.88, "cues": [{"start": 176.32, "end": 178.3675, "text": "Items seized by\ngovernment officers"}, {"start": 178.3675, "end": 181.0, "text": "became evidence in the\nespionage prosecution."}], "id": "scene-41"}, {"sentence": "A jury convicted him on three conspiracy counts in October.", "start": 181.0, "end": 184.6, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-042-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 181.0, "spokenEnd": 184.48, "cues": [{"start": 181.0, "end": 184.6, "text": "A jury convicted him on three\nconspiracy counts in October."}], "id": "scene-42"}, {"sentence": "The charges concerned defense information and acting as an agent of a foreign government without the required notification.", "start": 184.6, "end": 190.88, "label": "AI illustration · silent visual draft", "route": "B", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5, "cameraStart": 1, "cameraEnd": 1, "scaleStart": 1, "scaleEnd": 1}, "spokenStart": 184.6, "spokenEnd": 190.76, "cues": [{"start": 184.6, "end": 188.0839344262295, "text": "The charges concerned defense\ninformation and acting as an agent of a"}, {"start": 188.0839344262295, "end": 190.88, "text": "foreign government without\nthe required notification."}], "id": "scene-43"}, {"sentence": "In November, the judge imposed prison terms of thirty years, ten years, and five years.", "start": 190.88, "end": 196.08, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-044-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 190.88, "spokenEnd": 195.96, "cues": [{"start": 190.88, "end": 194.71702127659574, "text": "In November, the judge imposed prison\nterms of thirty years, ten years,"}, {"start": 194.71702127659574, "end": 196.08, "text": "and five years."}], "id": "scene-44"}, {"sentence": "Those terms ran together, not one after another.", "start": 196.08, "end": 199.36, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-045-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 196.08, "spokenEnd": 199.24, "cues": [{"start": 196.08, "end": 199.36, "text": "Those terms ran together,\nnot one after another."}], "id": "scene-45"}, {"sentence": "The prison sentence was thirty years, not forty-five.", "start": 199.36, "end": 202.6, "label": "AI illustration · silent visual draft", "route": "B", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5, "cameraStart": 1, "cameraEnd": 1, "scaleStart": 1, "scaleEnd": 1}, "spokenStart": 199.36, "spokenEnd": 202.48, "cues": [{"start": 199.36, "end": 202.6, "text": "The prison sentence was\nthirty years, not forty-five."}], "id": "scene-46"}, {"sentence": "There were also fines totaling three thousand dollars.", "start": 202.6, "end": 205.52, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-047-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 202.6, "spokenEnd": 205.4, "cues": [{"start": 202.6, "end": 205.52, "text": "There were also fines totaling\nthree thousand dollars."}], "id": "scene-47"}, {"sentence": "The defense challenged the use of evidence obtained without a search warrant.", "start": 205.52, "end": 208.76, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-048-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 205.52, "spokenEnd": 208.64, "cues": [{"start": 205.52, "end": 206.92684210526315, "text": "The defense challenged\nthe use of"}, {"start": 206.92684210526315, "end": 208.76, "text": "evidence obtained without\na search warrant."}], "id": "scene-48"}, {"sentence": "The issue reached the United States Supreme Court.", "start": 208.76, "end": 211.6, "label": "AI illustration · silent visual draft", "route": "B", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5, "cameraStart": 1, "cameraEnd": 1, "scaleStart": 1, "scaleEnd": 1}, "spokenStart": 208.76, "spokenEnd": 211.48, "cues": [{"start": 208.76, "end": 211.6, "text": "The issue reached the\nUnited States Supreme Court."}], "id": "scene-49"}, {"sentence": "Being accused of espionage did not remove the question of whether the government had lawfully obtained its evidence.", "start": 211.6, "end": 217.76, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-050-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 211.6, "spokenEnd": 217.64, "cues": [{"start": 211.6, "end": 215.224, "text": "Being accused of espionage did not\nremove the question of whether the"}, {"start": 215.224, "end": 217.76, "text": "government had lawfully\nobtained its evidence."}], "id": "scene-50"}, {"sentence": "In March nineteen sixty, the Court affirmed the judgment.", "start": 217.76, "end": 221.2, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-051-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 217.76, "spokenEnd": 221.08, "cues": [{"start": 217.76, "end": 221.2, "text": "In March nineteen sixty, the\nCourt affirmed the judgment."}], "id": "scene-51"}, {"sentence": "The majority concluded that the challenged items had been properly admitted in this case.", "start": 221.2, "end": 225.36, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-052-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 221.2, "spokenEnd": 225.24, "cues": [{"start": 221.2, "end": 224.19595505617977, "text": "The majority concluded that the\nchallenged items had been properly"}, {"start": 224.19595505617977, "end": 225.36, "text": "admitted in this case."}], "id": "scene-52"}, {"sentence": "That was a judicial decision about the searches before it, not a claim that every search in an espionage investigation is lawful.", "start": 225.36, "end": 232.04, "label": "AI illustration · silent visual draft", "route": "B", "plate": "assets/narrator-neutral-clean-plate.png", "foreground": "assets/narrator-foreground.png", "placement": {"left": 0, "top": 0, "width": 100, "anchorX": 49.94, "anchorY": 92.67}, "motion": {"oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5, "cameraStart": 1, "cameraEnd": 1, "scaleStart": 1, "scaleEnd": 1}, "spokenStart": 225.36, "spokenEnd": 231.92, "cues": [{"start": 225.36, "end": 228.9475, "text": "That was a judicial decision about\nthe searches before it, not a claim"}, {"start": 228.9475, "end": 232.04, "text": "that every search in an espionage\ninvestigation is lawful."}], "id": "scene-53"}, {"sentence": "The conviction stood, but another decision would eventually take Abel out of American prison.", "start": 232.04, "end": 237.0, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/new-style-v4/nickel-054-master.png", "motion": {"cameraStart": 1, "cameraEnd": 1}, "spokenStart": 232.04, "spokenEnd": 236.88, "cues": [{"start": 232.04, "end": 235.67, "text": "The conviction stood, but another\ndecision would eventually take Abel"}, {"start": 235.67, "end": 237.0, "text": "out of American prison."}], "id": "scene-54"}, {"sentence": "On February tenth, nineteen sixty-two, Abel was exchanged for American U-2 pilot Francis Gary Powers.", "start": 237.0, "end": 243.28, "label": "AI illustration · silent visual draft", "route": "A", "master": "assets/continuity-v5/bridge-exchange-landscape.png", "motion": {"cameraStart": 1, "cameraEnd": 1.04}, "platePosition": "50% 50%",
