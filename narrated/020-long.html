ing", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 3.0, "top": 1.9234856535600426, "width": 94.0, "anchorX": 47.84688995215311, "anchorY": 92.98618490967057}, "plateLayout": {"left": 0, "top": 0, "width": 100, "height": 100}, "captionGroups": ["The mayor had not known that account existed, and he reported the matter", "to law enforcement."], "spokenStart": 103.66, "spokenEnd": 108.32, "cues": [{"start": 103.66, "end": 107.85340659340659, "text": "The mayor had not known that account\nexisted, and he reported the matter"}, {"start": 107.85340659340659, "end": 108.96, "text": "to law enforcement."}]}, {"id": "long-016", "sentence": "The important step was a person checking records and raising a question, rather than accepting the familiar explanation for the city's shortages.", "route": "A", "start": 108.96, "end": 116.3, "sourceCrop": {"x": 0.0, "y": 0.225, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "88.0% 45.0%", "motion": {"cameraStart": 1.18, "cameraEnd": 1.2508}, "master": "assets/e4eb0962aa9e926b9e75.png", "captionGroups": ["The important step was a person checking records and raising a question,", "rather than accepting the familiar explanation for the city's shortages."], "spokenStart": 108.96, "spokenEnd": 115.54, "cues": [{"start": 108.96, "end": 112.63, "text": "The important step was a person\nchecking records and raising a question,"}, {"start": 112.63, "end": 116.3, "text": "rather than accepting the familiar\nexplanation for the city's shortages."}]}, {"id": "long-017", "sentence": "The FBI examined recent bank statements and widened its investigation into earlier years of the city's finances.", "route": "A", "start": 116.3, "end": 122.66, "sourceCrop": {"  on April 17, 2012, and pleaded guilty to wire fraud on November 14 of that year.", "route": "A", "start": 128.26, "end": 136.22, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/178a202abb8fd31962b5.png", "captionGroups": ["Crundwell was arrested on April 17, 2012, and pleaded guilty to wire", "fraud on November 14 of that year."], "spokenStart": 128.26, "spokenEnd": 135.64, "cues": [{"start": 128.26, "end": 133.56666666666666, "text": "Crundwell was arrested on April 17,\n2012, and pleaded guilty to wire"}, {"start": 133.56666666666666, "end": 136.22, "text": "fraud on November 14 of that year."}]}, {"id": "long-020", "sentence": "The case had moved from a troubling set of records to an admitted crime, with the city identified as the victim of the stolen funds.", "route": "B", "start": 136.22, "end": 143.64, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 3.0, "top": 1.9234856535600426, "width": 94.0, "anchorX": 47.84688995215311, "anchorY": 92.98618490967057}, "plateLayout": {"left": 0, "top": 0, "width": 100, "height": 100}, "captionGroups": ["The case had moved from a troubling set of records to an admitted crime,", "with the city identified as the victim of the stolen funds."], "spokenStart": 136.22, "spokenEnd": 142.92, "cues": [{"start": 136.22, "end": 140.2981679389313, "text": "The case had moved from a troubling\nset of records to an admitted crime,"}, {"start": 140.2981679389313, "end": 143.64, "text": "with the city identified as\nthe victim of the stolen funds."}]}, {"id": "long-021", "sentence": "On February 14, 2013, a federal judge in Rockford sentenced her to nineteen years and seven months in prison.", "route": "A", "start": 143.64, "end": 150.76, "sourceCrop": {"x": 0.0, "y": 0.225, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 45.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/f833cf157f4bf6cfedfd.png", "captionGroups": ["On February 14, 2013, a federal judge in Rockford sentenced her to", "nineteen years and seven months in prison."], "spokenStart": 143.64, "spokenEnd": 150.14, "cues": [{"start": 143.64, "end": 147.9911111111111, "text": "On February 14, 2013, a federal\njudge in Rockford sentenced her to"}, {"start": 147.9911111111111, "end": 150.76, "text": "nineteen years and\nseven months in prison."}]}, {"id": "long-022", "sentence": "The judge also found harm beyond the financial loss, including damage to public confidence and disruption of the city's ability to provide essential services.", "route": "A", "start": 150.76, "end": 159.58, "sourceCrop": {"x": 0.0, "y": 0.275, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "55.00000000000001% 55.00000000000001%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/d3b034a2d916a9f17b44.png", "captionGroups": ["The judge also found harm beyond the financial loss, including damage to", "public confidence and disruption of the city's ability to provide", "essential services."], "spokenStart": 150.76, "spokenEnd": 158.9, "cues": [{"start": 150.76, "end": 154.83076923076922, "text": "The judge also found harm beyond the\nfinancial loss, including damage to"}, {"start": 154.83076923076922, "end": 158.50576923076923, "text": "public confidence and disruption\nof the city's ability to provide"}, {"start": 158.50576923076923, "end": 159.58, "text": "essential services."}]}, {"id": "long-023", "sentence": "The court ordered restitution of fifty-three million, seven hundred forty thousand, three hundred ninety-four dollars, as well as a separate forfeiture judgment in the same amount.", "route": "B", "start": 159.58, "end": 168.24, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 3.0, "top": 1.9234856535600426, "width": 94.0, "anchorX": 47.84688995215311, "anchorY": 92.98618490967057}, "plateLayout": {"left": 0, "top": 0, "width": 100, "height": 100}, "captionGroups": ["The court ordered restitution of fifty-three million, seven hundred", "forty thousand, three hundred ninety-four dollars, as well as a separate", "forfeiture judgment in the same amount."], "spokenStart": 159.58, "spokenEnd": 167.68, "cues": [{"start": 159.58, "end": 162.83966292134832, "text": "The court ordered restitution of\nfifty-three million, seven hundred"}, {"start": 162.83966292134832, "end": 166.34258426966292, "text": "forty thousand, three hundred ninety-four\ndollars, as well as a separate"}, {"start": 166.34258426966292, "end": 168.24, "text": "forfeiture judgment\nin the same amount."}]}, {"id": "long-024", "sentence": "Those orders created legal obligations, but their existence did not mean that amount of cash had already reached the city.", "route": "A", "start": 168.24, "end": 175.38, "sourceCrop": {"x": 0.0, "y": 0.37, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "40.0% 74.0%", "motion": {"cameraStart": 1.15, "cameraEnd": 1.219}, "master": "assets/f9a5219cb4ac3a53205d.png", "captionGroups": ["Those orders created legal obligations, but their existence did not mean", "that amount of cash had already reached the city."], "spokenStart": 168.24, "spokenEnd": 174.84, "cues": [{"start": 168.24, "end": 172.48859504132233, "text": "Those orders created legal obligations,\nbut their existence did not mean"}, {"start": 172.48859504132233, "end": 175.38, "text": "that amount of cash had\nalready reached the city."}]}, {"id": "long-025", "sentence": "The federal appeals court affirmed her sentence on November 15, 2013, leaving that sentencing decision in place.", "route": "A", "start": 175.38, "end": 182.52, "sourceCrop": {"x": 0.0, "y": 0.2, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 40.0%", "motion": {"cameraStart": 1.1, "cameraEnd": 1.166}, "master": "assets/178a202abb8fd31962b5.png", "captionGroups": ["The federal appeals court affirmed her sentence on November 15, 2013,", "leaving that sentencing decision in place."], "spokenStart": 175.38, "spokenEnd": 181.94, "cues": [{"start": 175.38, "end": 179.81837837837838, "text": "The federal appeals court affirmed\nher sentence on November 15, 2013,"}, {"start": 179.81837837837838, "end": 182.52, "text": "leaving that sentencing\ndecision in place."}]}, {"id": "long-026", "sentence": "By sentencing, assets acquired with the proceeds were being sold, while the net proceeds were held in escrow pending further proceedings.", "route": "A", "start": 182.52, "end": 190.3, "sourceCrop": {"x": 0.0, "y": 0.24, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "67.0% 48.0%", "motion": {"cameraStart": 1.06, "cameraEnd": 1}, "master": "assets/e969e4bf5c4ffe069506.png", "captionGroups": ["By sentencing, assets acquired with the proceeds were being sold, while", "the net proceeds were held in escrow pending further proceedings."], "spokenStart": 182.52, "spokenEnd": 189.4, "cues": [{"start": 182.52, "end": 186.58161764705883, "text": "By sentencing, assets acquired with\nthe proceeds were being sold, while"}, {"start": 186.58161764705883, "end": 190.3, "text": "the net proceeds were held in\nescrow pending further proceedings."}]}, {"id": "long-027", "sentence": "A later federal announcement supplies a clearer payment result: approximately nine point two million dollars in net proceeds was restored to Dixon in December 2013.", "route": "B", "start": 190.3, "end": 199.58, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 3.0, "top": 1.9234856535600426, "width": 94.0, "anchorX": 47.84688995215311, "anchorY": 92.98618490967057}, "plateLayout": {"left": 0, "top": 0, "width": 100, "height": 100}, "captionGroups": ["A later federal announcement supplies a clearer payment result:", "approximately nine point two million dollars in net proceeds was", "restored to Dixon in December 2013."], "spokenStart": 190.3, "spokenEnd": 198.76, "cues": [{"start": 190.3, "end": 193.9088888888889, "text": "A later federal announcement\nsupplies a clearer payment result:"}, {"start": 193.9088888888889, "end": 197.57506172839507, "text": "approximately nine point two\nmillion dollars in net proceeds was"}, {"start": 197.57506172839507, "end": 199.58, "text": "restored to Dixon in December 2013."}]}, {"id": "long-028", "sentence": "That was money returned to the city, rather than simply a valuation of seized property or a promise of future collection.", "route": "A", "start": 199.58, "end": 206.42, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "38.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/e4eb0962aa9e926b9e75.png", "captionGroups": ["That was money returned to the city, rather than simply a valuation of", "seized property or a promise of future collection."], "spokenStart": 199.58, "spokenEnd": 205.7, "cues": [{"start": 199.58, "end": 203.57, "text": "That was money returned to the city,\nrather than simply a valuation of"}, {"start": 203.57, "end": 206.42, "text": "seized property or a promise\nof future collection."}]}, {"id": "long-029", "sentence": "In a 2015 order, the district court explained that restitution and forfeiture were separate legal matters, not alternatives that automatically replaced one another.", "route": "A", "start": 206.42, "end": 215.54, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "55.00000000000001% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1.06}, "master": "assets/e476f7005da7dfc9cb22.png", "captionGroups": ["In a 2015 order, the district court explained that restitution and", "forfeiture were separate legal matters, not alternatives that", "automatically replaced one another."], "spokenStart": 206.42, "spokenEnd": 214.98, "cues": [{"start": 206.42, "end": 210.13555555555556, "text": "In a 2015 order, the district court\nexplained that restitution and"}, {"start": 210.13555555555556, "end": 213.56962962962962, "text": "forfeiture were separate legal\nmatters, not alternatives that"}, {"start": 213.56962962962962, "end": 215.54, "text": "automatically replaced one another."}]}, {"id": "long-030", "sentence": "Following the money therefore requires checking what was ordered, what was sold and what was actually restored, instead of treating every announced figure as another payment.", "route": "B", "start": 215.54, "end": 224.58, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 3.0, "top": 1.9234856535600426, "width": 94.0, "anchorX": 47.84688995215311, "anchorY": 92.98618490967057}, "plateLayout": {"left": 0, "top": 0, "width": 100, "height": 100}, "captionGroups": ["Following the money therefore requires checking what was ordered, what", "was sold and what was actually restored, instead of treating every", "announced figure as another payment."], "spokenStart": 215.54, "spokenEnd": 223.84, "cues": [{"start": 215.54, "end": 219.21906976744185, "text": "Following the money therefore requires\nchecking what was ordered, what"}, {"start": 219.21906976744185, "end": 222.6879069767442, "text": "was sold and what was actually\nrestored, instead of treating every"}, {"start": 222.6879069767442, "end": 224.58, "text": "announced figure as another payment."}]}, {"id": "long-031", "sentence": "In May 2020, Dixon reported that it had recovered approximately forty million dollars of the money stolen.", "route": "A", "start": 224.58, "end": 230.72, "sourceCrop": {"x": 0.0, "y": 0.2, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "57.99999999999999% 40.0%", "motion": {"cameraStart": 1.18, "cameraEnd": 1.2508}, "master": "assets/09c8701959a6302c5470.png", "captionGroups": ["In May 2020, Dixon reported that it had recovered approximately forty", "million dollars of the money stolen."], "spokenStart": 224.58, "spokenEnd": 230.08, "cues": [{"start": 224.58, "end": 228.61485714285715, "text": "In May 2020, Dixon reported that it\nhad recovered approximately forty"}, {"start": 228.61485714285715, "end": 230.72, "text": "million dollars of the money stolen."}]}, {"id": "long-032", "sentence": "That was the city's combined, rounded recovery statement at that date, not an additional forty million dollars to stack on top of earlier recovery figures.", "route": "B", "start": 230.72, "end": 238.98, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 3.0, "top": 1.9234856535600426, "width": 94.0, "anchorX": 47.84688995215311, "anchorY": 92.98618490967057}, "plateLayout": {"left": 0, "top": 0, "width": 100, "height": 100}, "captionGroups": ["That was the city's combined, rounded recovery statement at that date,", "not an additional forty million dollars to stack on top of earlier", "recovery figures."], "spokenStart": 230.72, "spokenEnd": 238.4, "cues": [{"start": 230.72, "end": 234.49908496732024, "text": "That was the city's combined, rounded\nrecovery statement at that date,"}, {"start": 234.49908496732024, "end": 238.0622222222222, "text": "not an additional forty million\ndollars to stack on top of earlier"}, {"start": 238.0622222222222, "end": 238.98, "text": "recovery figures."}]}, {"id": "long-033", "sentence": "The city also emphasized that delayed recovery could not buy the same public benefits the money might have funded ten or twenty years earlier.", "route": "A", "start": 238.98, "end": 247.16, "sourceCrop": {"x": 0.0, ded it."}]}, {"id": "long-035", "sentence": "Crundwell's name appeared on the Justice Department's list of people receiving commutations on December 12, 2024.", "route": "A", "start": 254.04, "end": 260.88, "sourceCrop": {"x": 0.0, "y": 0.275, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 55.00000000000001%", "motion": {"cameraStart": 1.06, "cameraEnd": 1}, "master": "assets/178a202abb8fd31962b5.png", "captionGroups": ["Crundwell's name appeared on the Justice Department's list of people", "receiving commutations on December 12, 2024."], "spokenStart": 254.04, "spokenEnd": 260.12, "cues": [{"start": 254.04, "end": 258.1928571428571, "text": "Crundwell's name appeared on the\nJustice Department's list of people"}, {"start": 258.1928571428571, "end": 260.88, "text": "receiving commutations\non December 12, 2024."}]}, {"id": "long-036", "sentence": "The signed presidential warrant set Crundwell's sentence of confinement to expire on December 22, 2024.", "route": "B", "start": 260.88, "end": 267.6, "sourceCrop": {"x": 0.0, "y": 0.25, "width": 1672, "height": 940.5}, "sourceImageDimensions": [1672, 941], "label": "AI illustration · ASR-timed draft · boundary review pending", "focus": "50.0% 50.0%", "motion": {"cameraStart": 1, "cameraEnd": 1, "oscillateDegrees": 0.6, "oscillatePeriodSeconds": 5}, "plate": "assets/853d7681f788c98b6110.png", "foreground": "assets/0debde6302a8e4834323.png", "placement": {"left": 3.0, "top": 1.9234856535600426, "width": 94.0, "anchorX": 47.84688995215311, "anchorY": 92.98618490967057}, "plateLayout": {"left": 0, "top": 0, "width": 100, "height": 100}, "captionGroups": ["The signed presidential warrant set Crundwell's sentence of confinement", "to expire on December 22, 2024."], "spokenStart": 260.88, "spokenEnd": 266.76, "cues": [{"start": 260.88, "end": 265.55764705882353, "text": "The signed presidential warrant set\nCrundwell's
